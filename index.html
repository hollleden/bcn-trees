в, расположенных в два ряда, ограничивающих центральную аллею на площади Саграда-Фамилия.","drh":"Жакаранда мимозолистная — декоративное дерево из Южной Америки с перистыми листьями и густыми синими цветами. Цветёт в конце весны.","cn":"0127-02-97","cy":"1997","by":"1927","cd":"9 m","tp":"1,1 m","ow":"Públic"},{"n":"Washingtònies de la plaça Francesc Macià","ne":"","sr":"Вашингтония нитеносная","r":"вошингтония","nru":"Вашингтония нитеносная площади Francesc Macià","s":"Washingtonia filifera","la":41.39285648831325,"ln":2.143731048321865,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251013340026-04-93_1.optimized.7f3ba145.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-placa-francesc-macia-99400454982","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Pl Francesc Macià 6","dr":"La washingtonia de California, más esbelta que la de México, es una de las palmeras más comunes en la ciudad. Este grupo está formado por tres ejemplares situados en plena avenida Diagonal, delante de la plaza de Francesc Macià, aunque no siempre han estado ubicadas aquí. Inicialmente estaban plantadas en la plaza de la Universidad, a modo de pantalla vegetal detrás del monumento al Doctor Robert. Después de soportar las obras del metro de 1925, las tuvieron que trasplantar a la ubicación actual, debido a la remodelación de las infraestructuras de la red y a las estaciones de ferrocarril subterráneas.","drl":"Калифорнийская вашингтония, более стройная, чем мексиканская, — одна из самых распространённых пальм в городе. Эта группа состоит из трёх экземпляров, расположенных прямо на проспекте Диагональ, перед площадью Франсеска Масии, хотя не всегда они находились здесь. Первоначально они были посажены на площади Университета в качестве растительной ширмы за памятником доктору Роберту. Пережив строительство метро 1925 года, их пришлось пересадить на нынешнее место из-за реконструкции инфраструктуры сети и подземных железнодорожных станций.","drh":"Вашингтония нитеносная — пальма с веерными листьями и «юбкой» из сухих листьев на стволе. Из Калифорнии.","cn":"0026-04-93","cy":"1993","by":"1903","cd":"7 m","tp":"2 m","ow":"Públic"},{"n":"Arbreda de la plaça del Nord","ne":"","sr":"Типуана","r":"типуана","nru":"Типуана площади Nord","s":"Tipuana tipu","la":41.40719748989079,"ln":2.155587021348904,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031159440049-06-93_Tipuana-tipu_6-7732.optimized.4e778d27.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbreda-de-la-placa-del-nord-99400454991","d":"Gràcia","h":"la Vila de Gràcia","a":"Plaça del Nord 7","dr":"La tipuana es un árbol originario de América del Sur que fue introducido en la ciudad a principios del siglo XX. Actualmente es una de las especies más comunes en nuestra ciudad. Este conjunto está integrado por ejemplares de tipuanas y jacarandás (Jacaranda mimosifolia) y ocupa la plaza del Nord, en pleno barrio de Gràcia.","drl":"Типуана — дерево родом из Южной Америки, которое было завезено в город в начале XX века. В настоящее время это один из самых распространённых видов в нашем городе. Эта группа состоит из экземпляров типуан и жакаранд (Jacaranda mimosifolia) и занимает площадь Норд, в самом сердце района Грасия.","drh":"Типуана — южноамериканское дерево с перистыми листьями и жёлтыми цветами. Хорошо переносит городские условия.","cn":"0049-06-93","cy":"1993","by":"1953","cd":"10 m","tp":"1,5 m","ow":"Públic"},{"n":"Pi pinyer de la Travessera de les Corts","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.38613749133268,"ln":2.133949053096981,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610161459320001-04-93_11.optimized.751739b7.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-de-la-travessera-de-les-corts-99400454994","d":"Les Corts","h":"les Corts","a":"Travessera de les Corts 275","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Este ejemplar se encuentra aislado en plena Travessera de les Corts. A pesar de la agresiva urbanización del entorno, se ha mantenido como testimonio de los grandes pinos piñoneros que había en esta zona.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Этот экземпляр стоит особняком прямо на Траверсера-де-лес-Кортс. Несмотря на агрессивную застройку окрестностей, он сохранился как свидетель больших пиний, росших в этой зоне.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0001-04-93","cy":"1993","by":"1893","cd":"16 m","tp":"2,7 m","ow":"Públic"},{"n":"Pins canaris del Col·legi de les Teresianes","ne":"","sr":"Сосна канарская","r":"сосна","nru":"Сосна канарская","s":"Pinus canariensis","la":41.39946748321855,"ln":2.133383037287883,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061328410072-05-94_11.optimized.48a13f4a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pins-canaris-del-collegi-de-les-teresianes-99400454999","d":"Sarrià-Sant Gervasi","h":"les Tres Torres","a":"Ronda del General Mitre 81","dr":"El pino canario es originario de las islas Canarias, donde ocupa una pequeña área de forma natural. Sin embargo, encontramos esta especie plantada por todas partes, ya que crece fácilmente. Hay dos ejemplares de grandes proporciones en los jardines del Colegio de las Teresianas.","drl":"Канарская сосна родом с Канарских островов, где в естественных условиях занимает небольшой ареал. Однако мы встречаем этот вид посаженным повсюду, поскольку он легко растёт. В садах колледжа Терезианок находятся два экземпляра больших пропорций.","drh":"Сосна канарская — хвойное дерево с длинной хвоей (до 30 см). Эндемик Канарских островов.","cn":"0072-05-94","cy":"1994","by":"1934","cd":"7 m","tp":"1,8","ow":"Privat"},{"n":"Pi  Josep de Vallcarca","ne":"","sr":"Сосна алеппская","r":"сосна","nru":"Сосна алеппская","s":"Pinus halepensis","la":41.41368648005759,"ln":2.146674030514383,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610051117520141-06-03_1.optimized.f39f78a4.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-josep-de-vallcarca-99400455000","d":"Gràcia","h":"Vallcarca i els Penitents","a":"Passatge d'Isabel 1","dr":"El pino carrasco es un árbol autóctono presente en toda el área mediterránea. Este ejemplar está en un jardín privado, pero se puede ver desde la calle. Su buen estado se debe al cuidado que le proporcionan los propietarios de la finca donde se encuentra, los cuales lo llaman el pino Josep, en honor al padre del propietario, que fue quien lo plantó.","drl":"Алеппская сосна — местное дерево, встречающееся по всей средиземноморской зоне. Этот экземпляр находится в частном саду, но его можно увидеть с улицы. Хорошим состоянием он обязан заботе владельцев участка, на котором находится; они называют его сосной Жузеп — в честь отца владельца, который её и посадил.","drh":"Сосна алеппская — хвойное дерево, характерное для Средиземноморья. Устойчива к жаре и засухе.","cn":"0141-06-03","cy":"203","by":"1940","cd":"12 m","tp":"2 m","ow":"Privat"},{"n":"Pi blanc de Can Ponsic","ne":"","sr":"Сосна алеппская","r":"сосна","nru":"Сосна алеппская","s":"Pinus halepensis","la":41.39643696943802,"ln":2.118764544883283,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061407350155-05-12_1.optimized.d2953e34.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-blanc-de-can-ponsic-99400455005","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer d'Enric Giménez 14","dr":"El pino carrasco es un árbol autóctono presente en toda el área mediterránea. Alto, rectilíneo y equilibrado, este ejemplar destaca delante del edificio de Can Ponsic, donde hay la Escuela Municipal de Música de Can Ponsic y la sede de la unidad territorial de la Guardia Urbana del distrito de Sarrià-Sant Gervasi. El conjunto arquitectónico, que incluye también un pequeño jardín histórico público, se considera bien de interés cultural.","drl":"Алеппская сосна — местное дерево, встречающееся по всей средиземноморской зоне. Высокий, прямой и уравновешенный, этот экземпляр выделяется перед зданием Кан-Понсик, где находятся Муниципальная музыкальная школа Кан-Понсик и штаб территориального подразделения Городской гвардии района Сарриа-Сант-Жерваси. Архитектурный ансамбль, включающий также небольшой исторический общественный сад, считается объектом культурного интереса.","drh":"Сосна алеппская — хвойное дерево, характерное для Средиземноморья. Устойчива к жаре и засухе.","cn":"0155-05-12","cy":"2012","by":"Per determinar","cd":"19","tp":"3,1 m","ow":"Públic"},{"n":"Freixe de fulla estreta del carrer Tàrrega","ne":"","sr":"Ясень узколистный","r":"ясень","nru":"Ясень узколистный","s":"Fraxinus angustifolia","la":41.437655494196115,"ln":2.205990972605452,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111244350029-09-93_1.optimized.7e565180.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/freixe-de-fulla-estreta-del-carrer-tarrega-99400455007","d":"Sant Andreu","h":"el Bon Pastor","a":"Carrer de Tàrrega 41","dr":"El fresno de hoja estrecha es un árbol autóctono que crece de forma natural en los bosques de ribera. Este ejemplar, de dimensiones notables, está en un alcorque de la calle de Tàrrega, indudablemente testimonio de la zona antes de su urbanización.","drl":"Узколистный ясень — местное дерево, которое естественным образом растёт в приречных лесах. Этот экземпляр значительных размеров находится в приствольной лунке на улице Таррега, несомненно являясь свидетелем этой зоны до её застройки.","drh":"Ясень узколистный — листопадное дерево с перистыми листьями. Растёт по берегам рек, ценится за упругую древесину.","cn":"0029-09-93","cy":"1993","by":"1943","cd":"9 m","tp":"2,5 m","ow":"Públic"},{"n":"Freixes de la plaça Gal·la Placídia","ne":"","sr":"Ясень пенсильванский","r":"ясень","nru":"Ясень пенсильванский площади Gal·la Placídia","s":"Fraxinus pennsylvanica","la":41.39925449379175,"ln":2.152910032844557,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031306200009-06-93_1.optimized.9c9d12b5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/freixes-de-la-placa-galla-placidia-99400455009","d":"Gràcia","h":"la Vila de Gràcia","a":"Plaça de Gal·la Placídia 16","dr":"El fresno rojo americano es común de las zonas inundables del este de Norteamérica. En nuestra ciudad es muy poco habitual. En este caso, tenemos un conjunto de ocho ejemplares, situados en la plaza de Gal·la Placídia.","drl":"Американский красный ясень распространён в заливаемых зонах востока Северной Америки. В нашем городе он встречается очень редко. В данном случае перед нами группа из восьми экземпляров, расположенных на площади Галла-Пласидия.","drh":"Ясень пенсильванский — североамериканский вид, растёт на влажных почвах. В Европе редкий гость.","cn":"0009-06-93","cy":"1993","by":"1933","cd":"10 m","tp":"2,2 m","ow":"Públic"},{"n":"Noguera amb ales del Jardí Botànic Històric","ne":"","sr":"Лапина Реддера","r":"крылатолистник","nru":"Лапина Реддера","s":"Pterocarya x rehderiana","la":41.36690322469188,"ln":2.152224885352358,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041347050169-03-15_1.optimized.47c03a34.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/noguera-amb-ales-del-jardi-botanic-historic-99400637930","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda dels Montanyans 30","dr":"La Pterocarya × rehderiana es un híbrido de dos tipos de nogales alóctonos, el nogal del Cáucaso (Pterocarya fraxinifolia), originario del Cáucaso, como su nombre común da a entender, y la Pterocarya stenoptera, originaria de China. Este ejemplar, de grandes dimensiones y muy poco frecuente en Barcelona, crece en la parte inferior del Jardín Botánico Histórico.","drl":"Pterocarya × rehderiana — это гибрид двух видов чужеродных орехов: кавказской лапины (Pterocarya fraxinifolia), родом с Кавказа, как и подсказывает её общее название, и Pterocarya stenoptera, родом из Китая. Этот экземпляр больших размеров и очень редкий в Барселоне растёт в нижней части Исторического ботанического сада.","drh":"Лапина Реддера — крупное дерево с перистыми листьями и длинными серёжками с крылатками. Гибрид кавказской и китайской лапины.","cn":"","cy":"2015","by":"","cd":"27 m","tp":"4,1 m","ow":""},{"n":"Figueres del parc de les Aigües","ne":"","sr":"Инжир","r":"фикус","nru":"Инжир парка Aigües","s":"Ficus carica","la":41.41337948974774,"ln":2.16529602212612,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121142560119-07-96_1.optimized.10342b61.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/figueres-del-parc-de-les-aigues-99400455012","d":"Horta-Guinardó","h":"el Baix Guinardó","a":"Carrer d'Abd el-Kader 2","dr":"La higuera es uno de los árboles frutales con más tradición de toda la región mediterránea, cultivado desde hace miles de años. En este caso, el ejemplar está en un parterre justo en el centro del parque de las Aigües, en el Guinardó. Este ejemplar de más de 100 años, acompañado de otros de la misma especie, proviene del antiguo vivero de Aigües de Barcelona. El ejemplar propuesto tiene unas dimensiones destacables con respecto a las otras higueras de la ciudad.","drl":"Инжир — одно из плодовых деревьев с наибольшей традицией во всём Средиземноморском регионе, возделываемое тысячи лет. В данном случае экземпляр находится на клумбе прямо в центре парка Айгуэс, в Гинардо. Этот экземпляр возрастом более 100 лет, в сопровождении других того же вида, происходит из старого питомника «Агуас де Барселона». Предлагаемый экземпляр имеет заметные размеры по сравнению с другими инжирными деревьями города.","drh":"Инжир — листопадное дерево с пальчатыми листьями и сладкими плодами. Одно из древнейших культурных растений Средиземноморья.","cn":"0119-07-96","cy":"1996","by":"1896","cd":"10 m","tp":"2,2 m","ow":"Públic"},{"n":"Còcul de la Clínica Corachan","ne":"","sr":"Коккулюс лавролистный","r":"Cocculus","nru":"Коккулюс лавролистный","s":"Cocculus laurifolius","la":41.39348748344528,"ln":2.130363051033857,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061335300134-05-98_1.optimized.2eb25e23.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cocul-de-la-clinica-corachan-99400455023","d":"Sarrià-Sant Gervasi","h":"les Tres Torres","a":"Carrer de Gironella 2","dr":"Originario de Japón, China y el Himalaya, el cóculo era corriente en los jardines de principios de siglo. Ejemplar con un gran desarrollo aéreo, ocupa un parterre en la entrada de la Clínica Corachan, en la calle de Buïgas.","drl":"Родом из Японии, Китая и Гималаев, кокулюс был обычным растением в садах начала века. Экземпляр с большим надземным развитием занимает клумбу у входа в клинику Корачан на улице Буйгас.","drh":"Коккулюс лавролистный — вечнозелёный кустарник или небольшое дерево. Родом из Азии, с ароматными листьями.","cn":"0134-05-98","cy":"1998","by":"1918","cd":"23 m","tp":"2 m","ow":"Privat"},{"n":"Cedre de la Torre Castanyer","ne":"","sr":"Кедр гималайский","r":"Cedrus","nru":"Кедр гималайский башни Castanyer","s":"Cedrus deodara","la":41.40814247633189,"ln":2.1341830347850688,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121321130069-05-94_1.optimized.ace5cf97.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cedre-de-la-torre-castanyer-99400455026","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Passeig de Sant Gervasi 5","dr":"El cedro del Himalaya es una especie de conífera originaria del oeste del Himalaya que puede llegar a los 50 m de altura. Este ejemplar pertenece al jardín privado de la Torre Castanyer, una finca residencial del barrio de Sant Gervasi-la Bonanova. El ejemplar es perfectamente visible desde el paseo de la Bonanova. Destaca por su desarrollo limpio y potente, con varias ramas ramificadas desde la base.","drl":"Гималайский кедр — вид хвойных, родом с запада Гималаев, который может достигать 50 м в высоту. Этот экземпляр принадлежит частному саду Торре-Кастаньер, жилого поместья района Сант-Жерваси — Ла-Бонанова. Экземпляр отлично виден с проспекта Бонанова. Он выделяется чистым и мощным развитием, с несколькими ветвями, расходящимися от самого основания.","drh":"Кедр гималайский — величественное хвойное дерево высотой до 50 м с поникающими ветвями. Происходит из западных Гималаев.","cn":"0069-05-94","cy":"1994","by":"1904","cd":"17 m","tp":"4,3 m","ow":"Privat"},{"n":"Casuarina del parc de la Ciutadella","ne":"","sr":"Казуарина Каннингема","r":"казуарина","nru":"Казуарина Каннингема парка Ciutadella","s":"Casuarina cunninghamiana","la":41.389409514534115,"ln":2.1873159291373465,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201321190051-01-94_1.optimized.0291c0bb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/casuarina-del-parc-de-la-ciutadella-99400455029","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Passeig de Pujades 16","dr":"La casuarina, a pesar de que se parece a una conífera, pertenece a una familia muy lejana. Las acículas que vemos, realmente son pequeñas ramitas con hojas minúsculas. El ejemplar, situado junto a la cascada, en el parque de la Ciutadella, ofrece un aspecto imponente. Tiene dos troncos unidos en la parte inferior que se bifurcan a 90 cm del suelo para formar una copa armoniosa y redondeada.","drl":"Казуарина, хотя и похожа на хвойное, относится к очень далёкому семейству. Хвоинки, которые мы видим, на самом деле — маленькие веточки с крошечными листьями. Экземпляр, расположенный рядом с водопадом, в парке Сьютаделья, производит внушительное впечатление. У него два ствола, соединённых в нижней части, которые разветвляются на высоте 90 см от земли, образуя гармоничную округлую крону.","drh":"Казуарина Каннингема — дерево с хвоеподобными веточками, не родственник хвойных. Родом из Австралии.","cn":"0051-01-94","cy":"1994","by":"1894","cd":"20 m","tp":"5,5 m","ow":"Públic"},{"n":"Camforer del Jardí Botànic Històric","ne":"","sr":"Камфорное дерево","r":"Cinnamomum","nru":"Камфорное дерево сада Botànic Històric","s":"Cinnamomum camphora","la":41.36728450363839,"ln":2.1533280620606194,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061313240024-03-93_1.optimized.e94bc8de.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/camforer-del-jardi-botanic-historic-99400455032","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda dels Montanyans 30","dr":"El alcanforero, originario del sureste asiático, es un árbol perenne muy longevo conocido porque del tronco se obtiene el alcanfor. Este ejemplar, el mayor de Barcelona, está en el Jardín Botánico Histórico, cerca de la Masía.","drl":"Камфорное дерево, родом из Юго-Восточной Азии, — очень долговечное вечнозелёное дерево, известное тем, что из его ствола получают камфару. Этот экземпляр, самый крупный в Барселоне, находится в Историческом ботаническом саду, рядом с усадьбой.","drh":"Камфорное дерево — вечнозелёное дерево родом из Азии. Источник камфоры, ценится за аромат.","cn":"0024-03-93","cy":"1993","by":"1933","cd":"27 m","tp":"4,4 m","ow":"Privat"},{"n":"Bellaombra de la plaça Francesc Macià","ne":"","sr":"Фитолакка (омбу)","r":"фитолакка (омбу)","nru":"Фитолакка (омбу) площади Francesc Macià","s":"Phytolacca dioica","la":41.39261849047966,"ln":2.1443540455565024,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610191102510061-02-94_1.optimized.7b027c44.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/bellaombra-de-la-placa-francesc-macia-99400455037","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Plaça de Francesc Macià 9999","dr":"Este árbol, originario de las pampas de América del Sur, se caracteriza por un gran desarrollo en anchura, tanto de las raíces como de la copa. Este ejemplar destaca por sus proporciones y por el protagonismo que tiene en la composición de la plaza de Francesc Macià.","drl":"Это дерево, родом из пампы Южной Америки, отличается большим развитием вширь, как корней, так и кроны. Этот экземпляр выделяется своими пропорциями и ролью, которую он играет в композиции площади Франсеска Масии.","drh":"Омбу — южноамериканское вечнозелёное дерево с мощным стволом и мочковатой корневой системой; «благородное тень дающее дерево».","cn":"0061-02-94","cy":"1994","by":"1914","cd":"24 m","tp":"6 m","ow":"Públic"},{"n":"Eucaliptus blanc del passeig de la Bonanova","ne":"","sr":"Эвкалипт шаровидный","r":"эвкалипт","nru":"Эвкалипт шаровидный","s":"Eucalyptus globulus","la":41.40531220570056,"ln":2.130866247290221,"im":"","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-blanc-del-passeig-de-la-bonanova-99400637914","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Passeig de la Bonanova 22","dr":"Descripción no disponible en la ficha oficial. Consulte el enlace «IR A LA FICHA» para más información.","drl":"Описание в официальной карточке недоступно. Для получения дополнительной информации воспользуйтесь ссылкой «ПЕРЕЙТИ К КАРТОЧКЕ».","drh":"Эвкалипт шаровидный — высокое быстрорастущее дерево с корой, свисающей длинными полосами. Одно из самых высоких деревьев мира.","cn":"0165-05-14","cy":"2014","by":"Per determinar","cd":"20 m","tp":"3,9 m","ow":""},{"n":"Om siberià del carrer Llull","ne":"","sr":"Вяз мелколистный","r":"Ulmus","nru":"Вяз мелколистный","s":"Ulmus pumila","la":41.408555474383874,"ln":2.211764959130312,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041351570168-10-15_1.optimized.39018dfb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/om-siberia-del-carrer-llull-99400637928","d":"Sant Martí","h":"Diagonal Mar i el Front Marítim del Poblenou","a":"Carrer de Llull 353","dr":"El olmo de Siberia es una especie de crecimiento rápido, no muy longeva e históricamente muy utilizada en arbolado viario. El ejemplar catalogado está situado en el límite de un solar de tierra, utilizado actualmente como aparcamiento. En las inmediaciones tenemos dos ejemplares de menor magnitud. El ejemplar tiene una copa esférica y de grandes dimensiones, lo que lo convierte en un ejemplar único en la ciudad.","drl":"Сибирский вяз — быстрорастущий вид, не очень долговечный и исторически широко использовавшийся в уличном озеленении. Внесённый в каталог экземпляр расположен на краю земельного участка, используемого в настоящее время как парковка. Поблизости находятся два экземпляра меньшей величины. Экземпляр имеет сферическую крону больших размеров, что делает его уникальным в городе.","drh":"Вяз мелколистный — быстрорастущее листопадное дерево из Сибири и Восточной Азии. Устойчив к голландской болезни вязов.","cn":"0168-10-15","cy":"2015","by":"Per determinar","cd":"28 m","tp":"3,3 m","ow":""},{"n":"Corísies de Drassanes","ne":"","sr":"Сейба прекрасная","r":"хоризия (шелковое дерево)","nru":"Сейба прекрасная","s":"Ceiba speciosa","la":41.37478651057665,"ln":2.1756280368912893,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201327370104-01-96_1.optimized.f0985c46.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/corisies-de-drassanes-99400455040","d":"Ciutat Vella","h":"el Raval","a":"Av Paral·lel 2","dr":"El palo borracho es originario de los bosques tropicales y subtropicales de América del Sur. Pertenece a la misma familia botánica que el baobab. Este conjunto lo forman cuatro ejemplares y son testimonios de un hecho reciente en la historia de la ciudad: los Juegos Olímpicos. Se estima que su edad real es de 80 años y tienen interés estético por su espectacular floración, que se produce durante el otoño, y los sorprendentes troncos espinosos abombados.","drl":"Бутылочное дерево родом из тропических и субтропических лесов Южной Америки. Оно принадлежит к тому же ботаническому семейству, что и баобаб. Эта группа состоит из четырёх экземпляров и является свидетелем недавнего события в истории города — Олимпийских игр. Считается, что их реальный возраст составляет 80 лет, и они представляют эстетический интерес благодаря эффектному цветению, происходящему осенью, и удивительным вздутым колючим стволам.","drh":"Сейба прекрасная (хоризия) — южноамериканское дерево с колючим толстым стволом и розовыми цветами. Родственник баобаба.","cn":"0104-01-96","cy":"1996","by":"1916","cd":"10 m","tp":"3 m","ow":"Públic"},{"n":"Magnòlies dels jardins del claustre de la Catedral","ne":"","sr":"Магнолия крупноцветковая","r":"магнолия","nru":"Магнолия крупноцветковая садов claustre de la Catedral","s":"Magnolia grandiflora","la":41.38385350918655,"ln":2.176055038681717,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200936400050-01-93_2.optimized.8d974d17.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/magnolies-dels-jardins-del-claustre-de-la-catedral-99400455059","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Carrer del Bisbe 10","dr":"La magnolia es un árbol perennifolio de grandes dimensiones originario del sureste de los Estados Unidos. En 1877, en la última remodelación del jardín del claustro, se plantaron las magnolias actuales, que hoy son altísimas. Durante muchos años, naranjos, cipreses, limoneros, laureles, olivos, rosales y algunas hierbas aromáticas ornaron el espacio ajardinado, siempre con la presencia de animales diversos, que actualmente son ocas.","drl":"Магнолия — вечнозелёное дерево больших размеров, родом с юго-востока Соединённых Штатов. В 1877 году, при последней реконструкции сада клуатра, были посажены нынешние магнолии, которые сегодня очень высоки. В течение многих лет апельсиновые деревья, кипарисы, лимонные деревья, лавры, оливы, розы и некоторые пряные травы украшали озеленённое пространство, всегда в присутствии различных животных, которыми сегодня являются гуси.","drh":"Магнолия крупноцветковая — вечнозелёное дерево с кожистыми листьями и огромными ароматными кремовыми цветами. Один из древнейших родов цветковых растений.","cn":"0050-01-93","cy":"1993","by":"1893","cd":"11 m","tp":"2,2 m","ow":"Privat"},{"n":"Taronger de Louisiana del carrer Maria Montessori","ne":"","sr":"Маклюра оранжевая","r":"Maclura","nru":"Маклюра оранжевая","s":"Maclura pomifera","la":41.37070450570238,"ln":2.1554290587931777,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061428300136-03-98_1.optimized.7b450207.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/taronger-de-louisiana-del-carrer-maria-montessori-99400455061","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer de Maria Montessori 1","dr":"Este árbol caducifolio es originario del sureste de los Estados Unidos. Destacan las ramas espinosas y los grandes frutos esféricos del tamaño de una naranja. Este ejemplar, de tronco bastante inclinado, se encuentra en un parterre en la calle de Maria Montessori, al pie de la montaña de Montjuïc.","drl":"Это листопадное дерево родом с юго-востока Соединённых Штатов. Выделяются колючие ветви и крупные сферические плоды размером с апельсин. Этот экземпляр с довольно наклонённым стволом находится на клумбе на улице Марии Монтессори, у подножия горы Монжуик.","drh":"Маклюра оранжевая — североамериканское дерево с колючими ветками и крупными плодами, похожими на апельсины. Несъедобны, но отпугивают насекомых.","cn":"0136-03-98","cy":"1998","by":"1948","cd":"15 m","tp":"1,4 m","ow":"Públic"},{"n":"Molles cendrosos del carrer Sant Pere Claver","ne":"","sr":"Шинус","r":"шинус","nru":"Шинус","s":"Schinus lentiscifolia","la":41.406438470318,"ln":2.1170700497171118,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061055400099-05-94_1.optimized.07eac391.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/molles-cendrosos-del-carrer-sant-pere-claver-99400455062","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer de Sant Pere Claver 13","dr":"El lentisco es una especie propia de las regiones mediterráneas. Normalmente presenta una forma arbustiva y raramente lo encontramos en forma de árbol. En este caso, se trata de un conjunto formado por seis ejemplares alineados en doble hilera. Configuran una agrupación de densidad notable que desborda la valla del jardín de propiedad privada. El conjunto ha alcanzado una altura de cinco metros y un desarrollo compacto.","drl":"Мастиковое дерево — вид, свойственный средиземноморским регионам. Обычно оно имеет кустарниковую форму, и в виде дерева мы встречаем его редко. В данном случае это группа из шести экземпляров, выстроенных в двойной ряд. Они образуют заметно плотную группу, выступающую за ограду сада частной собственности. Группа достигла высоты пять метров и компактного развития.","drh":"Шинус (перуанский перец) — вечнозелёное дерево с перистыми листьями и розовыми ягодами со сладковатым ароматом.","cn":"0099-05-94","cy":"1994","by":"1894","cd":"7 m","tp":"1,2 m","ow":"Privat"},{"n":"Robínia del parc de la Ciutadella","ne":"","sr":"Робиния лжеакация","r":"робиния (белая акация)","nru":"Робиния лжеакация парка Ciutadella","s":"Robinia pseudoacacia","la":41.388178466161484,"ln":2.1865965742841516,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/231.optimized.e8caf140.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/robinia-del-parc-de-la-ciutadella-99400761017","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 0","dr":"Fue una de las primeras especies no autóctonas introducidas como arbolado urbano en Europa. Procedente del este de los Estados Unidos, se adaptó rápidamente a nuestras latitudes. Este ejemplar es el de mayores dimensiones de Barcelona, seguramente uno de los últimos testimonios de la vegetación original de cuando se construyó el Parque de la Ciutadella, a finales del siglo XIX. Al lado tenemos otro ejemplar de notables dimensiones.","drl":"Это был один из первых неместных видов, введённых в качестве городского озеленения в Европе. Родом с востока Соединённых Штатов, он быстро приспособился к нашим широтам. Этот экземпляр — самый крупный в Барселоне, вероятно, один из последних свидетелей первоначальной растительности с тех времён, когда в конце XIX века строился парк Сьютаделья. Рядом находится ещё один экземпляр заметных размеров.","drh":"Робиния лжеакация (белая акация) — листопадное дерево из Северной Америки с душистыми белыми цветами. Отличный медонос.","cn":"0231-01-24","cy":"2024","by":"100 anys","cd":"9 m","tp":"4.3 m","ow":""},{"n":"Pins de fulla llarga del Himàlaia de la Ciutadella","ne":"","sr":"Сосна Роксбурга","r":"сосна","nru":"Сосна Роксбурга","s":"Pinus roxburghii","la":41.388178466161484,"ln":2.1865965742841516,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/232-2.optimized.bf7d5d2e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pins-de-fulla-llarga-del-himalaia-de-la-ciutadella-99400761021","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 0","dr":"Especie muy rara en nuestras tierras, es un pino originario de la India y del Himalaya, donde se utiliza mucho en las explotaciones forestales. De apariencia semejante al pino canario (Pinus canariensis), luce grandes ramilletes de acículas alargadas, agrupadas de tres en tres —todas las especies europeas, sin excepción, las presentan agrupadas por parejas—. Estos tres ejemplares se sitúan dentro del parque de la Ciutadella, delante del Umbráculo, construcción protegida como Bien Cultural de Interés Local.","drl":"Вид, очень редкий в наших краях, — сосна родом из Индии и Гималаев, где широко используется в лесозаготовках. По внешнему виду схожая с канарской сосной (Pinus canariensis), она демонстрирует крупные пучки удлинённой хвои, собранной по три — тогда как все европейские виды без исключения имеют хвою, собранную парами. Эти три экземпляра расположены в парке Сьютаделья, перед Умбракле, постройкой, охраняемой как объект культурного достояния местного значения.","drh":"Сосна Роксбурга — гималайский вид с длинной хвоей, собранной в пучки по три. В Европе — редкость.","cn":"0232-01-24","cy":"2024","by":"En estudi","cd":"7 m","tp":"1.9 m","ow":""},{"n":"Llentiscle dels Pavellons Güell","ne":"","sr":"Фисташка мастиковая","r":"Pistacia","nru":"Фисташка мастиковая","s":"Pistacia lentiscus","la":41.38846078233811,"ln":2.120846742834068,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/235.optimized.0f3c69d1.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/llentiscle-dels-pavellons-guell-99400761025","d":"Les Corts","h":"Pedralbes","a":"Avinguda de Pedralbes 7","dr":"Los pabellones Güell son una serie de edificaciones situadas en el distrito de Les Corts de Barcelona, obra de Antoni Gaudí y construidas entre 1884 y 1887. Los pabellones y la puerta norte, situados en la avenida de Pedralbes, fueron declarados monumento histórico-artístico en 1969. Las puertas sur y este se encuentran en el Campus de la Diagonal de la Universidad de Barcelona y están catalogadas como bien cultural de interés local. El lentisco es una especie autóctona propia de la vegetación mediterránea. A pesar de que es una especie típicamente arbustiva, este lentisco catalogado, situado en pleno centro de los jardines de los Pabellones, presenta unas medidas fuera de lo normal.","drl":"Павильоны Гуэль — это ряд построек, расположенных в районе Кортс в Барселоне, работы Антони Гауди, возведённых между 1884 и 1887 годами. Павильоны и северные ворота, расположенные на проспекте Педральбес, были объявлены историко-художественным памятником в 1969 году. Южные и восточные ворота находятся в кампусе Диагональ Барселонского университета и внесены в каталог как объект культурного достояния местного значения. Мастиковое дерево — местный вид, свойственный средиземноморской растительности. Несмотря на то что это типично кустарниковый вид, данное внесённое в каталог мастиковое дерево, расположенное прямо посреди садов Павильонов, имеет необычные для него размеры.","drh":"Фисташка мастиковая — вечнозелёный кустарник или небольшое дерево. Источник мастиковой смолы.","cn":"0235-04-24","cy":"2024","by":"Per determinar","cd":"9 m","tp":"0.8 m","ow":""},{"n":"Lledoner de la plaça Josep Andreu Abelló","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный площади Josep Andreu Abelló","s":"Celtis australis","la":41.44813904535071,"ln":2.1901318782346015,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610110913450164-09-13_1.optimized.d5d12e52.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-de-la-placa-josep-andreu-abello-99400455064","d":"Sant Andreu","h":"la Trinitat Vella","a":"Plaça de Josep Andreu i Abelló 4","dr":"El almez es un árbol originario del este de la región mediterránea, totalmente naturalizado en nuestro país. Es una de las especies más utilizadas en las calles de la ciudad. Los muros de la fábrica La Lija escondían este ejemplar de almez (Celtis australis), que quedó al descubierto con motivo del derribo de esta industria a raíz de unas obras en la ronda de Dalt. Sus dimensiones y copa, espectacular y equilibrada, fueron decisivos para decidir conservarlo y lo trasladaron a un nuevo espacio: la plaza de Josep Andreu i Abelló.","drl":"Каркас — дерево родом с востока Средиземноморского региона, полностью натурализовавшееся в нашей стране. Это один из самых используемых видов на улицах города. Стены фабрики «Ла Лиха» скрывали этот экземпляр каркаса (Celtis australis), который оказался открытым в связи со сносом этого предприятия в результате работ на кольцевой Ронда-де-Дальт. Его размеры и крона, эффектная и уравновешенная, стали решающими для решения сохранить его, и его перенесли на новое место: площадь Жузеп-Андреу-и-Абельо.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0164-09-13","cy":"2013","by":"1925","cd":"16 m","tp":"3,4 m","ow":"Públic"},{"n":"Ginjoler del carrer Arimon","ne":"","sr":"Зизифус (унаби)","r":"зизифус (унаби)","nru":"Зизифус (унаби) улицы Arimon","s":"Ziziphus jujuba","la":41.40472647765219,"ln":2.137257038679137,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251121490148-05-07_2.optimized.cb0eca1b.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ginjoler-del-carrer-arimon-99400455076","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer d'Arimon 14","dr":"El azufaifo es un árbol de cultivo agrícola antiquísimo originario del sur y el este de Asia, aunque también lo conocían y cultivaban los griegos, los romanos y los árabes, los cuales presumiblemente lo introdujeron en la península Ibérica. Se cultivaba por motivos frutícolas, pero también se valora la calidad de su madera, que tiene diferentes utilidades (por ejemplo, en Catalunya se utiliza para hacer instrumentos musicales como las gralles y las tenores). El fruto, que se come fresco o seco, dio pie a un conocido dicho catalán: “Més content que un gínjol“ (Más contento que una azufaifa). Este ejemplar, situado en una pequeña placita de la calle de Arimon, evoca el pasado agrícola y de jardines del antiguo municipio de Sant Gervasi. Es el mayor de los documentados en la ciudad y probablemente en Cataluña.","drl":"Зизифус (унаби) — древнейшая сельскохозяйственная культура, родом с юга и востока Азии, хотя его знали и возделывали также греки, римляне и арабы, которые, предположительно, и ввели его на Пиренейском полуострове. Его выращивали ради плодов, но ценится и качество его древесины, которая находит разное применение (например, в Каталонии из неё делают музыкальные инструменты — гралья и тенора). Плод, который едят свежим или сушёным, породил известную каталонскую поговорку: «Més content que un gínjol» («Радостнее, чем зизифус»). Этот экземпляр, расположенный на небольшой площади улицы Аримон, напоминает о сельскохозяйственном и садовом прошлом старого муниципалитета Сант-Жерваси. Это самый крупный из документированных в городе и, вероятно, в Каталонии.","drh":"Зизифус (унаби) — небольшое листопадное дерево с колючими ветвями и сладкими плодами. Культивируется тысячи лет в Азии.","cn":"0148-05-07","cy":"2007","by":"1857","cd":"18 m","tp":"1,9 m","ow":"Privat"},{"n":"Garrofer del viaducte del Park Güell","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево","s":"Ceratonia siliqua","la":41.41509448634,"ln":2.153682025205545,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031204000036-06-93_4.optimized.7a202622.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-del-viaducte-del-park-guell-99400455077","d":"Gràcia","h":"la Salut","a":"Carretera del Carmel 23","dr":"Los algarrobos y tantas otras plantas originarias de la finca, de aspecto típicamente mediterráneo, fueron escrupulosamente respetados por Gaudí durante las obras de construcción del Park Güell, de 1900 a 1903. Las plantas y la arquitectura se reúnen en una auténtica unidad paisajística. El viejo algarrobo, arraigado —y respetado— bajo la triple columnata de los viaductos, de tronco retorcido en busca de luz, es la imagen de esta concepción gaudiniana.","drl":"Рожковые деревья и многие другие растения, родом из этого имения, с типично средиземноморским обликом, были тщательно сохранены Гауди во время строительства парка Гуэль, в 1900–1903 годах. Растения и архитектура сливаются в подлинное ландшафтное единство. Старое рожковое дерево, укоренившееся — и сохранённое — под тройной колоннадой виадуков, со стволом, изогнувшимся в поисках света, — это образ такой гаудианской концепции.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0036-06-93","cy":"1993","by":"1893","cd":"10 m","tp":"2,2 m","ow":"Públic"},{"n":"Tarongers de l'esglèsia de Sant Martí de Provençals","ne":"","sr":"Померанец (горький апельсин)","r":"цитрусовое дерево","nru":"Померанец (горький апельсин)","s":"Citrus aurantium","la":41.42078750028179,"ln":2.196930000123577,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111236250033-10-93-Citrus-auramtium_WEB.optimized.b2873295.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tarongers-de-l-esglesia-de-sant-marti-de-provencals-99400454947","d":"Sant Martí","h":"Sant Martí de Provençals","a":"Plaça d'Ignasi Juliol 4","dr":"El naranjo amargo es un cítrico híbrido que introdujeron los árabes en Occidente durante el siglo X. El conjunto catalogado está formado por diez ejemplares distribuidos en dos filas paralelas en los jardines de la iglesia de Sant Martí de Provençals.","drl":"Померанец (горький апельсин) — гибридный цитрус, который арабы ввели на Западе в X веке. Внесённая в каталог группа состоит из десяти экземпляров, расположенных двумя параллельными рядами в садах церкви Сант-Март-де-Провенсальс.","drh":"Померанец (горький апельсин) — вечнозелёное цитрусовое дерево с ароматными цветами и горькими плодами. Из них делают мармелад и ликёры.","cn":"0033-10-93","cy":"1993","by":"1958","cd":"4 m","tp":"0,6 m","ow":"Privat"},{"n":"Parasenegàlies de la plaça Molina","ne":"","sr":"Парасенегалия клейкая","r":"Parasenegalia","nru":"Парасенегалия клейкая площади Molina","s":"Parasenegalia visco","la":41.40100648635573,"ln":2.147076035758058,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251127020151-05-10_1.optimized.cb5eb619.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/parasenegalies-de-la-placa-molina-99400454950","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Plaça de Molina 9999","dr":"A pesar del nombre científico, este árbol es propio de América del Sur, aunque ha sido introducido en África. En nuestra ciudad no se tiene conocimiento de ningún otro ejemplar de esta especie. El conjunto catalogado lo forman tres ejemplares de una altura considerable, situados en la plaza Molina. Estos árboles se trasplantaron a la ubicación actual, procedentes de la plaza de Gal·la Placídia.","drl":"Несмотря на научное название, это дерево свойственно Южной Америке, хотя и было завезено в Африку. В нашем городе не известно ни одного другого экземпляра этого вида. Внесённая в каталог группа состоит из трёх экземпляров значительной высоты, расположенных на площади Молина. Эти деревья были пересажены на нынешнее место с площади Галла-Пласидия.","drh":"Парасенегалия клейкая — южноамериканское дерево, родственное акации. Редкий вид в европейских городах.","cn":"0151-05-10","cy":"2010","by":"1929","cd":"17 m","tp":"1,7 m","ow":"Públic"},{"n":"Huingan del carrer Joaquim Blume","ne":"","sr":"Шинус длиннолистный","r":"шинус","nru":"Шинус длиннолистный улицы Joaquim Blume","s":"Schinus longifolia","la":41.37211150551578,"ln":2.155331054511639,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251243200110-03-96_11.optimized.b604d403.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/huingan-del-carrer-joaquim-blume-99400454952","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer de Joaquim Blume 2","dr":"El Schinus polygamus , originario de América del Sur, es una rareza botánica en nuestra ciudad. Es el único ejemplar que hay plantado en Barcelona como árbol viario. Solo encontramos otro ejemplar, más grande, en el jardín de Aclimatación.","drl":"Schinus polygamus, родом из Южной Америки, — ботаническая редкость в нашем городе. Это единственный экземпляр, посаженный в Барселоне как уличное дерево. Мы находим лишь ещё один, более крупный, в саду Аклиматасьо.","drh":"Шинус длиннолистный — южноамериканское вечнозелёное дерево с перистыми листьями. Ботаническая редкость в Европе.","cn":"0110-03-96","cy":"1996","by":"1916","cd":"9 m","tp":"1,6 m","ow":"Públic"},{"n":"Roure cerrioide de la Font de Les Planes","ne":"","sr":"Дуб керриоидный","r":"дуб","nru":"Дуб керриоидный","s":"Quercus x cerrioides","la":41.42863299197756,"ln":2.0894947825270096,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251112300156-05-12-web.optimized.eea7179f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-cerrioide-de-la-font-de-les-planes-99400454954","d":"Sarrià-Sant Gervasi","h":"Vallvidrera, el Tibidabo i les Planes","a":"Carretera de Vallvidrera a les Planes 107","dr":"El roble cerrioide se considera un cruce entre el roble pubescente y el quejigo, y presenta unas características intermedias entre estas dos especies. Su área de distribución se circunscribe a la península Ibérica. El ejemplar catalogado está en el centro de la terraza del restaurante Font de les Planes. Su tamaño y dimensiones ofrecen refugio y cobijo a los visitantes del entorno, y la monumental copa le confiere una singularidad especial.","drl":"Дуб церриоидный считается гибридом пушистого дуба и португальского дуба и обладает промежуточными признаками между этими двумя видами. Ареал его распространения ограничен Пиренейским полуостровом. Внесённый в каталог экземпляр находится в центре террасы ресторана «Фонт-де-лес-Планес». Его размер и габариты дают укрытие и приют посетителям этого места, а монументальная крона придаёт ему особую исключительность.","drh":"Дуб — мощное листопадное дерево с крепкой древесиной и желудями; одни из самых долговечных деревьев Европы.","cn":"0156-05-12","cy":"2012","by":"1812","cd":"23 m","tp":"2,8 m","ow":"Privat (accés públic)"},{"n":"Arbres de l'amor de la plaça Joanic","ne":"","sr":"Церцис (Иудино дерево)","r":"церцис (багрянник)","nru":"Церцис (Иудино дерево)","s":"Cercis siliquastrum","la":41.40563249016595,"ln":2.1622600198868445,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031323050118-06-96_5.optimized.4cfaff2a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbres-de-l-amor-de-la-placa-joanic-99400455041","d":"Gràcia","h":"la Vila de Gràcia","a":"Carrer de Bruniquer 59","dr":"El ciclamor es un árbol caducifolio originario del Mediterráneo oriental y debe su nombre común a la forma de corazón de sus hojas. Se trata de dos ejemplares de edad adelantada situados en la plaza de Joanic.","drl":"Церцис — листопадное дерево, родом из восточного Средиземноморья, обязанное своим общим названием сердцевидной форме листьев. Это два экземпляра преклонного возраста, расположенные на площади Жоаник.","drh":"Церцис европейский (Иудино дерево) — листопадное дерево с сердцевидными листьями и розовыми цветами, которые появляются прямо на стволе.","cn":"0118-06-96","cy":"1996","by":"1956","cd":"10 m","tp":"1,8 m","ow":"Públic"},{"n":"Arbre de l'amor del Turó de la Rovira","ne":"","sr":"Церцис (Иудино дерево)","r":"церцис (багрянник)","nru":"Церцис (Иудино дерево)","s":"Cercis siliquastrum","la":41.41905548781988,"ln":2.1643170113673067,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121256330080-07-94_1.optimized.bc5a8afd.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbre-de-l-amor-del-turo-de-la-rovira-99400455042","d":"Horta-Guinardó","h":"Can Baró","a":"Carrer del Panorama 25","dr":"El ciclamor es un árbol caducifolio originario del Mediterráneo oriental y debe su nombre común a la forma de corazón de sus hojas. Se trata de un ejemplar viejo situado en una zona de transición entre la parte urbana y la zona forestal del Turó de la Rovira.","drl":"Церцис — листопадное дерево, родом из восточного Средиземноморья, обязанное своим общим названием сердцевидной форме листьев. Это старый экземпляр, расположенный в переходной зоне между городской частью и лесной зоной Туро-де-ла-Ровира.","drh":"Церцис европейский (Иудино дерево) — листопадное дерево с сердцевидными листьями и розовыми цветами, которые появляются прямо на стволе.","cn":"0080-07-94","cy":"1994","by":"1914","cd":"12 m","tp":"2,3 m","ow":"Públic"},{"n":"Pebrer bord dels jardins de la Vil·la Amèlia","ne":"","sr":"Шинус мягкий","r":"шинус","nru":"Шинус мягкий","s":"Schinus molle","la":41.39217647779408,"ln":2.1219630510950713,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031214140035-05-93_1.optimized.c60f0bf0.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pebrer-bord-dels-jardins-de-la-villa-amelia-99400455048","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer d'Eduardo Conde 8","dr":"El falso pimentero, originario de las mesetas de Bolivia, el Perú y Chile, es un árbol bastante común, especialmente en parques y jardines, ya que tiene un gran crecimiento en anchura. El ejemplar catalogado se encuentra en el límite de los jardines de la Vil·la Amèlia. Cuando la finca fue adquirida por el Ayuntamiento, hacía muchos años que los falsos pimenteros ribeteaban, en una doble hilera corta, la entrada a los jardines. A pesar de unas reformas moderadas para adaptar el espacio al uso público, los viejos vigilantes de la puerta fueron muriendo uno a uno. Bien atendido y vigilado, es posible que el falso pimentero superviviente pueda, durante muchos años más, dejar constancia viva —e insólita hasta ahora en la ciudad— del proceso de envejecimiento natural que sigue la especie.","drl":"Ложное перечное дерево, родом с плоскогорий Боливии, Перу и Чили, — довольно распространённое дерево, особенно в парках и садах, поскольку оно сильно разрастается вширь. Внесённый в каталог экземпляр находится на краю садов Вилья-Амелия. Когда имение было приобретено муниципалитетом, уже много лет ложные перечные деревья обрамляли короткой двойной шеренгой вход в сады. Несмотря на умеренные переделки для приспособления пространства к общественному использованию, старые стражи ворот погибали один за другим. При хорошем уходе и надзоре возможно, что уцелевшее ложное перечное дерево сможет ещё много лет оставлять живое — и до сих пор небывалое в городе — свидетельство процесса естественного старения, которому подвержен этот вид.","drh":"Шинус мягкий (перуанский перец) — вечнозелёное дерево с плакучей кроной и розовыми ягодами. Родом из Южной Америки.","cn":"0035-05-93","cy":"1993","by":"1923","cd":"8 m","tp":"2,7 m","ow":"Públic"},{"n":"Palmeres canàries de la Vil·la Amèlia","ne":"","sr":"Финик канарский","r":"финиковая пальма","nru":"Финик канарский","s":"Phoenix canariensis","la":41.392586483702196,"ln":2.1224350545984834,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061442250098-05-94_1.optimized.8f13be6a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmeres-canaries-de-la-villa-amelia-99400455052","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer de Santa Amèlia 2","dr":"La palmera canaria es una especie de palmera autóctona de las islas Canarias, muy utilizada en jardinería por su belleza y facilidad de adaptación. Se trata de un conjunto de catorce pies dispuestos en doble alineación en los jardines de la Vil·la Amèlia. A pesar de su elegancia contundente, este paseo ha quedado un poco desplazado con la ordenación del espacio realizada en 1970. El palmeral está rodeado de palmitos.","drl":"Канарская пальма — вид пальмы, местный для Канарских островов, широко используемый в садоводстве из-за красоты и лёгкости приспособления. Это группа из четырнадцати деревьев, расположенных двойной аллеей в садах Вилья-Амелия. Несмотря на свою внушительную элегантность, эта аллея оказалась несколько смещённой в результате благоустройства пространства, проведённого в 1970 году. Пальмовая роща окружена карликовыми пальмами.","drh":"Финик канарский — мощная пальма родом с Канарских островов. Широко используется для озеленения улиц и парков.","cn":"0098-05-94","cy":"1994","by":"1894","cd":"7 m","tp":"2,3 m","ow":"Públic"},{"n":"Nolines de la Creu de Pedralbes","ne":"","sr":"Нолина Белдинга","r":"Nolina","nru":"Нолина Белдинга","s":"Nolina beldingii","la":41.395409475350185,"ln":2.1134200605216744,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270840380007-04-93_1.optimized.de89ca68.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/nolines-de-la-creu-de-pedralbes-99400455055","d":"Les Corts","h":"Pedralbes","a":"Avinguda d'Esplugues 119","dr":"Es una especie norteamericana, originaria del estado de California, propia de zonas áridas o semidesérticas. En Europa es una planta muy difícil de encontrar, y aún más con un desarrollo tan notable. El conjunto lo forman dos ejemplares, que encajan a la perfección con el marco arquitectónico del portal de la bajada del Monestir y la silueta de la iglesia y el campanario.","drl":"Это североамериканский вид, родом из штата Калифорния, свойственный засушливым или полупустынным зонам. В Европе это растение найти очень трудно, а с таким заметным развитием — тем более. Группа состоит из двух экземпляров, которые идеально вписываются в архитектурное обрамление портала спуска к монастырю и силуэт церкви и колокольни.","drh":"Нолина Белдинга — пустынное растение из Калифорнии с утолщённым стволом-каудексом и розеткой листьев.","cn":"0007-04-93","cy":"1993","by":"1893","cd":"5 m","tp":"1,7 m","ow":"Públic"},{"n":"Morera del Bon Pastor","ne":"","sr":"Шелковица белая","r":"шелковица","nru":"Шелковица белая","s":"Morus alba","la":41.43812433108488,"ln":2.202884127527694,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061505210090-09-94_1.optimized.cc3fef29.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/morera-del-bon-pastor-99400455056","d":"Sant Andreu","h":"el Bon Pastor","a":"Carrer de la Sèquia Madriguera 20","dr":"La morera, originaria de China, fue introducida en Europa por el valor de sus hojas, utilizadas como alimento de los gusanos de seda. Este ejemplar está en un alcorque de la calle de Adrall y destaca por su envergadura y buen estado de conservación.","drl":"Шелковица, родом из Китая, была завезена в Европу из-за ценности её листьев, использовавшихся в качестве корма для шелкопрядов. Этот экземпляр находится в приствольной лунке на улице Адраль и выделяется размахом и хорошим состоянием сохранности.","drh":"Шелковица белая — листопадное дерево с широкой кроной. Листья — корм для тутового шелкопряда, плоды съедобны.","cn":"0090-09-94","cy":"1994","by":"1929","cd":"20 m","tp":"3,3 m","ow":"Públic"},{"n":"Mèlia del carrer Fernando Pessoa","ne":"","sr":"Мелия азедарах","r":"мелия","nru":"Мелия азедарах улицы Fernando Pessoa","s":"Melia azedarach","la":41.44529483725454,"ln":2.192668192306365,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/238.optimized.cb9cc227.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/melia-del-carrer-fernando-pessoa-99400761030","d":"Sant Andreu","h":"Sant Andreu","a":"Carrer de Fernando Pessoa 65","dr":"La melia, originaria de las zonas montañosas de China y la India, es uno de los árboles alóctonos que antes y mejor se han adaptado al medio urbano. Ejemplar situado en un alcorque de la alineación de la calle Fernando Pessoa. Forma parte de una doble alineación que conforma el lado este de la calle. Esta melia destaca del resto de ejemplares por su tamaño. Previsiblemente el árbol se plantó en el momento de la urbanización de la calle.","drl":"Мелия, родом из горных районов Китая и Индии, — одно из чужеродных деревьев, которые раньше и лучше всего приспособились к городской среде. Экземпляр расположен в приствольной лунке аллеи улицы Фернандо Пессоа. Он входит в двойную аллею, образующую восточную сторону улицы. Эта мелия выделяется среди остальных экземпляров своим размером. Предположительно, дерево было посажено в момент благоустройства улицы.","drh":"Мелия азедарах (персидская сирень) — дерево с перистыми листьями и сиреневатыми цветами. Быстро растёт, но недолговечна.","cn":"0238-09-24","cy":"2024","by":"L'edat s'estima com a mínim de 50 anys","cd":"17 m","tp":"2.3 m","ow":""},{"n":"Teix dels jardins de la Granja Vella de Martí-Codolar","ne":"","sr":"Тис ягодный","r":"тис","nru":"Тис ягодный садов Granja Vella de Martí-Codolar","s":"Taxus baccata","la":41.42851447223239,"ln":2.149241012349034,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121200060082-07-94_1.optimized.b5707bba.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/teix-dels-jardins-de-la-granja-vella-de-marti-codolar-99400454944","d":"Horta-Guinardó","h":"la Vall d'Hebron","a":"Avinguda de Martí-Codolar 12","dr":"El tejo, originario de Europa y del oeste de Asia, es uno de los árboles con más simbolismo, posiblemente debido a su gran longevidad. Normalmente solo lo encontramos en los jardines más antiguos. En este caso, el ejemplar catalogado está formado por dos pies y se encuentra en los interesantes jardines de la Granja Vella de Martí Codolar.","drl":"Тис, родом из Европы и запада Азии, — одно из самых символичных деревьев, возможно, из-за его большой долговечности. Обычно мы встречаем его только в самых старых садах. В данном случае внесённый в каталог экземпляр состоит из двух стволов и находится в интересных садах Гранха-Велья-де-Марти-Кодолар.","drh":"Тис ягодный — медленнорастущее хвойное дерево с ядовитыми семенами в красной оболочке. Очень теневынослив, живёт до 2000 лет.","cn":"0082-07-94","cy":"1994","by":"1894","cd":"11 m","tp":"1,9 m","ow":"Privat"},{"n":"Roure cerrioide de l'aparcament de Les Planes","ne":"","sr":"Дуб","r":"дуб","nru":"Дуб","s":"Quercus cerrioides","la":41.42863299197756,"ln":2.0894947825270096,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061346040158-05-12_1.optimized.0721b99c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-cerrioide-de-l-aparcament-de-les-planes-99400454953","d":"Sarrià-Sant Gervasi","h":"Vallvidrera, el Tibidabo i les Planes","a":"Carretera de Vallvidrera a les Planes 107","dr":"El roble cerrioide se considera un cruce entre el roble pubescente y el quejigo, y presenta unas características intermedias entre estas dos especies. Su área de distribución se circunscribe a la península Ibérica. El ejemplar catalogado está en el entorno del restaurante Font de les Planes, integrado en el área de transición entre las zonas más urbanizadas y los bosques de Collserola.","drl":"Дуб церриоидный считается гибридом пушистого дуба и португальского дуба и обладает промежуточными признаками между этими двумя видами. Ареал его распространения ограничен Пиренейским полуостровом. Внесённый в каталог экземпляр находится в окрестностях ресторана «Фонт-де-лес-Планес», в зоне перехода между наиболее урбанизированными территориями и лесами Кольсеролы.","drh":"Дуб — мощное листопадное дерево с крепкой древесиной и желудями; одни из самых долговечных деревьев Европы.","cn":"0158-05-12","cy":"2012","by":"1814","cd":"30 m","tp":"3,3 m","ow":"Públic"},{"n":"Grevillea dels jardins dels Drets Humans","ne":"","sr":"Гревиллея мощная","r":"гревиллея","nru":"Гревиллея мощная садов Drets Humans","s":"Grevillea robusta","la":41.36127349806013,"ln":2.136677076886761,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200831200153-03-11_1-.optimized.b613e096.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/grevillea-dels-jardins-dels-drets-humans-99400454955","d":"Sants-Montjuïc","h":"la Marina de Port","a":"Carretera del Prat 2","dr":"La araucaria bidwillii es una especie de planta de la familia Araucariaceae que se distribuye por el nordeste de Australia. Este ejemplar, seguramente uno de los pocos existentes en Barcelona, está en los jardines del Teatre Grec.","drl":"Араукария Бидвилла — вид растений семейства Араукариевые, распространённый на северо-востоке Австралии. Этот экземпляр, вероятно, один из немногих существующих в Барселоне, находится в садах Греческого театра.","drh":"Гревиллея мощная — вечнозелёное дерево из Австралии с рассечёнными листьями и яркими оранжевыми цветами в кистях.","cn":"0154-03-11","cy":"2011","by":"","cd":"27 m","tp":"4,1 m","ow":"Públic"},{"n":"Arbre de les sedes de la Ciutadella","ne":"","sr":"Альбиция ленкоранская","r":"Albizia","nru":"Альбиция ленкоранская","s":"Albizia julibrissin","la":41.38720325708845,"ln":2.1866120313134387,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Arbre_de_les_sedes_de_la_Ciutadella.optimized.22cfb011.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbre-de-les-sedes-de-la-ciutadella-99400679808","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella","dr":"Originaria del sur y el este de Asia, el árbol de las sedas es una especie de árbol muy ornamental, tanto por su porte de sombrilla como por su floración. El ejemplar del Parque de la Ciutadella corresponde a la época en que la Junta de Ciencias Naturales de Barcelona tenía su sede en los museos del parque y este servía como lugar donde se mostraban curiosidades científicas. El árbol ha sufrido a lo largo de su vida diferentes infecciones que han ido vaciando su tronco central.","drl":"Родом с юга и востока Азии, шёлковое дерево (альбиция) — очень декоративный вид, как благодаря зонтичной форме, так и цветению. Экземпляр в парке Сьютаделья относится к эпохе, когда Совет естественных наук Барселоны имел свою резиденцию в музеях парка, а тот служил местом, где демонстрировались научные диковины. За свою жизнь дерево перенесло разные инфекции, которые постепенно выели его центральный ствол.","drh":"Альбиция ленкоранская (шёлковое дерево) — изящное дерево с пушистыми розовыми цветами. Листья складываются на ночь.","cn":"0103-01-96","cy":"1996","by":"1896","cd":"13 m","tp":"2,8 m","ow":""},{"n":"Ficus de Mysore del Santuari de Sant Josep de la Muntaya","ne":"","sr":"Фикус костянковый","r":"фикус","nru":"Фикус костянковый","s":"Ficus drupacea","la":41.41039992469715,"ln":2.1533286346484655,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Ficus_de_Mysore_del_Santuari_de_Sant_Josep_de_la_Muntaya.optimized.64a504ff.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ficus-de-mysore-del-santuari-de-sant-josep-de-la-muntaya-99400680086","d":"Gràcia","h":"la Salut","a":"Avinguda del Santuari de Sant Josep de la Muntanya 25","dr":"El recinto del Santuario de Sant Josep de la Muntanya es un edificio neorrománico con elementos modernistas, obra de Francesc Berenguer i Mestres de principios del siglo XX. El edificio tiene tres cuerpos: la iglesia, el hogar y la residencia, y está protegido como Bien Cultural de Interés Local. La capilla de Sant Josep que se encuentra en la explanada es más moderna, se acabó en 1972. Encargado por la Congregación de Madres de los Desamparados y San José de la Montaña, es un centro de culto y peregrinaje, siendo el primero del mundo dedicado a San José. En este espacio, cuentan, hubo diferentes milagros y los barceloneses acudían al santuario con peticiones escritas que después se quemaban en una jornada que se celebraba, aproximadamente, el tercer domingo de febrero. El agua también tuvo un papel importante. La beata Petra quiso buscar agua y se excavó un pozo seco, el agua brotó y era medicinal, así que muchas personas subían al santuario a beber de esta agua curativa. Durante años, el santuario fue conocido como el Lourdes español. El ficus de Mysore es nativo de la India, del sudeste asiático y de Australia. Se caracteriza por no emitir raíces aéreas, como sí hacen la mayoría de ficus similares. El ficus de Mysore se encuentra situado en un parterre en el lado sur del edificio de la residencia, junto a una fuente y a una pequeña construcción donde se aloja la imagen de San José.","drl":"Территория святилища Сант-Жузеп-де-ла-Мунтанья — неороманское здание с модернистскими элементами, работа Франсеска Беренгера-и-Местреса начала XX века. Здание состоит из трёх частей: церкви, приюта и резиденции, и охраняется как объект культурного достояния местного значения. Часовня Святого Иосифа, находящаяся на эспланаде, более современная, она была завершена в 1972 году. Заказанная Конгрегацией Матерей Покинутых и Святого Иосифа с Горы, она является центром богослужения и паломничества, будучи первой в мире, посвящённой Святому Иосифу. В этом месте, рассказывают, произошли разные чудеса, и барселонцы приходили в святилище с письменными прошениями, которые затем сжигались в день, отмечавшийся примерно в третье воскресенье февраля. Важную роль играла и вода. Блаженная Петра захотела найти воду, и был вырыт колодец в пересохшем месте, вода хлынула, и она оказалась целебной, так что многие люди поднимались в святилище, чтобы пить эту исцеляющую воду. В течение многих лет святилище было известно как испанский Лурд. Фикус из Майсура произрастает в Индии, Юго-Восточной Азии и Австралии. Он отличается тем, что не образует воздушных корней, как это делает большинство подобных фикусов. Фикус из Майсура расположен на клумбе с южной стороны здания резиденции, рядом с фонтаном и небольшой постройкой, где помещается изображение Святого Иосифа.","drh":"Фикус костянковый — крупное дерево родом из Южной и Юго-Восточной Азии. Не образует воздушных корней.","cn":"0209-06-20","cy":"2021","by":"","cd":"17 m","tp":"1,7 m","ow":""},{"n":"Garrofer de la plaça del Doctor Castelló","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево площади Doctor Castelló","s":"Ceratonia siliqua","la":41.39186784918761,"ln":2.1355210119313917,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Garrofer_de_la_placa_del_Doctor_Castello.optimized.216e60a5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-de-la-placa-del-doctor-castello-99400680089","d":"Sarrià-Sant Gervasi","h":"les Tres Torres","a":"Avinguda de Sarrià 88","dr":"Este algarrobo, de desarrollo ejemplar, se sitúa en plena plaza del Doctor Castelló. Su origen lo encontramos en una antigua masía de la zona. Dividido en dos ramas, una de ellas se rompió por el peso del follaje, de manera que en la actualidad la otra rama soporta casi el 90% del follaje. Aun así, el algarrobo no pierde su majestuosidad.","drl":"Это рожковое дерево, образцового развития, расположено прямо на площади доктора Кастельо. Его происхождение восходит к старой усадьбе этой местности. Разделённое на две ветви, одна из которых сломалась под тяжестью листвы, так что в настоящее время другая ветвь несёт почти 90 % листвы. Тем не менее рожковое дерево не теряет своего величия.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0113-05-96","cy":"1996","by":"1896","cd":"13 m","tp":"3,3 m","ow":""},{"n":"Xiprer comú del carrer Betlem","ne":"","sr":"Кипарис вечнозелёный","r":"кипарис","nru":"Кипарис вечнозелёный","s":"Cupressus sempervirens","la":41.40565912910181,"ln":2.153940001097059,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Xiprer_comu_del_carrer_Betlem.optimized.5b021e23.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xiprer-comu-del-carrer-betlem-99400680099","d":"Gràcia","h":"la Vila de Gràcia","a":"Carrer de Betlem 55","dr":"El ejemplar de ciprés común se encuentra en el parterre del patio delantero de una finca privada de cuatro plantas de la calle Betlem. En el mismo espacio encontramos un plátano y una tipuana. Es el único ciprés catalogado. A pesar de que no tiene las dimensiones de otros ejemplares, especialmente los que se sitúan en los cementerios de la ciudad, se valora su presencia en un barrio con muy pocos ejemplares singulares.","drl":"Экземпляр кипариса вечнозелёного находится на клумбе переднего двора частного четырёхэтажного дома на улице Бетлем. На том же участке мы находим платан и типуану. Это единственный внесённый в каталог кипарис. Хотя он не обладает размерами других экземпляров, особенно тех, что расположены на городских кладбищах, ценится его присутствие в районе с очень малым количеством особенных экземпляров.","drh":"Кипарис вечнозелёный — хвойное дерево с колонновидной кроной. Классический элемент средиземноморского пейзажа.","cn":"0210-06-20","cy":"2021","by":"Per determinar","cd":"8 m","tp":"2,1 m","ow":""},{"n":"Xiprers ploraners del barri de Canyelles","ne":"","sr":"Кипарис плакучий","r":"кипарис","nru":"Кипарис плакучий","s":"Cupressus funebris","la":41.443189294657444,"ln":2.164865390134082,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0225-08-22.optimized.82d9bb19.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xiprers-ploraners-del-barri-de-canyelles-99400728990","d":"Nou Barris","h":"Canyelles","a":"Carrer de Miguel Hernández 19","dr":"El parterre donde están situados los dos cipreses llorones forma parte del ámbito de influencia de unos grupos de viviendas diseñados por el equipo de arquitectos formado por Guillem Giráldez, Pere López-Iñigo y Xavier Subias. El conjunto de estas viviendas se construyó a principios de la década de los años 70 del siglo pasado bajo la denominación Polígono Canyelles. Son los ejemplares viarios de esta especie más grandes de Barcelona.","drl":"Клумба, на которой расположены два плакучих кипариса, входит в зону влияния групп жилых домов, спроектированных командой архитекторов в составе Гильема Хиральдеса, Пере Лопес-Иньиго и Хавьера Субиаса. Комплекс этих жилых домов был построен в начале 70-х годов прошлого века под названием Полигон Каньелес. Это самые крупные уличные экземпляры этого вида в Барселоне.","drh":"Кипарис плакучий — хвойное дерево с поникшими ветвями. Родом из Китая, редко встречается в Европе.","cn":"0225-08-22","cy":"2022","by":"","cd":"8 m","tp":"1,3 m","ow":""},{"n":"Pollancre del Canadà del Parc de l'Estació del Nord","ne":"","sr":"Тополь канадский","r":"тополь","nru":"Тополь канадский","s":"Populus x canadensis","la":41.393277251578034,"ln":2.1837503010846904,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141001320106-02-96_1.optimized.b633eb45.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pollancre-del-canada-del-parc-de-l-estacio-del-nord-99400679820","d":"","h":"","a":"Parc de l'Estació del Nord","dr":"El chopo del Canadá es un cruce entre otros dos chopos, el común (Populus nigra) y el americano (Populus deltoides). El Parque de la Estació del Nord incorpora un único ejemplar arbóreo procedente de épocas anteriores, este chopo del Canadá. El ejemplar se encontraba dentro del recinto que pertenecía a almacenes de transportes de la calle Almogàvers y se respetó al crearse el nuevo parque. El árbol se valora sobre todo por el despliegue de sus ramas, de gran perfección fruto de haber crecido sin límite de espacio aéreo.","drl":"Канадский тополь — это гибрид двух других тополей: чёрного (Populus nigra) и американского (Populus deltoides). Парк Эстасьо-дель-Норд включает единственное дерево, оставшееся с прежних времён, — этот канадский тополь. Экземпляр находился на территории, принадлежавшей транспортным складам на улице Алмогаверс, и был сохранён при создании нового парка. Дерево ценится прежде всего за раскинувшиеся ветви великого совершенства, плод того, что оно росло без ограничения воздушного пространства.","drh":"Тополь канадский — быстрорастущее листопадное дерево. Гибрид, часто используется в парках и вдоль водоёмов.","cn":"0106-02-96","cy":"1996","by":"1896","cd":"16 m","tp":"3,4 m","ow":""},{"n":"Ficus de Cautxú del Parc Safo","ne":"","sr":"Фикус каучуконосный","r":"фикус","nru":"Фикус каучуконосный","s":"Ficus elastica","la":41.381170323318294,"ln":2.1454467916485878,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0227-03-22.optimized.7c132497.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ficus-de-cautxu-del-parc-safo-99400728995","d":"Eixample","h":"la Nova Esquerra de l'Eixample","a":"Avinguda de Roma 22","dr":"Ejemplar de ficus de caucho con una decena de pies que se encuentra en los jardines de Safo, en el barrio de la Nova Esquerra de l'Eixample. Los jardines, construidos a principios de los años 2000, están situados en el interior de la manzana formada por las calles de Llançà, València, Vilamarí y la avenida de Roma y están dedicados a la poetisa griega Safo de Lesbos (siglo VII a. C.).","drl":"Экземпляр каучукового фикуса с десятком стволов, который находится в садах Сафо, в районе Нова-Эскерра в Эшампле. Сады, построенные в начале 2000-х годов, расположены внутри квартала, образованного улицами Льянса, Валенсия, Виламари и проспектом Рома, и посвящены греческой поэтессе Сафо Лесбосской (VII в. до н. э.).","drh":"Фикус каучуконосный — вечнозелёное дерево с крупными кожистыми листьями. Источник натурального каучука.","cn":"0227-03-22","cy":"2022","by":"","cd":"22 m","tp":"1.8 m","ow":""},{"n":"Palmeres canàries de l'Antiga Torre Bayer","ne":"","sr":"Финик канарский","r":"финиковая пальма","nru":"Финик канарский","s":"Phoenix canariensis","la":41.39446291632435,"ln":2.1737403737959373,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Palmeres_canaries_de_lAntiga_Torre_Bayer.optimized.12ab602f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmeres-canaries-de-l-antiga-torre-bayer-99400679821","d":"Eixample","h":"la Dreta de l'Eixample","a":"Carrer de Bailèn 51","dr":"La palmera canaria es originaria del archipiélago de donde toma su nombre y es una de las especies más utilizadas en el medio urbano. En este caso, posiblemente se trate de las Phoenix canariensis más altas. Las palmeras forman parte de la Antigua Torre Bayer, una suntuosa casa unifamiliar que se acabó de construir en 1898. El edificio está considerado Bien de Interés Urbanístico. Se cree que las dos palmeras fueron plantadas no mucho más tarde de la inauguración del edificio. Por lo tanto, la edad de las mismas debería ser de como máximo 115 años.","drl":"Канарская пальма родом с архипелага, от которого получила название, и является одним из наиболее используемых видов в городской среде. В данном случае, возможно, речь идёт о самых высоких Phoenix canariensis. Пальмы являются частью Старой башни Байер — роскошного односемейного дома, достроенного в 1898 году. Здание считается объектом градостроительного интереса. Считается, что обе пальмы были посажены не намного позже открытия здания. Следовательно, их возраст должен составлять самое большее 115 лет.","drh":"Финик канарский — мощная пальма родом с Канарских островов. Широко используется для озеленения улиц и парков.","cn":"0190-02-19","cy":"2021","by":"1900","cd":"9 m","tp":"1 m","ow":"Privat"},{"n":"Oliveres del Jardí Botànic de Barcelona","ne":"","sr":"Маслина европейская","r":"олива (маслина)","nru":"Маслина европейская сада Botànic de Barcelona","s":"Olea europaea","la":41.364103174008655,"ln":2.15874551177556,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0228-03-23.optimized.b408cc24.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/oliveres-del-jardi-botanic-de-barcelona-99400728997","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer del Doctor Font i Quer 2","dr":"Los dos olivos se ubican en el Jardín Botánico de Barcelona. Este jardín se inauguró en 1999, situado en la montaña de Montjuïc de la ciudad de Barcelona, en el espacio que hay entre el Estadio de Montjuïc, el Castillo de Montjuïc y el Cementerio de Montjuïc. Los dos olivos, plantados uno al lado del otro, se sitúan en un amplio parterre en la zona central del jardín. Los ejemplares fueron trasplantados desde una finca agraria de Sant Vicent del Raspeig, en Alicante, poco antes de que el jardín abriera las puertas. El trasplante fue posible gracias a una donación de la empresa Gas Natural.","drl":"Две оливы находятся в Ботаническом саду Барселоны. Этот сад был открыт в 1999 году и расположен на горе Монжуик в городе Барселоне, в пространстве между стадионом Монжуик, замком Монжуик и кладбищем Монжуик. Две оливы, посаженные рядом друг с другом, расположены на просторной клумбе в центральной части сада. Экземпляры были пересажены из сельскохозяйственного имения в Сан-Висенте-дель-Распейг, в Аликанте, незадолго до открытия сада. Пересадка стала возможной благодаря пожертвованию компании «Гас Натураль».","drh":"Маслина европейская — вечнозелёное дерево с серебристо-зелёными листьями. Символ Средиземноморья, источник оливкового масла.","cn":"0228-03-23","cy":"2023","by":"","cd":"8 m","tp":"8,5 m","ow":""},{"n":"Xiprers del Teatre Grec","ne":"","sr":"Кипарис вечнозелёный","r":"кипарис","nru":"Кипарис вечнозелёный театра Grec","s":"Cupressus sempervirens","la":41.36880522360827,"ln":2.158353382123093,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/230.optimized.992c6f4f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xiprers-del-teatre-grec-99400729002","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passeig de Santa Madrona 30","dr":"Los dos cipreses catalogados se ubican al norte de la terraza principal de los jardines del Teatre Grec. El Teatre Grec es un teatro al aire libre en Barcelona, situado en la calle de Santa Madrona, en la montaña de Montjuïc. Fue diseñado y construido en 1929 con motivo de la Exposición Internacional celebrada en Barcelona, inspirándose en el Teatro de Epidauro. Los arquitectos fueron Ramon Reventós y Nicolau Maria Rubió i Tudurí. Tras un cierre en 1978, con la llegada del primer ayuntamiento democrático la historia del Teatre Grec se reanudó para convertirse desde entonces en el centro del festival de verano de Barcelona. Los dos ejemplares catalogados fueron plantados durante la construcción de los jardines en la década de los años 20 del siglo XX.","drl":"Два внесённых в каталог кипариса расположены к северу от главной террасы садов Греческого театра. Греческий театр — это театр под открытым небом в Барселоне, расположенный на улице Санта-Мадрона на горе Монжуик. Он был спроектирован и построен в 1929 году по случаю Международной выставки, проходившей в Барселоне, по образцу театра в Эпидавре. Архитекторами были Рамон Ревентос и Николау Мария Рубио-и-Тудури. После закрытия в 1978 году, с приходом первого демократического муниципалитета история Греческого театра возобновилась, и с тех пор он стал центром летнего фестиваля Барселоны. Два внесённых в каталог экземпляра были посажены во время строительства садов в 20-е годы XX века.","drh":"Кипарис вечнозелёный — хвойное дерево с колонновидной кроной. Классический элемент средиземноморского пейзажа.","cn":"0230-03-23","cy":"2023","by":"1920","cd":"8","tp":"2.4 m","ow":""},{"n":"Eritrina cresta de gall de la Via Augusta","ne":"","sr":"Эритрина петушиный гребень","r":"эритрина","nru":"Эритрина пету

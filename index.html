шиный гребень","s":"Erythrina crista-galli","la":41.398010131750816,"ln":2.1396419941485063,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Eritrina_cresta_de_gall_de_la_Via_Augusta.optimized.19adbacf.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eritrina-cresta-de-gall-de-la-via-augusta-99400680066","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Via Augusta 202","dr":"Forma parte de un jardín que bordea todo el edificio de la Via Augusta, salvando un desnivel mediante un talud de césped. Tenemos gran cantidad de árboles, de los que destacan un ejemplar de ficus de Port Jackson (Ficus rubiginosa), pinos canarios (Pinus canariensis) y jacarandás (Jacaranda mimosifolia). Esta eritrina catalogada es una de las más grandes de Barcelona. Se encuentra situada, aunque en terreno privado, en una zona accesible para el ciudadano, lo que la hace totalmente integrada en el espacio público.","drl":"Является частью сада, окаймляющего всё здание на Виа Аугуста и преодолевающего перепад высот посредством газонного откоса. Здесь большое количество деревьев, среди которых выделяются экземпляр фикуса Порт-Джексона (Ficus rubiginosa), канарские сосны (Pinus canariensis) и жакаранды (Jacaranda mimosifolia). Эта внесённая в каталог эритрина — одна из самых крупных в Барселоне. Она расположена, хотя и на частной территории, в зоне, доступной для горожан, что делает её полностью интегрированной в общественное пространство.","drh":"Эритрина петушиный гребень — небольшое дерево с яркими красными цветами. Национальный цветок Аргентины.","cn":"0208-05-20","cy":"2021","by":"Per determinar","cd":"10 m","tp":"1,32+1,41+0,85 m","ow":""},{"n":"Garrofer del carrer Maignon","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево улицы Maignon","s":"Ceratonia siliqua","la":41.41041792535541,"ln":2.152833757843457,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Garrofer_del_carrer_Maignon.optimized.c30549f2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-del-carrer-maignon-99400680090","d":"Gràcia","h":"la Salut","a":"Carrer de Maignon 27","dr":"La mayor parte de la finca está constituida por un jardín con gran diversidad de ejemplares arbóreos. Se trata de un jardín funcional, que no destaca por las características históricas o estéticas, pero sí por los ejemplares arbóreos: falsos pimenteros (Schinus molle), aligustres (Ligustrum lucidum) y pitósporos (Pittosporum tobira), entre otros. De este conjunto, destaca un algarrobo ubicado en el muro que limita el vial interno por donde circulan los coches y la parte del jardín que queda a un nivel superior. Justo en medio de este muro, de unos 2 m de altura, se integra el ejemplar de algarrobo. Con los años, el árbol se ha adaptado a la infraestructura, de manera que actualmente parece que salga del propio muro. El algarrobo es un árbol que habitualmente hace copas muy anchas y que por lo tanto solo encontramos en zonas ajardinadas. El ejemplar, a pesar de tener un perímetro menor que el de estos otros árboles de Interés, destaca por ser testimonio del pasado agrícola, previo a la construcción del jardín.","drl":"Большая часть участка представляет собой сад с большим разнообразием древесных экземпляров. Это функциональный сад, не выделяющийся историческими или эстетическими характеристиками, но выделяющийся древесными экземплярами: ложные перечные деревья (Schinus molle), бирючина блестящая (Ligustrum lucidum) и питоспорумы (Pittosporum tobira), среди прочих. Из этой совокупности выделяется рожковое дерево, расположенное в стене, ограничивающей внутренний проезд, по которому ездят машины, и часть сада, находящуюся на более высоком уровне. Прямо посреди этой стены высотой около 2 м встроен экземпляр рожкового дерева. С годами дерево приспособилось к инфраструктуре, так что сейчас кажется, будто оно выходит из самой стены. Рожковое дерево обычно образует очень широкие кроны, и поэтому мы находим его лишь в озеленённых зонах. Экземпляр, несмотря на меньший обхват, чем у этих других деревьев, представляющих интерес, выделяется тем, что является свидетелем сельскохозяйственного прошлого, предшествовавшего созданию сада.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0212-06-20","cy":"2021","by":"Per determinar","cd":"17 m","tp":"1,84 m","ow":""},{"n":"Garrofer dels Pavellons Güell","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево","s":"Ceratonia siliqua","la":41.38849193396265,"ln":2.120864962717487,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Garrofer_dels_Pavellons_Guell.optimized.4e978509.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-dels-pavellons-guell-99400680091","d":"Les Corts","h":"Pedralbes","a":"Avinguda de Pedralbes 7","dr":"El algarrobo propuesto está situado en los Pabellones de la Torre Güell, que inicialmente eran las cocheras o caballerizas que daban servicio a la Torre. Posiblemente se pudo utilizar para ayudar a dar de comer a los caballos de las cuadras del lateral del árbol.","drl":"Предлагаемое рожковое дерево расположено в Павильонах Торре-Гуэль, которые первоначально были каретными сараями или конюшнями, обслуживавшими башню. Возможно, оно использовалось, чтобы помогать кормить лошадей из стойл сбоку от дерева.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0193-04-19","cy":"2021","by":"Per determinar","cd":"8 m","tp":"3,5 m","ow":""},{"n":"Plàtan del parc de la Ciutadella","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный парка Ciutadella","s":"Platanus x acerifolia","la":41.38875584034605,"ln":2.1874292762457586,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0218-01-21.optimized.918fdb0e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-del-parc-de-la-ciutadella-99400728979","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 22","dr":"La singularidad de este ejemplar se centra en la excepcional arquitectura natural que presenta, por las pocas intervenciones que ha sufrido. El árbol se sitúa en una zona predominante del Parque de la Ciutadella, junto al estanque, uno de los jardines históricos más emblemáticos de la ciudad. La bóveda de cañón supera en 10 cm a los ejemplares catalogados con perímetro de tronco más grande (008-10-93 y 0142-05-03).","drl":"Особенность этого экземпляра заключается в исключительной природной архитектуре, которую он имеет благодаря малому числу вмешательств, которым подвергался. Дерево расположено в видной зоне парка Сьютаделья, рядом с прудом, одним из самых символичных исторических садов города. Цилиндрический свод превосходит на 10 см внесённые в каталог экземпляры с наибольшим обхватом ствола (008-10-93 и 0142-05-03).","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0218-01-21","cy":"2021","by":"","cd":"24 m","tp":"3,6 m","ow":""},{"n":"Pebrer bord dels Jardins de Jaume Ferran i Clua","ne":"","sr":"Шинус мягкий","r":"шинус","nru":"Шинус мягкий","s":"Schinus molle","la":41.4236890239839,"ln":2.177984853866859,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0219-09-21_.optimized.6944ed79.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pebrer-bord-dels-jardins-de-jaume-ferran-i-clua-99400728980","d":"Sant Andreu","h":"el Congrés i els Indians","a":"Carrer de Garcilaso 236","dr":"El falso pimentero se sitúa en los jardines dedicados al médico y bacteriólogo Jaume Ferran i Clua. El falso pimentero es de dimensiones semejantes al del jardín de la Vil·la Amèlia en cuanto al perímetro, aunque el tamaño de la copa de la propuesta lo supera con creces (12 m frente a los 8 m del de la Vil·la Amèlia). La singularidad del árbol radica, precisamente, en la copa, que tiene una muy buena estructura y desarrollo. Es el elemento que destaca en los jardines junto con la escultura dedicada al médico Jaume Ferran i Clua, que da nombre al espacio.","drl":"Ложное перечное дерево расположено в садах, посвящённых врачу и бактериологу Жауме Ферран-и-Клуа. Ложное перечное дерево имеет размеры, схожие с деревом в саду Вилья-Амелия по обхвату, хотя размер кроны предлагаемого экземпляра значительно его превосходит (12 м против 8 м у дерева в Вилья-Амелия). Особенность дерева заключается именно в кроне, имеющей очень хорошую структуру и развитие. Это элемент, выделяющийся в садах наряду со скульптурой, посвящённой врачу Жауме Ферран-и-Клуа, который дал название этому пространству.","drh":"Шинус мягкий (перуанский перец) — вечнозелёное дерево с плакучей кроной и розовыми ягодами. Родом из Южной Америки.","cn":"0219-09-21","cy":"2021","by":"Per determinar","cd":"14 m","tp":"1.4 m","ow":""},{"n":"Morera del carrer Alcoi","ne":"","sr":"Шелковица белая","r":"шелковица","nru":"Шелковица белая улицы Alcoi","s":"Morus alba","la":41.40848183223074,"ln":2.1312227617603297,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041325570173-05-16_1.optimized.47d6e8fe.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/morera-del-carrer-alcoi-99400637946","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer d'Alcoi 10","dr":"La morera blanca, originaria de China, fue introducida en Europa por el valor de sus hojas, utilizadas como alimento de los gusanos de seda. El ejemplar está en un parterre ajardinado de la calle de Alcoi y presenta una gran copa que crea un ambiente fresco y agradable en los bancos de la plaza.","drl":"Белая шелковица, родом из Китая, была завезена в Европу из-за ценности её листьев, использовавшихся в качестве корма для шелкопрядов. Экземпляр находится на озеленённой клумбе на улице Алькой и имеет большую крону, создающую свежую и приятную атмосферу у скамеек площади.","drh":"Шелковица белая — листопадное дерево с широкой кроной. Листья — корм для тутового шелкопряда, плоды съедобны.","cn":"0173-05-16","cy":"2016","by":"Per determinar","cd":"17 m","tp":"2,3 m","ow":""},{"n":"Aladern de fulla ampla de la Torre Castanyer","ne":"","sr":"Филлерея широколистная","r":"Phillyrea","nru":"Филлерея широколистная","s":"Phillyrea latifolia","la":41.407816002914196,"ln":2.13246717868883,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041320570174-05-16_1.optimized.f7c2c6e4.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/aladern-de-fulla-ampla-de-la-torre-castanyer-99400637947","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer del Lluçanès 26","dr":"El labiérnago de hoja ancha es un árbol de porte pequeño que forma parte de los encinares mediterráneos. Habitualmente lo encontramos formando arbustos. Es muy poco habitual encontrar, incluso en zonas naturales, ejemplares de estas dimensiones. El ejemplar se sitúa en una finca privada, pero podemos observar la copa desde la calle.","drl":"Филлирея широколистная — дерево небольшого роста, входящее в состав средиземноморских дубовых лесов. Обычно мы встречаем её в виде кустарников. Очень редко можно найти, даже в природных зонах, экземпляры таких размеров. Экземпляр расположен в частном владении, но крону можно наблюдать с улицы.","drh":"Филлерея широколистная — небольшое вечнозелёное дерево из Средиземноморья. Устойчиво к засухе.","cn":"0174-05-16","cy":"2016","by":"Per determinar","cd":"9 m","tp":"1,1 m","ow":""},{"n":"Sòfora de la plaça de Can Portabella","ne":"","sr":"Софора японская","r":"софора","nru":"Софора японская площади Can Portabella","s":"Styphnolobium japonicum","la":41.4288044006486,"ln":2.1940474903741385,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041230310180-09-17_1.optimized.1360200d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/sofora-de-la-placa-de-can-portabella-99400638008","d":"Sant Andreu","h":"Sant Andreu","a":"Plaça de Can Portabella 1","dr":"La sófora, originaria de China y Corea, es un árbol muy común en nuestras calles. El ejemplar catalogado está en un lateral de la casa cultural de la Sagrera y el campo de fútbol de Sant Andreu. El ejemplar tiene un tamaño admirable y un vigor envidiable.","drl":"Японская акация, родом из Китая и Кореи, — очень распространённое дерево на наших улицах. Внесённый в каталог экземпляр находится сбоку от культурного дома Саграда и футбольного поля Сант-Андреу. Экземпляр имеет восхитительный размер и завидную силу.","drh":"Софора японская — декоративное листопадное дерево с перистыми листьями и кремовыми цветами в метёлках. Устойчива в городе.","cn":"0180-09-17","cy":"2017","by":"Per determinar","cd":"17","tp":"3,2 m","ow":""},{"n":"Alzina de Santa Maria de Vallvidrera","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный","s":"Quercus ilex","la":41.41825111030793,"ln":2.1019133222916304,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061357530157-05-12_1.optimized.0fac6cf2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzina-de-santa-maria-de-vallvidrera-99400454961","d":"Sarrià-Sant Gervasi","h":"Vallvidrera, el Tibidabo i les Planes","a":"Carretera de l'Església 5","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. El ejemplar catalogado tiene unas dimensiones extraordinarias. Está en lo alto de un talud, integrado en el bosque circundante, y muy cerca del área recreativa del restaurante Pinya 2.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсеролы. Внесённый в каталог экземпляр имеет необыкновенные размеры. Он находится на вершине откоса, вписанный в окружающий лес и совсем рядом с зоной отдыха ресторана «Пинья 2».","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0157-05-12","cy":"2012","by":"1914","cd":"16 m","tp":"3,3 m","ow":"Privat (accés públic)"},{"n":"Plàtan del carrer Cantàbria","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный улицы Cantàbria","s":"Platanus x acerifolia","la":41.423679494934156,"ln":2.198834997506968,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111016060129-10-97_1.optimized.2b40857c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-del-carrer-cantabria-99400454963","d":"Sant Martí","h":"la Verneda i la Pau","a":"Carrer de Cantàbria 71","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. El ejemplar catalogado es un árbol de alineación, situado en la calle de Cantàbria. Este plátano ha sido un espectador excepcional de la transformación del barrio donde se encuentra. A consecuencia de estos cambios se ha visto afectado por diferentes agresiones que han obligado a realizarle varios tratamientos de cirugía arbórea. Su catalogación es, por lo tanto, una herramienta más de protección.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Внесённый в каталог экземпляр — аллейное дерево, расположенное на улице Кантабрия. Этот платан был исключительным свидетелем преобразования района, в котором находится. Вследствие этих перемен он пострадал от различных повреждений, которые вынудили провести несколько операций древесной хирургии. Поэтому его включение в каталог является ещё одним инструментом защиты.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0129-10-97","cy":"1997","by":"1917","cd":"18 m","tp":"3 m","ow":"Públic"},{"n":"Plàtan oriental de la Universitat","ne":"","sr":"Платан восточный","r":"платан","nru":"Платан восточный","s":"Platanus orientalis","la":41.38636050177912,"ln":2.1640630399665217,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121340070003-02-93_1.optimized.b2769d21.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-oriental-de-la-universitat-99400454967","d":"Eixample","h":"l'Antiga Esquerra de l'Eixample","a":"Gran Via de les Corts Catalanes 585","dr":"Aunque de porte parecido a sus congéneres de alineación, el plátano que hay cerca del portal de acceso a la universidad difiere visiblemente por la corteza del tronco y de la base de sus ramas: marcadamente oscurecida, regularmente resquebrajada, monocolor y no exfoliable. Durante la época vegetativa se observan diferencias en la forma de las hojas y los frutos, características divergentes de las específicas de la especie cultivada por toda Europa. Trabajos de investigación tendrán que dilucidar el fenómeno y la posibilidad virtual de transmisión genética o hibridación fortuita.","drl":"Хотя по стати платан возле входного портала университета схож со своими аллейными собратьями, он заметно отличается корой ствола и основания ветвей: заметно потемневшей, равномерно растрескавшейся, однотонной и не шелушащейся. В вегетационный период наблюдаются различия в форме листьев и плодов, расходящиеся с характеристиками, специфичными для вида, культивируемого по всей Европе. Исследовательские работы должны будут выяснить это явление и виртуальную возможность генетической передачи или случайной гибридизации.","drh":"Платан восточный — листопадное дерево с широкой кроной и долгоживущими экземплярами. Часто используется в городских аллеях и парках.","cn":"0003-02-93","cy":"1993","by":"1933","cd":"17 m","tp":"2 m","ow":"Públic"},{"n":"Plàtans de les Rambles","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный","s":"Platanus x acerifolia","la":41.385372507524686,"ln":2.1702370323181754,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610250947090152-01-10_1.optimized.f06108cb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-de-les-rambles-99400454968","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Carrer la Rambla 142","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. Este magnífico conjunto de plátanos es el más importante de la ciudad en porte e historia. Desde el año 1548, y según consta en archivos municipales, los árboles de La Rambla se han replantado once veces. De los ejemplares que existen actualmente, algunos fueron plantados entre los años 1870 y 1879.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Эта великолепная группа платанов — самая важная в городе по стати и истории. С 1548 года, как свидетельствуют муниципальные архивы, деревья Рамблы пересаживались одиннадцать раз. Из ныне существующих экземпляров некоторые были посажены между 1870 и 1879 годами.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0152-01-10","cy":"2010","by":"1894","cd":"15 m","tp":"2,5 m","ow":"Públic"},{"n":"Pinus roxburghii de l'Av. Diagonal","ne":"","sr":"Сосна Роксбурга","r":"сосна","nru":"Сосна Роксбурга","s":"Pinus roxburghii","la":41.38972548589805,"ln":2.1315220542722484,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251024480042-04-93_1.optimized.4db88f77.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pinus-roxburghii-de-l-av-diagonal-99400454970","d":"Les Corts","h":"les Corts","a":"Avinguda Diagonal 652","dr":"Especie muy rara en nuestra zona, es el único ejemplar conocido en Barcelona. Es un pino originario de la India y del Himalaya, donde se utiliza mucho en las explotaciones forestales. De apariencia semejante al pino canario (Pinus canariensis), luce grandes ramilletes de acículas alargadas, que se presentan de tres en tres —todas las especies europeas, sin excepción, las presentan agrupadas por parejas—.","drl":"Вид, очень редкий в нашей зоне, это единственный известный экземпляр в Барселоне. Это сосна родом из Индии и Гималаев, где широко используется в лесозаготовках. По внешнему виду схожая с канарской сосной (Pinus canariensis), она демонстрирует крупные пучки удлинённой хвои, собранной по три — тогда как все европейские виды без исключения имеют хвою, собранную парами.","drh":"Сосна Роксбурга — гималайский вид с длинной хвоей, собранной в пучки по три. В Европе — редкость.","cn":"0042-04-93","cy":"1993","by":"1963","cd":"14 m","tp":"2,1 m","ow":"Públic"},{"n":"Washingtònies de la plaça del Dr. Letamendi","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая площади Dr. Letamendi","s":"Washingtonia robusta","la":41.389067496251776,"ln":2.160356039155521,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141010010040-02-93_1.optimized.bb63fa89.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-placa-del-dr-letamendi-99400454987","d":"Eixample","h":"l'Antiga Esquerra de l'Eixample","a":"Carrer d'Aragó 215","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. El conjunto catalogado está formado por cuatro ejemplares situados en la plaza del Doctor Letamendi: dos en el lado montaña y dos en el lado mar. La plaza, que se ajardinó a principios del siglo XX, fue uno de los primeros espacios verdes de L’Eixample. La pátina del tiempo y el desarrollo normal de las especies han acabado caracterizando vigorosamente la creación primitiva. Las altas washingtonias, que emergen del conjunto de la vegetación, representan hoy una nota paisajística prominente y popular en la geometría de L’Eixample.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Внесённая в каталог группа состоит из четырёх экземпляров, расположенных на площади доктора Летаменди: два со стороны гор и два со стороны моря. Площадь, озеленённая в начале XX века, была одним из первых зелёных пространств Эшампле. Патина времени и нормальное развитие видов в итоге энергично охарактеризовали первоначальный замысел. Высокие вашингтонии, возвышающиеся над общей растительностью, представляют сегодня заметную и популярную ландшафтную ноту в геометрии Эшампле.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0040-02-93","cy":"1993","by":"1893","cd":"6 m","tp":"2 m","ow":"Públic"},{"n":"Washingtònies dels jardins de Can Farrero","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая садов Can Farrero","s":"Washingtonia robusta","la":41.358088508163306,"ln":2.1419400662698753,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200928230100-03-94_2_Washingtonia-robusta.optimized.b6b54a65.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-dels-jardins-de-can-farrero-99400454988","d":"Sants-Montjuïc","h":"la Marina de Port","a":"Carrer de la Mare de Déu de Port 241","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. Es un conjunto muy típico de plantación en espacios abiertos. Está integrado por dos pies de washingtonias de más de 20 metros (24 y 21 metros, respectivamente) que contrastan con una doble hilera de plátanos orientales centenarios, con una bóveda de cañón de 1,75 m. El conjunto se enmarca en el entorno de la Casa del Rellotge y forma parte de los jardines de Can Farrero.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Это очень типичная группа для посадки в открытых пространствах. Она состоит из двух стволов вашингтоний высотой более 20 метров (24 и 21 метр соответственно), которые контрастируют с двойным рядом столетних восточных платанов со сводом цилиндрической формы в 1,75 м. Группа вписана в окружение Каса-дель-Рельотж и является частью садов Кан-Фаррер.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0100-03-94","cy":"1994","by":"1894","cd":"6 m","tp":"1 m","ow":"Públic"},{"n":"Tipuanes del passatge Maluquer","ne":"","sr":"Типуана","r":"типуана","nru":"Типуана переулка Maluquer","s":"Tipuana tipu","la":41.40866551205067,"ln":2.137129671988077,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251102350163-05-13_1.optimized.e1ba9985.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tipuanes-del-passatge-maluquer-99400454992","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Passatge de Maluquer 4","dr":"La tipuana es un árbol originario de América del Sur que fue introducido en la ciudad a principios del siglo XX. Actualmente es una de las especies más comunes en Barcelona y destaca su floración amarilla al final de la primavera. Alineadas al inicio del pasaje de Maluquer, muy cerca de los jardines de La Tamarita, estas cinco tipuanas ofrecen sombra y frescor permanente a los vecinos y a los peatones. Exuberantes y de gran tamaño, los cinco ejemplares forman un conjunto armónico que genera un techo verde por medio de la conexión de las copas. Las tipuanas mantienen intacto su porte natural.","drl":"Типуана — дерево родом из Южной Америки, которое было завезено в город в начале XX века. В настоящее время это один из самых распространённых видов в Барселоне, и выделяется её жёлтое цветение в конце весны. Выстроенные в ряд в начале переулка Малукер, совсем рядом с садами Ла-Тамарита, эти пять типуан дарят тень и постоянную прохладу соседям и пешеходам. Пышные и крупных размеров, пять экземпляров образуют гармоничную группу, создающую зелёную крышу за счёт смыкания крон. Типуаны сохраняют свою природную стать нетронутой.","drh":"Типуана — южноамериканское дерево с перистыми листьями и жёлтыми цветами. Хорошо переносит городские условия.","cn":"0163-05-13","cy":"2013","by":"Per determinar","cd":"16 m","tp":"2,1 m","ow":"Públic"},{"n":"Tipuanes de la plaça Virrei Amat","ne":"","sr":"Типуана","r":"типуана","nru":"Типуана площади Virrei Amat","s":"Tipuana tipu","la":41.43015548838043,"ln":2.174844999413728,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121227130123-08-96_1.optimized.edf7669c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tipuanes-de-la-placa-virrei-amat-99400454993","d":"Nou Barris","h":"Vilapicina i la Torre Llobeta","a":"Plaça del Virrei Amat 9","dr":"La tipuana es un árbol originario de América del Sur que fue introducido en la ciudad a principios del siglo XX. Actualmente es una de las especies más comunes en Barcelona y destaca su floración amarilla al final de la primavera. El conjunto catalogado lo forman once pies de tipuana, colocados en forma de anillo simétrico en la plaza del Virrei Amat.","drl":"Типуана — дерево родом из Южной Америки, которое было завезено в город в начале XX века. В настоящее время это один из самых распространённых видов в Барселоне, и выделяется её жёлтое цветение в конце весны. Внесённая в каталог группа состоит из одиннадцати деревьев типуаны, расположенных в форме симметричного кольца на площади Вирей-Амат.","drh":"Типуана — южноамериканское дерево с перистыми листьями и жёлтыми цветами. Хорошо переносит городские условия.","cn":"0123-08-96","cy":"1996","by":"1956","cd":"16 m","tp":"1,3 m","ow":"Públic"},{"n":"Pi pinyer del carrer Bosch i Gimpera","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.39370947556957,"ln":2.1184540601491713,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610011039100111-04-96_1.optimized.67d1ba57.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-del-carrer-bosch-i-gimpera-99400454997","d":"Les Corts","h":"Pedralbes","a":"Carrer de Bosch i Gimpera 5","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Este ejemplar, junto con otro pie, formaba parte del paisaje rural existente en Les Corts. La urbanización del entorno y la apertura de calles respetaron estos ejemplares cuando se realizaron las obras. Por este motivo quedaron como testimonios del pasado de esta zona. Desgraciadamente el mes de noviembre de 2009 se tuvo que talar uno de los ejemplares por senescencia.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Этот экземпляр вместе с другим деревом был частью сельского пейзажа, существовавшего в Кортс. При застройке окрестностей и прокладке улиц во время работ эти экземпляры были сохранены. По этой причине они остались свидетелями прошлого этой зоны. К сожалению, в ноябре 2009 года один из экземпляров пришлось срубить из-за старения.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0111-04-96","cy":"1996","by":"1896","cd":"10 m","tp":"1,9 m","ow":"Públic"},{"n":"Pineda del Parc del Turó de la Peira","ne":"","sr":"Сосна алеппская","r":"сосна","nru":"Сосна алеппская парка Turó de la Peira","s":"Pinus halepensis","la":41.43358947605675,"ln":2.164545003938881,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/2016%2C10%2C12123228%2C0041-08-93_1-760x428.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pineda-del-parc-del-turo-de-la-peira-99400455001","d":"Nou Barris","h":"el Turó de la Peira","a":"Carrer de Camós 1","dr":"El pino carrasco es un árbol autóctono presente en toda la región mediterránea. El conjunto catalogado está integrado por más de 70 ejemplares que forman un pinar en el parque del Turó de la Peira. Hoy rodeada por la trama urbana, esta masa boscosa quedó preservada durante la Guerra Civil, por eso configura un conjunto extraordinario, en densidad y en altura, que aún destaca más por el ajardinamiento moderno y de gran interés estético, paisajístico y social.","drl":"Алеппская сосна — местное дерево, встречающееся по всему Средиземноморскому региону. Внесённая в каталог группа состоит из более чем 70 экземпляров, образующих сосновую рощу в парке Туро-де-ла-Пейра. Ныне окружённый городской застройкой, этот лесной массив был сохранён во время Гражданской войны, поэтому он образует необыкновенный по плотности и высоте ансамбль, который ещё больше выделяется современным озеленением, представляющим большой эстетический, ландшафтный и социальный интерес.","drh":"Сосна алеппская — хвойное дерево, характерное для Средиземноморья. Устойчива к жаре и засухе.","cn":"0041-08-93","cy":"1993","by":"1913","cd":"8 m","tp":"2,8 m","ow":"Públic"},{"n":"Freixe vermell americà del jardí Botànic Històric","ne":"","sr":"Ясень пенсильванский","r":"ясень","nru":"Ясень пенсильванский","s":"Fraxinus pennsylvanica","la":41.36717550446575,"ln":2.151848063188654,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061058140055-03-94_1.optimized.75c41ac5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/freixe-vermell-america-del-jardi-botanic-historic-99400455008","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda dels Montanyans 27","dr":"El fresno rojo americano es común de las zonas inundables del este de Norteamérica. En nuestra ciudad es muy poco habitual. Este ejemplar, de notable altura, crece en la parte más honda del Jardín Botánico Histórico, en la montaña de Montjuïc.","drl":"Американский красный ясень распространён в заливаемых зонах востока Северной Америки. В нашем городе он встречается очень редко. Этот экземпляр заметной высоты растёт в самой глубокой части Исторического ботанического сада на горе Монжуик.","drh":"Ясень пенсильванский — североамериканский вид, растёт на влажных почвах. В Европе редкий гость.","cn":"0055-03-94","cy":"1994","by":"1924","cd":"24 m","tp":"3,2 m","ow":"Privat"},{"n":"Cedre de la Universitat Abat Oliba","ne":"","sr":"Кедр гималайский","r":"Cedrus","nru":"Кедр гималайский университета Abat Oliba","s":"Cedrus deodara","la":41.40995356527922,"ln":2.1262365647596044,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Cedre_de_la_Universitat_Abat_Oliba.optimized.599b5996.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cedre-de-la-universitat-abat-oliba-99400680057","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer de Bellesguard 24","dr":"El recinto del Campus Bellesguard está conformado por el edificio que es sede de la Universidad Abat Oliba, así como varios espacios formados por parterres ajardinados y zonas de aparcamiento. Antiguamente, los terrenos formaban parte de una finca más grande en la que destacaba la vecina Torre de Bellesguard, situada al sur de la universidad. El actual campus se segregó y pasó a pertenecer a la congregación de las Hermanas Oblatas del Santísimo Redentor, las cuales construyeron un asilo. Posteriormente se construyó el Convento del Redentor, una iglesia modernista protegida como Bien Cultural de Interés Local, obra del arquitecto Bernardí Martorell i Puig. Hay que destacar que la vecina Torre de Bellesguard, actualmente en la finca vecina, pero a pocos metros del cedro, fue proyectada por Antoni Gaudí y está declarada Bien Cultural de Interés Nacional.","drl":"Территория кампуса Бельесгуард состоит из здания, в котором размещается Университет Абат Олиба, а также нескольких пространств, образованных озеленёнными клумбами и парковочными зонами. Прежде эти земли входили в состав более крупного имения, в котором выделялась соседняя Торре-де-Бельесгуард, расположенная к югу от университета. Нынешний кампус был выделен и перешёл в собственность конгрегации Сестёр-облаток Пресвятого Искупителя, которые построили приют. Позднее был построен монастырь Искупителя — модернистская церковь, охраняемая как объект культурного достояния местного значения, работа архитектора Бернардино Мартореля-и-Пуига. Следует отметить, что соседняя Торре-де-Бельесгуард, ныне находящаяся на соседнем участке, но в нескольких метрах от кедра, была спроектирована Антони Гауди и объявлена объектом культурного достояния национального значения.","drh":"Кедр гималайский — величественное хвойное дерево высотой до 50 м с поникающими ветвями. Происходит из западных Гималаев.","cn":"0192-05-19","cy":"2021","by":"","cd":"12 m","tp":"2,4 m","ow":""},{"n":"Lledoner del barri d'Horta","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный квартала Horta","s":"Celtis australis","la":41.43508460466628,"ln":2.1559982398005726,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Lledoner_del_barri_dHorta.optimized.4360247b.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-del-barri-d-horta-99400680092","d":"Horta-Guinardó","h":"Horta","a":"Carrer de Salses 89","dr":"El jardín donde se ubica el almez formaba parte de uno más grande, que inicialmente ocupaba el interior de la manzana entre las calles Salses, Lloret de Mar y Campoamor. Actualmente el jardín es de uso de los vecinos del bloque de viviendas, con la presencia de varios árboles, así como unas farolas características de imitación modernista. El interés del presente ejemplar radica en su gran perímetro y su gran copa, que lo convierten en uno de los ejemplares más grandes de Barcelona. El almez, a pesar de estar en un jardín privado, es visible parcialmente desde la calle, pudiéndose observar su copa bien equilibrada.","drl":"Сад, в котором находится каркас, был частью более крупного, первоначально занимавшего внутреннюю часть квартала между улицами Сальсес, Льорет-де-Мар и Кампоамор. В настоящее время сад используется жителями жилого дома, в нём присутствуют различные деревья, а также характерные фонари в подражание модерну. Интерес данного экземпляра заключается в его большом обхвате и большой кроне, которые делают его одним из самых крупных экземпляров в Барселоне. Каркас, несмотря на нахождение в частном саду, частично виден с улицы, и можно наблюдать его хорошо уравновешенную крону.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"","cy":"2021","by":"Per determinar","cd":"20 m","tp":"3,3 m","ow":""},{"n":"Firmianes de la plaça del Congrés Eucarístic","ne":"","sr":"Фирмиана простая","r":"фирмиана","nru":"Фирмиана простая площади Congrés Eucarístic","s":"Firmiana simplex","la":41.42543561628413,"ln":2.180625053401925,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Firmianes_de_la_placa_del_Congres_Eucaristic.optimized.06d2e449.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/firmianes-de-la-placa-del-congres-eucaristic-99400680093","d":"Sant Andreu","h":"el Congrés i els Indians","a":"Plaça del Congrés Eucarístic 1","dr":"Los dos ejemplares se sitúan en la parte occidental de la plaza del Congrés Eucarístic, junto a la calle Felip II. Los dos ejemplares se sitúan en alcorques a ambos lados de la escultura de \"La Maternitat\", rodeados de otras especies arbóreas como cedros (Cedrus deodara), ciclamores (Cercis siliquastrum) o robinias (Robinia pseudoacacia). Estos dos ejemplares son los más grandes en perímetro de los que se tiene constancia en la ciudad de Barcelona.","drl":"Два экземпляра расположены в западной части площади Евхаристического конгресса, рядом с улицей Фелипа II. Оба экземпляра находятся в приствольных лунках по обе стороны от скульптуры «Материнство» в окружении других древесных видов, таких как кедры (Cedrus deodara), церцисы (Cercis siliquastrum) или робинии (Robinia pseudoacacia). Эти два экземпляра — самые крупные по обхвату из тех, о которых имеются сведения в городе Барселоне.","drh":"Фирмиана простая (китайский зонт) — дерево с огромными лопастными листьями и зонтиковидной кроной.","cn":"","cy":"2020","by":"1958","cd":"9 m","tp":"1,4 m","ow":""},{"n":"Magnòlia dels jardins de la Maternitat","ne":"","sr":"Магнолия крупноцветковая","r":"магнолия","nru":"Магнолия крупноцветковая садов Maternitat","s":"Magnolia grandiflora","la":41.382030885339056,"ln":2.125240537829726,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Magnolia_dels_jardins_de_la_Maternitat.optimized.36b60d79.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/magnolia-dels-jardins-de-la-maternitat-99400680094","d":"Les Corts","h":"la Maternitat i Sant Ramon","a":"Carrer d'Elisabeth Eidenbenz 23","dr":"Seguramente es el ejemplar más singular de Barcelona. Se sitúa en uno de los parterres de los jardines de la Maternitat. Este recinto, catalogado como Bien Cultural de Interés Local, está formado por varios edificios construidos en la antigua finca de Can Cavaller (1889-1898). Los pabellones de la Maternitat forman parte del Bien Cultural de Interés Local. Los pabellones de la lactancia y el Ave María, situados cerca de la entrada de la travessera de les Corts, son obra de Oliveres. Josep Obrí i Cansaran continuó los trabajos con la construcción del Pabellón Prat de la Riba. En 1924, Joan Rubió i Bellver y Josep Godall i Casals realizaron el Pabellón Rosa, y Godall el Pabellón Azul. A finales de los años 50, Manuel Baldrich i Tubau construyó el Pabellón Cambó, que da a la travessera. Los pabellones de la Maternitat forman parte del Bien Cultural de Interés Local: Casa Provincial de Maternidad y Expósitos. El recinto cuenta con un valioso patrimonio vegetal, del cual sobresalen varios ejemplares centenarios.","drl":"Вероятно, это самый особенный экземпляр Барселоны. Он расположен на одной из клумб садов Материнства. Эта территория, внесённая в каталог как объект культурного достояния местного значения, состоит из нескольких зданий, построенных на территории старого имения Кан-Кавальер (1889–1898). Павильоны Материнства входят в состав объекта культурного достояния местного значения. Павильоны лактации и Аве Мария, расположенные рядом с входом на Траверсера-де-лес-Кортс, — работа Оливерес. Жузеп Обри-и-Кансаран продолжил работы строительством павильона Прат-де-ла-Рива. В 1924 году Жоан Рубио-и-Бельвер и Жузеп Годалль-и-Касальс построили Розовый павильон, а Годалль — Голубой павильон. В конце 50-х годов Мануэль Бальдрих-и-Тубау построил павильон Камбо, выходящий на Траверсеру. Павильоны Материнства входят в состав объекта культурного достояния местного значения: Провинциальный дом материнства и подкидышей. Территория обладает ценным растительным наследием, среди которого выделяются несколько столетних экземпляров.","drh":"Магнолия крупноцветковая — вечнозелёное дерево с кожистыми листьями и огромными ароматными кремовыми цветами. Один из древнейших родов цветковых растений.","cn":"0195-04-19","cy":"2019","by":"1875","cd":"21 m","tp":"2,8 m","ow":""},{"n":"Molle del jardí d'Aclimatació","ne":"","sr":"Шинус длиннолистный","r":"шинус","nru":"Шинус длиннолистный сада Aclimatació","s":"Schinus longifolia","la":41.36618879896121,"ln":2.152575576331899,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Molle_del_jardi_dAclimatacio.optimized.846e5bcf.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/molle-del-jardi-d-aclimatacio-99400680096","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda de l'Estadi 42","dr":"El jardín de Aclimatación fue creado en 1930 por Rubió i Tudurí, al año siguiente de la Exposición Internacional de Barcelona de 1929, en el terreno donde se habían situado los pabellones de Italia y Suecia. Su objetivo era el de crear una zona de especial protección para la aclimatación de especies foráneas. El núcleo principal fueron especies de los cinco continentes que se llevaron para la exposición, y que más tarde se fueron ampliando hasta 1937, fecha en que la Guerra Civil interrumpió los trabajos. Posteriormente, en 1945, el arquitecto Lluís Riudor y el botánico Joan Pañella retomaron los trabajos de plantación, que se prolongaron hasta los años 1980. Este jardín alberga alrededor de 230 especies de plantas, algunas de ellas únicas o de escasa presencia en la ciudad. Schinus longifolia, originario de América del Sur, es una rareza botánica en nuestra ciudad. Solamente encontramos otro ejemplar, también catalogado, en la calle Joaquim Blume. En este caso, la rareza botánica del ejemplar se une con la estética de la inclinación y el tamaño del ejemplar, algo poco común en esta especie.","drl":"Сад Аклиматасьо был создан в 1930 году Рубио-и-Тудури, на следующий год после Международной выставки в Барселоне 1929 года, на земле, где располагались павильоны Италии и Швеции. Его целью было создание зоны особой защиты для акклиматизации чужеродных видов. Основное ядро составляли виды с пяти континентов, привезённые для выставки, и позднее оно расширялось до 1937 года, когда Гражданская война прервала работы. Затем, в 1945 году, архитектор Лльюис Риудор и ботаник Жоан Паньелья возобновили посадочные работы, которые продолжались до 1980-х годов. В этом саду насчитывается около 230 видов растений, некоторые из них уникальны или малочисленны в городе. Schinus longifolia, родом из Южной Америки, — ботаническая редкость в нашем городе. Мы находим лишь ещё один экземпляр, также внесённый в каталог, на улице Жоакима Блюма. В данном случае ботаническая редкость экземпляра сочетается с эстетикой наклона и величиной экземпляра, что мало свойственно этому виду.","drh":"Шинус длиннолистный — южноамериканское вечнозелёное дерево с перистыми листьями. Ботаническая редкость в Европе.","cn":"0200-03-20","cy":"2020","by":"Per determinar","cd":"9 m","tp":"1,6 m","ow":""},{"n":"Xicranda de l'Edifici IBM","ne":"","sr":"Жакаранда мимозолистная","r":"жакаранда","nru":"Жакаранда мимозолистная","s":"Jacaranda mimosifolia","la":41.398010131750816,"ln":2.1396419941485063,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Xicranda_de_la_Via_Augusta.optimized.375c6813.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xicranda-de-l-edifici-ibm-99400680098","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Via Augusta 202","dr":"Forma parte de un jardín que bordea todo el edificio de la Via Augusta, salvando un desnivel mediante un talud de césped. Tenemos gran cantidad de árboles, de los que destacan un ejemplar de ficus (Ficus rubiginosa), una jacarandá (Jacaranda mimosifolia) y varios pies de pinos canarios (Pinus canariensis). El ejemplar presenta un perímetro considerable, que no supera sin embargo el de las dos catalogadas de la calle Alfons XII ni el de otras que tenemos inventariadas en la montaña de Montjuïc: Teatre Grec, Miramar, etc. El interés se ve reforzado por su situación, en un lugar plenamente urbano, así como por su arquitectura arbórea, que presenta una copa inclinada muy bella.","drl":"Является частью сада, окаймляющего всё здание на Виа Аугуста и преодолевающего перепад высот посредством газонного откоса. Здесь большое количество деревьев, среди которых выделяются экземпляр фикуса (Ficus rubiginosa), жакаранда (Jacaranda mimosifolia) и несколько канарских сосен (Pinus canariensis). Экземпляр имеет значительный обхват, который, однако, не превосходит двух внесённых в каталог жакаранд с улицы Альфонса XII и также других, имеющихся в нашей инвентаризации на горе Монжуик: Греческий театр, Мирамар и др. Интерес усиливается его расположением в полностью городском месте, а также его древесной архитектурой: у него очень красивая наклонённая крона.","drh":"Жакаранда мимозолистная — декоративное дерево из Южной Америки с перистыми листьями и густыми синими цветами. Цветёт в конце весны.","cn":"0206-05-20","cy":"2021","by":"Per determinar","cd":"12 m","tp":"1,53 m","ow":""},{"n":"Teix de l'Escola Pia de Sarrià","ne":"","sr":"Тис ягодный","r":"тис","nru":"Тис ягодный","s":"Taxus baccata","la":41.4069203325806,"ln":2.124704445418347,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Teix_de_lEscola_Pia_de_Sarria.optimized.e5ff38eb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/teix-de-l-escola-pia-de-sarria-99400680100","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer de la Immaculada 25","dr":"En 1894 se inauguró el edificio de la Escola Pia de Sarrià, obra del arquitecto Francesc Mariné. El colegio se creó como internado de los Escolapios de Barcelona y dependía de la Escola Pia de Sant Antoni. En su entorno se construyó un jardín de estilo clásico donde hay notables ejemplares centenarios. Uno de ellos es el tejo que se ubica en pleno centro de la rotonda circular en el centro neurálgico del jardín, justo a la entrada del recinto. La rotonda está sembrada de césped y perimetrada por una valla de vegetación arbustiva.","drl":"В 1894 году было открыто здание школы Эскола-Пиа в Сарриа, работа архитектора Франсеска Марине. Колледж был создан как интернат Пиаристов Барселоны и зависел от школы Эскола-Пиа в Сант-Антони. Вокруг него был разбит сад в классическом стиле, где находятся значительные столетние экземпляры. Один из них — тис, расположенный посреди круглой ротонды в нервном центре сада, прямо при входе на территорию. Ротонда засеяна газоном и обнесена изгородью из кустарниковой растительности.","drh":"Тис ягодный — медленнорастущее хвойное дерево с ядовитыми семенами в красной оболочке. Очень теневынослив, живёт до 2000 лет.","cn":"0199-05-19","cy":"2021","by":"Per determinar","cd":"12 m","tp":"1,53 m","ow":""},{"n":"Pebrers de Brasil dels jardins Joan Maragall","ne":"","sr":"Шинус терпентинолистный","r":"шинус","nru":"Шинус терпентинолистный","s":"Schinus terebinthifolia","la":41.366506370449734,"ln":2.156226642344811,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Pebrers_de_Brasil_dels_jardins_Joan_Maragall.optimized.01664560.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pebrers-de-brasil-dels-jardins-joan-maragall-99400680105","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda de l'Estadi 65","dr":"Estos jardines tienen su origen en los que diseñó Jean-Claude Nicolas Forestier alrededor del pabellón real que se construyó en Montjuïc dentro del recinto de la Exposición Internacional de 1929. El objetivo del edificio fue doble: que Alfonso XIII dispusiera de un espacio para grandes recepciones y también de un lugar donde hacer una pausa y reposar un rato durante sus visitas a la mencionada exposición. Terminada la muestra, se pensó ubicar allí el Museo de la Música de la ciudad, un proyecto que no prosperó pero que sí determinó el nombre con el que se conoce el palacete y con el que, durante muchos años, se conocieron los jardines que lo rodean: Albéniz, en honor al gran músico Isaac Albéniz. En 1970 los jardines se ampliaron y pasaron a llamarse Joan Maragall. Actualmente, el Palacete Albéniz es la residencia de la familia real española en Barcelona cuando están de visita oficial, de los invitados ilustres de la ciudad y sede de recepciones municipales de relevancia. Actualmente los jardines están cerrados al público, excepto los días festivos.","drl":"Эти сады берут начало от тех, что спроектировал Жан-Клод Николя Форестье вокруг королевского павильона, построенного на Монжуике в пределах территории Международной выставки 1929 года. Цель здания была двоякой: чтобы у Альфонса XIII было помещение для больших приёмов, а также место, где можно было сделать паузу и немного отдохнуть во время его визитов на упомянутую выставку. По окончании выставки было решено разместить здесь Музей музыки города — проект, который не получил развития, но определил название, под которым известен дворец и под которым много лет были известны окружающие его сады: Альбенис, в честь великого музыканта Исаака Альбениса. В 1970 году сады были расширены и стали называться Жоан-Мараль. В настоящее время дворец Альбенис — это резиденция испанской королевской семьи в Барселоне во время официальных визитов, знатных гостей города и место важных муниципальных приёмов. В настоящее время сады закрыты для публики, кроме праздничных дней.","drh":"Шинус терпентинолистный — вечнозелёное дерево с ароматными листьями и красными ягодами. Из Бразилии.","cn":"0198-03-19","cy":"2019","by":"","cd":"10 m","tp":"2,35 m","ow":""},{"n":"Pollancre del Canadà del parc Apolo","ne":"","sr":"Тополь канадский","r":"тополь","nru":"Тополь канадский","s":"Populus x canadensis","la":41.45599210244125,"ln":2.1818106645203184,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Pollancre_del_Canada_del_parc_Apolo.optimized.fb3a15c2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pollancre-del-canada-del-parc-apolo-99400680107","d":"Nou Barris","h":"Torre Baró","a":"Carrer de Llerona 40","dr":"El Parque Apolo es un pequeño rincón de 900 m2 del barrio de Torre Baró ubicado en una curva de la calle de Llerona, aprovechando el fondo de un barranco. El espacio lo conforma una serie de terrazas con bancos y espacios de encuentro que descienden hasta llegar a una fuente y un acueducto. El nombre de Parque Apolo recuerda la casa que se alzaba en la zona entre 1940 y 1995, el Mirador Apolo. Fue bautizado con este nombre porque los propietarios tenían una estatuilla del dios Apolo. Esta casa se convirtió en una muestra representativa de la primera época de la urbanización del barrio, con la idea de proyectar una ciudad jardín, que finalmente no salió adelante. Por los alrededores había un jardín, un pozo, grandes árboles y una fuente. La casa fue expropiada por el Ayuntamiento y derribada en 1995. Posteriormente el Ayuntamiento urbanizó la zona como parque, y conservó los árboles y la fuente, que fue remodelada. El ejemplar más notable de esta vegetación es el chopo del Canadá que se propone catalogar.","drl":"Парк Аполо — небольшой уголок площадью 900 м² в районе Торре-Баро, расположенный на повороте улицы Льерона, использующий дно оврага. Пространство образовано рядом террас со скамьями и местами для встреч, спускающимися к фонтану и акведуку. Название «Парк Аполо» напоминает о доме, который стоял в этой зоне с 1940 по 1995 год, — Мирадор Аполо. Он был так назван, потому что у владельцев была статуэтка бога Аполлона. Этот дом стал представительным образцом первого периода застройки района, с идеей спроектировать город-сад, которая в конечном итоге не осуществилась. Вокруг находились сад, колодец, большие деревья и фонтан. Дом был экспроприирован муниципалитетом и снесён в 1995 году. Позднее муниципалитет благоустроил эту зону как парк, сохранив деревья и фонтан, который был реконструирован. Самый примечательный экземпляр этой растительности — канадский тополь, который предлагается внести в каталог.","drh":"Тополь канадский — быстрорастущее листопадное дерево. Гибрид, часто используется в парках и вдоль водоёмов.","cn":"0197-08-19","cy":"2019","by":"Per determinar","cd":"12 m","tp":"3,2 m","ow":""},{"n":"Bellaombres de la plaça Prim","ne":"","sr":"Фитолакка (омбу)","r":"фитолакка (омбу)","nru":"Фитолакка (омбу) площади Prim","s":"Phytolacca dioica","la":41.399466663938234,"ln":2.2070549403198183,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111256450091-10-94_1.optimized.53e180bc.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/bellaombres-de-la-placa-prim-99400455038","d":"Sant Martí","h":"el Poblenou","a":"Plaça de Prim 2","dr":"Este árbol, originario de las pampas de América del Sur, se caracteriza por un gran desarrollo en anchura, tanto de las raíces como de la copa. Existe un conjunto de tres ejemplares que da personalidad en la pequeña plaza de Prim, en el corazón del barrio del Poblenou.","drl":"Это дерево, родом из пампы Южной Америки, отличается большим развитием вширь, как корней, так и кроны. Группа из трёх экземпляров придаёт индивидуальность небольшой площади Прим, в самом сердце района Побленоу.","drh":"Омбу — южноамериканское вечнозелёное дерево с мощным стволом и мочковатой корневой системой; «благородное тень дающее дерево».","cn":"0091-10-94","cy":"1994","by":"1924","cd":"14 m","tp":"2,8 m","ow":"Públic"},{"n":"Alzina de la Diagonal","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный","s":"Quercus ilex","la":41.39746550058287,"ln":2.1634510326267464,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141035470006-02-93_1.optimized.6ae5ae19.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzina-de-la-diagonal-99400455046","d":"Eixample","h":"la Dreta de l'Eixample","a":"Av Diagonal 361","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Este es un ejemplar de encina bien formado, excepcionalmente desarrollado como árbol de alineación. Es el más destacado del largo tramo de la avenida Diagonal entre la calle de la Marina y el paseo de Gràcia, rítmicamente y sorprendentemente punteado con plátanos orientales alternados con encinas de porte mucho más disminuido.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсеролы. Это хорошо сформированный экземпляр каменного дуба, исключительно развитый как аллейное дерево. Он самый выдающийся на длинном участке проспекта Диагональ между улицей Марина и проспектом Грасия, ритмично и неожиданно усаженном восточными платанами, чередующимися с каменными дубами гораздо меньшей стати.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0006-02-93","cy":"1993","by":"1923","cd":"13 m","tp":"1,8 m","ow":"Públic"},{"n":"Llentiscle de l'Hort de l'Avi","ne":"","sr":"Фисташка мастиковая","r":"Pistacia","nru":"Фисташка мастиковая","s":"Pistacia lentiscus","la":41.4159744572976,"ln":2.149100134074295,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031153270160-06-13_1.optimized.3d569a32.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/llentiscle-de-l-hort-de-l-avi-99400455063","d":"Gràcia","h":"el Coll","a":"Carrer del Torrent del Remei 14","dr":"El lentisco es una especie propia de las regiones mediterráneas. Normalmente presenta una forma arbustiva y raramente lo encontramos en forma de árbol. El ejemplar catalogado se encuentra situado discretamente en la zona forestal de la colina donde se asienta el Park Güell. El ejemplar, a pesar de no ser muy alto, tiene dos grandes brazos que se extienden totalmente en horizontal, uno sin apoyo y otro totalmente tumbado en el suelo.","drl":"Мастиковое дерево — вид, свойственный средиземноморским регионам. Обычно оно имеет кустарниковую форму, и в виде дерева мы встречаем его редко. Внесённый в каталог экземпляр сдержанно расположен в лесной зоне холма, на котором находится парк Гуэль. Экземпляр, хотя и невысокий, имеет две большие ветви, полностью расходящиеся горизонтально: одна без опоры, а другая полностью лежит на земле.","drh":"Фисташка мастиковая — вечнозелёный кустарник или небольшое дерево. Источник мастиковой смолы.","cn":"0160-06-13","cy":"2013","by":"Per determinar","cd":"8 m","tp":"0,7 m","ow":"Públic"},{"n":"Plàtan de la plaça Catalunya - Fontanella","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный площади Catalunya - Fontanella","s":"Platanus x acerifolia","la":41.38689710795474,"ln":2.1716421001585164,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041255250177-02-17_1.optimized.17a30866.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-de-la-placa-catalunya-fontanella-99400638002","d":"Eixample","h":"la Dreta de l'Eixample","a":"Carrer de Fontanella 1","dr":"El plátano de sombra es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. El ejemplar catalogado está en uno de los extremos de la plaza de Catalunya y tiene una copa imponente, muestra de que ha podido crecer sin restricciones.","drl":"Платан кленолистный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Внесённый в каталог экземпляр находится на одном из краёв площади Каталунья и имеет внушительную крону, что свидетельствует о том, что он смог расти без ограничений.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0177-02-17","cy":"2017","by":"","cd":"20 m","tp":"2,5 m","ow":""},{"n":"Iuca filífera dels jardins de Mossèn Costa i Llobera","ne":"","sr":"Юкка нитеносная","r":"Yucca","nru":"Юкка нитеносная","s":"Yucca filifera","la":41.36828235931025,"ln":2.171772883931611,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/233-2.optimized.8ad3e163.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/iuca-filifera-dels-jardins-de-mossen-costa-i-llobera-99400761023","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Jardins de Mossèn Costa i Llobera 0","dr":"La yuca filifera es originaria de México y pertenece a la familia de las Asparagáceas. Seguramente es uno de los ejemplares más singulares de esta especie de toda Cataluña. Forma parte de una excepcional colección botánica situada en los jardines de Mossèn Costa i Llobera, dedicada en buena parte a las plantas crasas, las cactáceas y, en general, las propias de hábitats desérticos.","drl":"Юкка нитчатая родом из Мексики и принадлежит к семейству спаржевых. Вероятно, это один из самых особенных экземпляров этого вида во всей Каталонии. Она является частью исключительной ботанической коллекции, расположенной в садах Мосена Косты-и-Льоберы, посвящённой в значительной мере суккулентам, кактусам и в целом растениям, свойственным пустынным средам обитания.","drh":"Юкка нитеносная — крупное растение из Мексики с розеткой жёстких листьев и огромным соцветием-метёлкой.","cn":"0233-03-24","cy":"2024","by":"Per determinar","cd":"8 m","tp":"1.6 m","ow":""},{"n":"Bellaombres de la rambla del Caçador","ne":"","sr":"Фитолакка (омбу)","r":"фитолакка (омбу)","nru":"Фитолакка (омбу) бульвара Caçador","s":"Phytolacca dioica","la":41.44074891555887,"ln":2.16963266712639,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/236.optimized.21dbebe4.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/bellaombres-de-la-rambla-del-cacador-99400761026","d":"Nou Barris","h":"la Guineueta","a":"Rambla del Caçador 17","dr":"La bellasombra es uno de los árboles más peculiares que tenemos en Barcelona. A pesar de que tiene un desarrollo de tronco que difiere del de los verdaderos árboles, pues no produce verdaderos anillos de crecimiento, su desarrollo crea unas formas espectaculares. Esta especie, originaria de la zona central de América del Sur, se introdujo en Barcelona con los proyectos que realizaron Forestier y Rubió i Tudurí a principios del siglo XX. Las bellasombras de la rambla del Caçador forman uno de los conjuntos de esta especie más espectaculares de Barcelona.","drl":"Фитолакка — одно из самых своеобразных деревьев, которые есть в Барселоне. Хотя развитие её ствола отличается от настоящих деревьев, так как она не образует настоящих годичных колец, его развитие создаёт эффектные формы и очертания. Этот вид, родом из центральной части Южной Америки, был введён в Барселоне проектами, которые осуществляли Форестье и Рубио-и-Тудури в начале XX века. Фитолакки на рамбле дель Касадор образуют одну из самых эффектных групп этого вида в Барселоне.","drh":"Омбу — южноамериканское вечнозелёное дерево с мощным стволом и мочковатой корневой системой; «благородное тень дающее дерево».","cn":"0236-08-24","cy":"2024","by":"Per determinar","cd":"12 m","tp":"3.1 m","ow":""},{"n":"Livistona australiana de l'Ateneu Barcelonès","ne":"","sr":"Ливистона южная","r":"ливистона","nru":"Ливистона южная","s":"Livistona australis","la":41.38440451076302,"ln":2.1716640363372997,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201035090053-01-94_1.optimized.90196b32.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/livistona-australiana-de-l-ateneu-barcelones-99400455068","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Plaça de la Vila de Madrid 11","dr":"La livistona de Australia es una palmera esbelta que puede llegar a hacer 25 m de altura y que es originaria de Australia. Este ejemplar se integra perfectamente en el patio del Palacio Savassona, declarado bien cultural de interés nacional. Desde principios del siglo XX es la sede del Ateneo Barcelonés.","drl":"Австралийская ливистона — стройная пальма, которая может достигать 25 м в высоту и происходит из Австралии. Этот экземпляр прекрасно вписывается во двор дворца Савассона, объявленного культурным достоянием национального значения. С начала XX века здесь находится Барселонский атеней.","drh":"Ливистона южная — стройная пальма с веерными листьями из Австралии. Вырастает до 25 м.","cn":"0053-01-94","cy":"1994","by":"1894","cd":"6 m","tp":"1,1 m","ow":"Privat"},{"n":"Acàcia de les tres punxes de l'estació de Sant Andreu Comtal","ne":"","sr":"Гледичия трёхколючковая","r":"Gleditsia","nru":"Гледичия трёхколючковая","s":"Gleditsia triacanthos","la":41.43598060771901,"ln":2.19300847755857,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061456440037-09-93_1.optimized.5bb318cb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/acacia-de-les-tres-punxes-de-l-estacio-de-sant-andreu-comtal-99400455084","d":"Sant Andreu","h":"Sant Andreu","a":"Plaça de l'Estació 11","dr":"La acacia de tres espinas es un árbol caduco proveniente de Norteamérica que se caracteriza porque tiene espinas en las ramas y en el tronco. Este ejemplar está al lado de la estación de Sant Andreu y data del momento de la llegada del tren al barrio.","drl":"Гледичия трёхколючковая — листопадное дерево родом из Северной Америки, отличающееся тем, что у него есть колючки на ветвях и на стволе. Этот экземпляр находится рядом со станцией Сант-Андреу и относится ко времени прихода поезда в район.","drh":"Гледичия трёхколючковая — североамериканское дерево с крупными колючками на стволе. Плоды — длинные бобы.","cn":"0037-09-93","cy":"1993","by":"1913","cd":"13 m","tp":"2,6 m","ow":"Públic"},{"n":"Llentiscle del Parc de la Creueta del Coll","ne":"","sr":"Фисташка мастиковая","r":"Pistacia","nru":"Фисташка мастиковая парка Creueta del Coll","s":"Pistacia lentiscus","la":41.418752170074335,"ln":2.1482576154905813,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041215360182-06-18_1.optimized.df0f4056.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/llentiscle-del-parc-de-la-creueta-del-coll-99400638023","d":"Gràcia","h":"el Coll","a":"Passeig de la Mare de Déu del Coll 77","dr":"El lentisco es una especie propia de las regiones mediterráneas. Normalmente presenta una forma arbustiva, y raramente lo encontramos en forma de árbol. En este caso se trata de un ejemplar con forma arbustiva, notable por su gran extensión en superficie. Está en un talud a la entrada sur del parque de la Creueta del Coll.","drl":"Мастиковое дерево — вид, свойственный средиземноморским краям. Обычно оно имеет кустарниковую форму, в виде дерева мы встречаем его редко. В данном случае это экземпляр кустарниковой формы, примечательный большой площадью распространения. Он находится на откосе у южного входа в парк Креуэта-дель-Кой.","drh":"Фисташка мастиковая — вечнозелёный кустарник или небольшое дерево. Источник мастиковой смолы.","cn":"0182-06-18","cy":"2018","by":"Per determinar","cd":"6 m","tp":"0,2 m","ow":""},{"n":"Alzina de Can Vidalet","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный","s":"Quercus ilex","la":41.405599565989476,"ln":2.1586454513475912,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910021421160185-06-18_3.optimized.6b71392d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzina-de-can-vidalet-99400638027","d":"Gràcia","h":"la Vila de Gràcia","a":"Carrer de l'Encarnació 13","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Seguramente estamos hablando de la encina con un diámetro más grande de las que tenemos constancia en la trama urbana de Barcelona. La singularidad del ejemplar aumenta dado que la encina se encuentra en un barrio, el de Gràcia, que destaca por la poca superficie de espacios verdes y, en particular, por la ausencia de árboles singulares. La historia de la encina está ligada a la antigua masía de Can Vidalet, actualmente todavía visible al otro lado de la calle Manrique de Lara.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсеролы. Вероятно, речь идёт о каменном дубе с самым большим диаметром из тех, о которых у нас есть сведения в городской застройке Барселоны. Особенность экземпляра возрастает оттого, что каменный дуб находится в районе Грасия, выделяющемся малой площадью зелёных пространств и, в частности, отсутствием особенных деревьев. История каменного дуба связана со старой усадьбой Кан-Видалет, которая по сей день ещё видна на другой стороне улицы Манрике-де-Лара.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0185-06-18","cy":"2018","by":"Per determinar","cd":"20 m","tp":"2,7 m","ow":""},{"n":"Araucària de la casa de la Misericòrdia","ne":"","sr":"Араукария разнолистная","r":"араукария","nru":"Араукария разнолистная дома Misericòrdia","s":"Araucaria heterophylla","la":41.38353372477904,"ln":2.168782330504542,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/2019%2C10%2C07103340%2C0166-01-16_1-760x428.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-de-la-casa-de-la-misericordia-99400637926","d":"Ciutat Vella","h":"el Raval","a":"Carrer d'Elisabets 6","dr":"La araucaria de Norfolk es endémica de la isla australiana de Norfolk. Se caracteriza por la simetría de su configuración, con pisos que se van añadiendo año tras año, formados por 5 ramas que salen del tronco horizontalmente. Este ejemplar se sitúa en un jardín privado, en la Casa de la Misericòrdia, en el barrio del Raval.","drl":"Норфолкская араукария — эндемик австралийского острова Норфолк. Она отличается симметрией своей конфигурации, с ярусами, добавляющимися год за годом, состоящими из 5 ветвей, отходящих от ствола горизонтально. Этот экземпляр расположен в частном саду, в Каса-де-ла-Мизерикордия, в районе Раваль.","drh":"Араукария разнолистная — хвойное дерево с симметричной пирамидальной кроной. Символ острова Норфолк.","cn":"0166-01-16","cy":"2016","by":"","cd":"10 m","tp":"1,5 m","ow":""},{"n":"Fals plàtan del Jardí Botànic Històric","ne":"","sr":"Клён ложноплатановый","r":"клён","nru":"Клён ложноплатановый","s":"Acer pseudoplatanus","la":41.36676958101976,"ln":2.152068734230853,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Fals_platan.760x428.b80c3ad3.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/fals-platan-del-jardi-botanic-historic-99400637939","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda dels Montanyans 30","dr":"El falso plátano es un árbol habitual en el arbolado urbano de la mayoría de ciudades europeas de clima más continental. En nuestra ciudad es muy difícil de encontrar, y más con las dimensiones de este ejemplar. El microclima que se forma en su ubicación, en la parte más honda del Jardín Botánico Histórico, seguramente ha contribuido a su buen desarrollo.","drl":"Явор — обычное дерево в городском озеленении большинства европейских городов с более континентальным климатом. В нашем городе его очень трудно найти, а тем более с размерами этого экземпляра. Микроклимат, образующийся в его месте расположения, в самой глубокой части Исторического ботанического сада, вероятно, способствовал его хорошему развитию.","drh":"Клён ложноплатановый — листопадное дерево с лопастными листьями из Европы. Редкий вид в тёплом климате Барселоны.","cn":"0170-03-15","cy":"2015","by":"Per determinar","cd":"12 m","tp":"1,4 m","ow":""},{"n":"Acàcia del Japó del carrer Guàrdia Urbana","ne":"","sr":"Софора японская","r":"софора","nru":"Софора японская","s":"Styphnolobium japonicum","la":41.37137236428438,"ln":2.1544330596609433,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/234.optimized.64fe88f0.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/acacia-del-japo-del-carrer-guardia-urbana-99400761024","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer de la Guàrdia Urbana 5","dr":"La sófora, históricamente, es uno de los árboles más utilizados en el arbolado urbano. Originaria del este de Asia, especialmente de China, este es el ejemplar mejor constituido que podemos encontrar en toda la trama urbana de Barcelona. Se sitúa en un alcorque en la confluencia de las calles de la Guàrdia Urbana y de Joaquim Blume.","drl":"Японская акация исторически является одним из самых используемых деревьев в городском озеленении. Родом с востока Азии, особенно из Китая, это наиболее хорошо сложённый экземпляр из тех, что можно найти во всей городской застройке Барселоны. Он расположен в приствольной лунке на пересечении улиц Гуардия-Урбана и Жоакима Блюма.","drh":"Софора японская — декоративное листопадное дерево с перистыми листьями и кремовыми цветами в метёлках. Устойчива в городе.","cn":"0234-03-24","cy":"2024","by":"En estudi","cd":"15 m","tp":"2.3 m","ow":""},{"n":"Araucària del carrer Sant Joan de Malta","ne":"","sr":"Араукария разнолистная","r":"араукария","nru":"Араукария разнолистная улицы Sant Joan de Malta","s":"Araucaria heterophylla","la":41.41007386877061,"ln":2.1909626330158356,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0222-10-22.optimized.de0a9886.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-del-carrer-sant-joan-de-malta-99400728985","d":"Sant Martí","h":"el Clot","a":"Carrer de Sant Joan de Malta 3","dr":"El árbol está en el patio posterior de una vivienda particular, junto al muro que delimita la finca con la calle Concili de Trento. El patio, de dimensiones modestas, tiene abundante vegetación y muestra un buen mantenimiento. La plantación data de principios de los años ochenta y representa uno de los ejemplares privados de esta especie más grandes de Barcelona.","drl":"Дерево находится на заднем дворе частного дома, рядом со стеной, отделяющей участок от улицы Концили-де-Трент. Двор скромных размеров богат растительностью и демонстрирует хороший уход. Посадка относится к началу восьмидесятых годов и представляет один из самых крупных частных экземпляров этого вида в Барселоне.","drh":"Араукария разнолистная — хвойное дерево с симметричной пирамидальной кроной. Символ острова Норфолк.","cn":"0222-10-22","cy":"2022","by":"1920","cd":"6 m","tp":"1,5 m","ow":""},{"n":"Plàtan d'ombra del passatge Irlanda","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный","s":"Platanus x acerifolia","la":41.4314075910549,"ln":2.1860108201834754,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/237.optimized.ca7edb5f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-d-ombra-del-passatge-irlanda-99400761029","d":"Sant Andreu","h":"Sant Andreu","a":"Passatge d'Irlanda 2","dr":"Sant Andreu es uno de los barrios más densos de Barcelona, lo que dificulta la implantación de arbolado grande. El tramo final del pasaje de Irlanda supone un pequeño oasis dentro de esta trama urbana, lo que ha permitido un buen desarrollo aéreo de este plátano. Por dimensión y buen estado, este plátano es uno de los mejores ejemplares de todo el distrito de Sant Andreu.","drl":"Сант-Андреу — один из самых плотно застроенных районов Барселоны, что затрудняет высадку крупных деревьев. Конечный отрезок переулка Ирландия представляет собой небольшой оазис в этой городской ткани, что позволило этому платану хорошо развить надземную часть. По размерам и хорошему состоянию этот платан — один из лучших экземпляров во всём районе Сант-Андреу.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0237-09-24","cy":"2024","by":"Per determinar","cd":"23 m","tp":"2.7 m","ow":""},{"n":"Plàtans del camí del pantà de Vallvidrera","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный пути pantà de Vallvidrera","s":"Platanus x acerifolia","la":41.416042683759336,"ln":2.0976615311309823,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0217-05-21.optimized.1e900259.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-del-cami-del-panta-de-vallvidrera-99400728978","d":"Sarrià-Sant Gervasi","h":"Vallvidrera, el Tibidabo i les Planes","a":"Camí del Pantà 40","dr":"La situación de los árboles en un fondo de valle con agua constante en el freático ha contribuido a este gran crecimiento. El perímetro del tronco en todos los ejemplares supera los 3 m. El conjunto de plátanos del camino del pantano de Vallvidrera forma un conjunto excepcional por sus dimensiones, superando la altura de todos los ejemplares catalogados (28 m el más alto, 0176-03-17). La singularidad del conjunto se ve incrementada por su composición estética como grupo y por estar ligado históricamente a una infraestructura como es el pantano de Vallvidrera, con más de 150 años de antigüedad.","drl":"Расположение деревьев на дне долины с постоянным присутствием воды в грунтовом слое способствовало этому большому росту. Обхват ствола у всех экземпляров превышает 3 м. Группа платанов на дороге к водохранилищу Вальвидрера образует исключительную группу по своим размерам, превосходя по высоте все внесённые в каталог экземпляры (28 м самый высокий, 0176-03-17). Особенность группы усиливается её эстетической композицией как группы и тем, что она исторически связана с такой инфраструктурой, как водохранилище Вальвидрера, которому более 150 лет.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0217-05-21","cy":"2021","by":"Per determinar","cd":"15 m","tp":"3 m","ow":""},{"n":"Washintònia del carrer dels Jocs Florals","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая улицы Jocs Florals","s":"Washingtonia robusta","la":41.374995065882324,"ln":2.134455671474956,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0220-03-21.optimized.5cc4e960.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washintonia-del-carrer-dels-jocs-florals-99400728981","d":"Sants-Montjuïc","h":"Sants","a":"Carrer dels Jocs Florals 12","dr":"Esta washingtonia de México es de las más altas de todas las palmeras de Barcelona, solo superada en altura por la de Can Verdaquer (29 m), que es la más alta hasta el momento. Aparte de este hecho, su singularidad también se incrementa debido a su historia, ligada al domicilio de un ilustre personaje como es Jacint Laporta i Mercader, muy ligado a la historia de Sants.","drl":"Эта мексиканская вашингтония — одна из самых высоких среди всех пальм Барселоны, её по высоте превосходит только пальма в Кан-Вердакер (29 м), которая на данный момент самая высокая. Помимо этого факта, её особенность усиливается также благодаря её истории, связанной с домом выдающейся личности — Хасинто Лапорты-и-Мерсадера, тесно связанного с историей Санса.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":

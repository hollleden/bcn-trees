ит из семи экземпляров разных размеров, расположенных внутри пруда парка Сьютаделья.","drh":"Таксодиум двурядный (болотный кипарис) — листопадное хвойное дерево, растущее вдоль водоёмов. Образует дыхательные корни-«колени».","cn":"0046-01-93","cy":"1993","by":"1933","cd":"6 m","tp":"1,5 m","ow":"Públic"},{"n":"Xicrandes del carrer Alfons XII","ne":"","sr":"Жакаранда мимозолистная","r":"жакаранда","nru":"Жакаранда мимозолистная улицы Alfons XII","s":"Jacaranda mimosifolia","la":41.399443485564156,"ln":2.1484840411106094,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031222230070-05-94_1.optimized.447b8e0e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xicrandes-del-carrer-alfons-xii-99400454977","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Carrer d'Alfons XII 49","dr":"La jacarandá, originaria de América del Sur, es uno de los árboles más utilizados en Barcelona y destaca por su espectacular floración violeta al final de la primavera. Conjunto de dos ejemplares de tamaño admirable que se encuentran en un terreno privado, aunque son visibles desde la calle de Alfons XII.","drl":"Жакаранда, родом из Южной Америки, — одно из самых используемых деревьев в Барселоне и выделяется эффектным фиолетовым цветением в конце весны. Группа из двух экземпляров восхитительных размеров, находящихся на частной территории, хотя и видимых с улицы Альфонса XII.","drh":"Жакаранда мимозолистная — декоративное дерево из Южной Америки с перистыми листьями и густыми синими цветами. Цветёт в конце весны.","cn":"0070-05-94","cy":"1994","by":"1904","cd":"23 m","tp":"2 m","ow":"Privat"},{"n":"Washingtònies de l'Avinguda Francesc Ferrer i Guàrdia","ne":"","sr":"Вашингтония нитеносная","r":"вошингтония","nru":"Вашингтония нитеносная","s":"Washingtonia filifera","la":41.36945450676438,"ln":2.1458180560266795,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061514060097-03-94_1.optimized.7f742faa.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-l-avinguda-francesc-ferrer-i-guardia-99400454979","d":"Sants-Montjuïc","h":"la Font de la Guatlla","a":"Carrer de la Dàlia 46","dr":"La washingtonia de California, más esbelta que la de México, es una de las palmeras más comunes en la ciudad. Se trata de un conjunto extraordinario de 24 washingtonias distribuidas en seis hileras paralelas de cuatro ejemplares cada una. Por la edad, corresponden a las primeras plantaciones realizadas en la montaña de Montjuïc. Esta especie, de porte rotundo, se puede ver en otros puntos de la ciudad, pero la calidad y cantidad de este conjunto lo hacen excepcional.","drl":"Калифорнийская вашингтония, более стройная, чем мексиканская, — одна из самых распространённых пальм в городе. Это необыкновенная группа из 24 вашингтоний, распределённых в шесть параллельных рядов по четыре экземпляра в каждом. По возрасту они соответствуют первым посадкам, произведённым на горе Монжуик. Этот вид внушительной стати можно увидеть и в других местах города, но качество и количество этой группы делают её исключительной.","drh":"Вашингтония нитеносная — пальма с веерными листьями и «юбкой» из сухих листьев на стволе. Из Калифорнии.","cn":"0097-03-94","cy":"1994","by":"1909","cd":"7 m","tp":"1,2 m","ow":"Públic"},{"n":"Washingtònia de Can Verdaguer","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая","s":"Washingtonia robusta","la":41.43442848285889,"ln":2.1790189983790422,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121238200085-08-94_1.optimized.d80e01a0.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonia-de-can-verdaguer-99400454983","d":"Nou Barris","h":"Porta","a":"Carrer de l'Estudiant 48","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. El ejemplar, de altura notable, destaca al lado de la antigua masía de Can Verdaguer, actualmente centro cívico, un edificio protegido como bien cultural de interés local.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Экземпляр значительной высоты выделяется рядом со старой усадьбой Кан-Вердагер, ныне гражданским центром, зданием, охраняемым как культурное достояние местного значения.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0085-08-94","cy":"1994","by":"1894","cd":"6 m","tp":"1,2 m","ow":"Públic"},{"n":"Tipuanes de la plaça Sant Felip Neri","ne":"","sr":"Типуана","r":"типуана","nru":"Типуана площади Sant Felip Neri","s":"Tipuana tipu","la":41.38346850793574,"ln":2.1750950381875955,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200947590021-01-93_1.optimized.5c8de578.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tipuanes-de-la-placa-sant-felip-neri-99400454937","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Pl Sant Felip Neri 4","dr":"La tipuana es un árbol originario de América del Sur que fue introducido en la ciudad a principios del siglo XX. Actualmente es una de las especies más comunes en nuestra ciudad. El conjunto lo forman tres ejemplares que se complementan estéticamente con la bonita plaza de Sant Felip Neri. La onda expansiva de una bomba de aviación destruyó, durante la Guerra Civil, tres casas de la plazoleta, entonces mucho más reducida. Después de desescombrarlas, se plantaron las tipuanas. Tras reconstruir los solares y fijar las dimensiones actuales, las fachadas levantadas —pertenecientes a edificios de la Barcelona antigua— cerraron el espacio, con la fuente y las tipuanas, y crearon un ambiente nuevo, silencioso, poético, históricamente respetuoso.","drl":"Типуана — дерево родом из Южной Америки, которое было завезено в город в начале XX века. В настоящее время это один из самых распространённых видов в нашем городе. Группа состоит из трёх экземпляров, которые эстетически дополняют красивую площадь Сант-Фелип-Нери. Взрывная волна авиабомбы разрушила во время Гражданской войны три дома на площадке, тогда гораздо меньшей. После расчистки завалов были посажены типуаны. После того как участки были застроены заново и закреплены нынешние размеры, возведённые фасады — принадлежащие зданиям старой Барселоны — замкнули пространство с фонтаном и типуанами и создали новую атмосферу — тихую, поэтичную, исторически бережную.","drh":"Типуана — южноамериканское дерево с перистыми листьями и жёлтыми цветами. Хорошо переносит городские условия.","cn":"0021-01-93","cy":"1993","by":"1933","cd":"25 m","tp":"2,75 m","ow":"Públic"},{"n":"Til·lers de la Rambla Catalunya","ne":"","sr":"Липа","r":"липа","nru":"Липа бульвара Catalunya","s":"Tilia tomentosa / Tilia × europaea / Tilia × euchlora","la":41.3917792573342,"ln":2.1628245328746463,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/2016%2C10%2C20085207%2C0105-02-96_1-760x428.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tillers-de-la-rambla-catalunya-99400454942","d":"Eixample","h":"la Dreta de l'Eixample","a":"Rambla de Catalunya 70","dr":"Estos árboles quizás son, junto con los plátanos de la Rambla, el conjunto de arbolado de alineación más interesante de la ciudad. Está formado por 322 árboles que se sitúan a lo largo de toda la rambla de Catalunya y pertenecen principalmente a tres especies de tilo: el tilo común (Tilia × europaea), el tilo de Crimea (Tilia × euchlora) y el tilo plateado (Tilia tomentosa). Cada primavera su brote y floración se convierte casi en un acontecimiento ciudadano.","drl":"Эти деревья, пожалуй, наряду с платанами Рамблы, — самая интересная группа аллейных деревьев города. Она состоит из 322 деревьев, расположенных вдоль всей рамблы Каталунья, и принадлежит в основном к трём видам липы: липе европейской (Tilia × europaea), липе крымской (Tilia × euchlora) и липе войлочной (серебристой) (Tilia tomentosa). Каждую весну их распускание и цветение становится почти городским событием.","drh":"Липа — листопадное дерево с сердцевидными листьями и душистыми цветами, которые используют для чая.","cn":"0105-02-96","cy":"1996","by":"","cd":"9 m","tp":"1,1 m","ow":"Públic"},{"n":"Teix de la Facultat de Geografia i Història","ne":"","sr":"Тис ягодный","r":"тис","nru":"Тис ягодный","s":"Taxus baccata","la":41.38378036046165,"ln":2.1675035253708677,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201208530159-01-13-web.optimized.f9aa9043.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/teix-de-la-facultat-de-geografia-i-historia-99400454946","d":"Ciutat Vella","h":"el Raval","a":"Carrer de Montalegre 8","dr":"El tejo, originario de Europa y del oeste de Asia, es uno de los árboles con más simbolismo, posiblemente debido a su gran longevidad. Normalmente solo lo encontramos en los jardines más antiguos. El ejemplar catalogado está situado en un patio interior ajardinado de la Facultad de Geografía e Historia y tiene una altura considerable, en relación con otros ejemplares que también podemos encontrar en Barcelona. Superado en altura por un ejemplar de palmera washingtonia (Washingtonia robusta) que crece a su lado, el tejo se encuentra completamente rodeado de vegetación, entre la que se entrevé su magnífica y definida forma piramidal.","drl":"Тис, родом из Европы и запада Азии, — одно из самых символичных деревьев, возможно, из-за его большой долговечности. Обычно мы встречаем его только в самых старых садах. Внесённый в каталог экземпляр находится во внутреннем озеленённом дворе Факультета географии и истории и имеет значительную высоту по сравнению с другими экземплярами, которые также можно найти в Барселоне. Превзойдённый по высоте экземпляром пальмы вашингтонии (Washingtonia robusta), растущей рядом, тис полностью окружён растительностью, сквозь которую угадывается его великолепная чёткая пирамидальная форма.","drh":"Тис ягодный — медленнорастущее хвойное дерево с ядовитыми семенами в красной оболочке. Очень теневынослив, живёт до 2000 лет.","cn":"0159-01-13","cy":"2013","by":"Per determinar","cd":"8 m","tp":"1,8 m","ow":"Públic"},{"n":"Til·ler argentat del Parc del Laberint","ne":"","sr":"Липа войлочная","r":"липа","nru":"Липа войлочная","s":"Tilia tomentosa","la":41.439472702917854,"ln":2.1473683233213987,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121011570144-07-03_1.optimized.eedcc4fd.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tiller-argentat-del-parc-del-laberint-99400454941","d":"Horta-Guinardó","h":"Horta","a":"Carrer dels Germans Desvalls 40","dr":"El tilo plateado es un árbol de porte cónico muy utilizado en jardinería, originario de los bosques del este de Europa. Este tilo, de hojas con el reverso plateado, está, junto con otras especies de gran valor, en el jardín doméstico del parque del Laberinto. El ejemplar está rodeado de arbustos recortados con formas figurativas y de cajas de madera para que los pájaros puedan hacer su nido. El jardín doméstico es la parte del parque del Laberinto que los antiguos inquilinos utilizaban propiamente como jardín de uso cotidiano.","drl":"Липа серебристая — дерево конической формы, широко используемое в садоводстве, родом из лесов востока Европы. Эта липа, с листьями с серебристой изнанкой, находится вместе с другими очень ценными видами в домашнем саду парка Лабиринт. Экземпляр окружён кустарниками, подстриженными в фигурные формы, и деревянными домиками, чтобы птицы могли вить гнёзда. Домашний сад — это та часть парка Лабиринт, которую прежние обитатели использовали собственно как сад повседневного пользования.","drh":"Липа войлочная — листопадное дерево с сердцевидными листьями и душистыми цветами. Отличный медонос.","cn":"0144-07-03","cy":"2003","by":"1910","cd":"26 m","tp":"3,2 m","ow":"Públic"},{"n":"Surera del Parc de Monterols","ne":"","sr":"Дуб пробковый","r":"дуб","nru":"Дуб пробковый парка Monterols","s":"Quercus suber","la":41.402616485301614,"ln":2.141237039248148,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061120320044-05-93_2.optimized.a17664ec.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/surera-del-parc-de-monterols-99400454949","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Carrer de Ferran Valls i Taberner 5","dr":"El alcornoque es una especie propia de los bosques mediterráneos y está adaptada a los terrenos silícicos. En nuestra ciudad es rara, dado que la mayoría de suelos son sobre todo calcáreos. En el parque de Monterols, la disponibilidad de espacio y la escasa competitividad con otros congéneres, que sería lo habitual si viviera en el bosque, le han permitido desarrollar abiertamente la copa y adquirir un porte estético y armonioso. Es el ejemplar de alcornoque más notable de los espacios públicos urbanos.","drl":"Пробковый дуб — вид, свойственный средиземноморским лесам и приспособленный к силикатным почвам. В нашем городе он встречается редко, поскольку большинство почв преимущественно известняковые. В парке Монтеролс наличие пространства и слабая конкуренция с другими представителями того же рода, которая была бы обычной, если бы он рос в лесу, позволили ему свободно развить крону и обрести эстетичную и гармоничную стать. Это самый примечательный экземпляр пробкового дуба в городских общественных пространствах.","drh":"Дуб пробковый — вечнозелёное дерево с толстой пробковой корой. Из коры получают пробку. Редкий гость в городах.","cn":"0044-05-93","cy":"1993","by":"1923","cd":"13 m","tp":"1,8 m","ow":"Públic"},{"n":"Sequoia del parc del Laberint d'Horta","ne":"","sr":"Секвойя вечнозелёная","r":"секвойя","nru":"Секвойя вечнозелёная парка Laberint d'Horta","s":"Sequoia sempervirens","la":41.43983375703846,"ln":2.1459104926112826,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121210440016-07-93_1.optimized.fb6980c7.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/sequoia-del-parc-del-laberint-d-horta-99400454951","d":"Horta-Guinardó","h":"Horta","a":"Carrer dels Germans Desvalls 48","dr":"Este bello ejemplar es el único representante en los parques y jardines públicos de la ciudad de los míticos bosques de secuoyas, unos árboles gigantescos, milenarios, localizados en las montañas del estado de California y auténticas reliquias biológicas de un pasado esplendoroso; hace millones de años, bosques de secuoyas cubrían buena parte de las tierras emergidas, desde Asia hasta América.","drl":"Этот прекрасный экземпляр — единственный в парках и общественных садах города представитель мифических секвойевых лесов — гигантских тысячелетних деревьев, произрастающих в горах штата Калифорния и являющихся подлинными биологическими реликтами великолепного прошлого; миллионы лет назад секвойевые леса покрывали значительную часть суши, от Азии до Америки.","drh":"Секвойя вечнозелёная — гигантское хвойное дерево из Калифорнии. Одно из самых высоких деревьев мира (до 115 м).","cn":"0016-07-93","cy":"1993","by":"1923","cd":"6 m","tp":"2,4 m","ow":"Públic"},{"n":"Roure blanc mexicà de la Ciutadella","ne":"","sr":"Дуб мексиканский","r":"дуб","nru":"Дуб мексиканский","s":"Quercus polymorpha","la":41.38889203103123,"ln":2.18641992248632,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201310240130-01-97_1.optimized.62471630.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-blanc-mexica-de-la-ciutadella-99400454956","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Passeig de Pujades 16","dr":"El encino roble es un árbol originario de Norteamérica y, a diferencia de la mayoría de robles, no tiene hojas lobuladas. El árbol se integra en el parque de la Ciutadella, entre la cascada y el estanque, y es el único ejemplar de esta especie que hay en Barcelona.","drl":"Мексиканский белый дуб — дерево родом из Северной Америки, которое, в отличие от большинства дубов, не имеет лопастных листьев. Дерево вписано в парк Сьютаделья, между водопадом и прудом, и является единственным экземпляром этого вида в Барселоне.","drh":"Дуб многообразный — мексиканский вид с кожистыми листьями без лопастей. Редкое дерево для Европы.","cn":"0130-01-97","cy":"1997","by":"1887","cd":"11 m","tp":"2,5 m","ow":"Públic"},{"n":"Lledoner de la plaça Sagrada Família","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный площади Sagrada Família","s":"Celtis australis","la":41.403034494523205,"ln":2.1728040212853585,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141114240057-02-94_1.optimized.72d04a90.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-de-la-placa-sagrada-familia-99400455067","d":"Eixample","h":"la Sagrada Família","a":"Plaça de la Sagrada Família 9999","dr":"El almez es un árbol originario del este de la región mediterránea, totalmente naturalizado en nuestro país. Es una de las especies más utilizadas en las calles de la ciudad. Este ejemplar, de los más desarrollados que podemos encontrar, está en la plaza de la Sagrada Família.","drl":"Каркас — дерево родом с востока Средиземноморского региона, полностью натурализовавшееся в нашей стране. Это один из самых используемых видов на улицах города. Этот экземпляр, один из наиболее развитых, какие мы можем найти, находится на площади Саграда-Фамилия.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0057-02-94","cy":"1994","by":"1914","cd":"20 m","tp":"2,5 m","ow":"Públic"},{"n":"Livistona de la plaça Major de Nou Barris","ne":"","sr":"Ливистона южная","r":"ливистона","nru":"Ливистона южная площади Major de Nou Barris","s":"Livistona australis","la":41.43689947837817,"ln":2.170901990829298,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121312070088-08-94_1.optimized.d2db2627.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/livistona-de-la-placa-major-de-nou-barris-99400455069","d":"Nou Barris","h":"la Guineueta","a":"Carrer del Doctor Pi i Molist 131","dr":"La livistona de Australia es una palmera esbelta que puede llegar a hacer 25 m de altura y que es originaria de Australia. El ejemplar catalogado está en un alcorque, junto a otras palmeras, en la plaza Major de Nou Barris.","drl":"Австралийская ливистона — стройная пальма, которая может достигать 25 м в высоту и происходит из Австралии. Внесённый в каталог экземпляр находится в приствольной лунке, рядом с другими пальмами, на площади Майор в Ноу-Баррис.","drh":"Ливистона южная — стройная пальма с веерными листьями из Австралии. Вырастает до 25 м.","cn":"0088-08-94","cy":"1994","by":"1924","cd":"5 m","tp":"1 m","ow":"Públic"},{"n":"Livistones xineses de l'Ateneu Barcelonès","ne":"","sr":"Ливистона китайская","r":"ливистона","nru":"Ливистона китайская","s":"Livistona chinensis","la":41.38432950918561,"ln":2.1717120383130037,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201232530031-01-93_1.optimized.cdd93efb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/livistones-xineses-de-l-ateneu-barcelones-99400455070","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Pl Vila de Madrid 11","dr":"La livistona de Australia es una palmera esbelta que puede llegar a hacer 25 m de altura y que es originaria de Australia. Este ejemplar se integra perfectamente en el patio del Palacio Savassona, declarado bien cultural de interés nacional. Desde principios del siglo XX es la sede del Ateneo Barcelonés.","drl":"Австралийская ливистона — стройная пальма, которая может достигать 25 м в высоту и происходит из Австралии. Этот экземпляр прекрасно вписывается во двор дворца Савассона, объявленного культурным достоянием национального значения. С начала XX века здесь находится Барселонский атеней.","drh":"Ливистона китайская — декоративная веерная пальма из Восточной Азии. Популярна в парках.","cn":"0031-01-93","cy":"1993","by":"1893","cd":"5 m","tp":"0,8 m","ow":"Privat"},{"n":"Ginkgo dels jardins de Mossèn Cinto Verdaguer","ne":"","sr":"Гинкго двулопастный","r":"Гинкго билоба","nru":"Гинкго двулопастный садов Mossèn Cinto Verdaguer","s":"Ginkgo biloba","la":41.36737567161141,"ln":2.1645732318729913,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061326180139-03-98_1.optimized.69a9fd26.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ginkgo-dels-jardins-de-mossen-cinto-verdaguer-99400455074","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer del Doctor Font i Quer 17","dr":"El ginkgo, procedente de China, se puede considerar un fósil viviente, ya que evolutivamente es la especie más antigua de las que hay actualmente. El ejemplar catalogado está justo en medio de los jardines de Mossèn Cinto Verdaguer, junto a la escalinata de los estanques con plantas acuáticas.","drl":"Гинкго, происходящее из Китая, можно считать живым ископаемым, поскольку в эволюционном плане это самый древний из ныне существующих видов. Внесённый в каталог экземпляр находится прямо посреди садов Мосен-Синто-Вердагер, рядом с лестницей прудов с водными растениями.","drh":"Гинкго двулопастный — реликтовое дерево, сохранившееся со времён динозавров. Единственный живой представитель отдела гинкговых. Листья веерные, осенью ярко-жёлтые.","cn":"0139-03-98","cy":"1998","by":"1958","cd":"16 m","tp":"1,4 m","ow":"Públic"},{"n":"Ginjoler dels jardins Joan Maragall","ne":"","sr":"Зизифус (унаби)","r":"зизифус (унаби)","nru":"Зизифус (унаби) садов Joan Maragall","s":"Ziziphus jujuba","la":41.36755451001938,"ln":2.1564050575999736,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061346570138-03-98_1.optimized.4a70b0da.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ginjoler-dels-jardins-joan-maragall-99400455075","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passeig de Santa Madrona 7","dr":"El azufaifo es un árbol de cultivo agrícola antiquísimo originario del sur y el este de Asia, aunque también lo conocían y cultivaban los griegos, los romanos y los árabes, los cuales presumiblemente lo introdujeron en la península Ibérica. Se cultivaba por motivos frutícolas, pero también se valora la calidad de su madera, que tiene diferentes utilidades (por ejemplo, en Catalunya se utiliza para hacer instrumentos musicales como las gralles y las tenores). El fruto, que se come fresco o seco, dio pie a un conocido dicho catalán: “Més content que un gínjol“ (Más contento que una azufaifa). El ejemplar se integra en los jardines históricos de Joan Maragall, hecho que incrementa su valor que ya posee por sí solo.","drl":"Зизифус (унаби) — древнейшая сельскохозяйственная культура, родом с юга и востока Азии, хотя его знали и возделывали также греки, римляне и арабы, которые, предположительно, и ввели его на Пиренейском полуострове. Его выращивали ради плодов, но ценится и качество его древесины, которая находит разное применение (например, в Каталонии из неё делают музыкальные инструменты — гралья и тенора). Плод, который едят свежим или сушёным, породил известную каталонскую поговорку: «Més content que un gínjol» («Радостнее, чем зизифус»). Экземпляр вписан в исторические сады Жоана Мараля, что повышает его собственную ценность, которой он и сам по себе обладает.","drh":"Зизифус (унаби) — небольшое листопадное дерево с колючими ветвями и сладкими плодами. Культивируется тысячи лет в Азии.","cn":"0138-03-98","cy":"1998","by":"1958","cd":"12 m","tp":"1,6 m","ow":"Públic"},{"n":"Alzina dels jardins de Bacardí","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный садов Bacardí","s":"Quercus ilex","la":41.38017449202703,"ln":2.125790066231714,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610161509180063-04-94_11.optimized.746606c6.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzina-dels-jardins-de-bacardi-99400455080","d":"Les Corts","h":"la Maternitat i Sant Ramon","a":"Travessera de les Corts 118","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Este ejemplar está en los jardines de Bacardí y su presencia data de antes de la última remodelación del espacio. Presenta un desarrollo notable, con la copa muy abierta y una altura considerable.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсерольы. Этот экземпляр находится в садах Бакарди, и его присутствие предшествует последней реконструкции пространства. Он значительно развит, с очень раскидистой кроной и немалой высотой.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0063-04-94","cy":"1994","by":"1904","cd":"14 m","tp":"2,1 m","ow":"Públic"},{"n":"Figuera de la Facultat de Dret","ne":"","sr":"Инжир","r":"фикус","nru":"Инжир","s":"Ficus carica","la":41.38738248662207,"ln":2.1207530565509862,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251018300128-04-97_1.optimized.a63108ce.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/figuera-de-la-facultat-de-dret-99400455011","d":"Les Corts","h":"Pedralbes","a":"Avinguda Diagonal 684","dr":"La higuera es uno de los árboles frutales con más tradición de toda la región mediterránea, cultivado desde hace miles de años. Esta higuera, de una especie típicamente mediterránea, se ha mantenido impasible a los numerosos cambios que se han producido a su alrededor. Originaria de una finca privada, la higuera se mantuvo cuando el lugar se convirtió primero en un cabaré y, más adelante, en la Universidad de Derecho.","drl":"Инжир — одно из плодовых деревьев с наибольшей традицией во всём Средиземноморском регионе, возделываемое тысячи лет. Этот инжир, вида, типично средиземноморского, остался невозмутим перед многочисленными переменами, происходившими вокруг него. Родом из частного владения, инжир сохранился, когда это место превратилось сначала в кабаре, а позднее в юридический факультет университета.","drh":"Инжир — листопадное дерево с пальчатыми листьями и сладкими плодами. Одно из древнейших культурных растений Средиземноморья.","cn":"0128-04-97","cy":"1997","by":"1897","cd":"11 m","tp":"2,9 m","ow":"Privat"},{"n":"Ficus de Port Jackson de l'Escola Saint Nicholas","ne":"","sr":"Фикус ржавый","r":"фикус","nru":"Фикус ржавый","s":"Ficus rubiginosa","la":41.39671349795668,"ln":2.1632390295706805,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200846260062-02-94_1.optimized.17dcc66f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ficus-de-port-jackson-de-l-escola-saint-nicholas-99400455013","d":"Eixample","h":"la Dreta de l'Eixample","a":"Carrer de Provença 283","dr":"Este ficus es originario del este de Australia y, de la misma forma que otras especies del mismo género, como el árbol del caucho, llega a alcanzar grandes dimensiones, ayudado por la emisión de raíces aéreas. Este ejemplar está en el patio de la Escuela la Mercè, y es visible desde los jardines de Laura Albéniz.","drl":"Этот фикус родом с востока Австралии и, подобно другим видам того же рода, например каучуковому дереву, достигает больших размеров благодаря воздушным корням. Этот экземпляр находится во дворе школы Ла-Мерсе и виден из садов Лауры Альбенис.","drh":"Фикус ржавый — крупное дерево из Австралии с мощной кроной и опушёнными снизу листьями. Используется как тенистое дерево в парках.","cn":"0062-02-94","cy":"1994","by":"1904","cd":"18 m","tp":"5 m","ow":"Privat"},{"n":"Olivera del Park Güell","ne":"","sr":"Маслина европейская","r":"олива (маслина)","nru":"Маслина европейская","s":"Olea europaea","la":41.414909482940786,"ln":2.1549060163907834,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031301380117-06-96_1.optimized.ebb2e361.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/olivera-del-park-guell-99400454989","d":"Gràcia","h":"la Salut","a":"Carretera del Carmel 19","dr":"El olivo es un árbol originario de Asia Menor que se cultiva desde la antigüedad en toda la región mediterránea. Este ejemplar está en el sector este del Park Güell, y destaca —cosa poco frecuente— por la altura de su copa.","drl":"Олива — дерево родом из Малой Азии, которое с древности возделывается по всему Средиземноморскому региону. Этот экземпляр находится в восточном секторе парка Гуэль и выделяется — что нечасто встречается — высотой своей кроны.","drh":"Маслина европейская — вечнозелёное дерево с серебристо-зелёными листьями. Символ Средиземноморья, источник оливкового масла.","cn":"0117-06-96","cy":"1996","by":"1771","cd":"21 m","tp":"2,9 m","ow":"Públic"},{"n":"Datiler del carrer Olesa","ne":"","sr":"Финик пальчатый","r":"финиковая пальма","nru":"Финик пальчатый улицы Olesa","s":"Phoenix dactylifera","la":41.42473748993362,"ln":2.186030000861495,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610110929210038-09-93_1.optimized.24d92553.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/datiler-del-carrer-olesa-99400455022","d":"Sant Andreu","h":"la Sagrera","a":"Carrer d'Olesa 71","dr":"La palmera datilera está muy extendida por toda la región mediterránea e históricamente se cultivaba por sus frutos, los dátiles. En Barcelona es, junto con la washingtonia de México, la palmera más común. Este ejemplar es de los más altos de la ciudad y se encuentra en un alcorque viario, en la calle de Olesa.","drl":"Финиковая пальма широко распространена по всему Средиземноморскому региону и исторически возделывалась ради своих плодов — фиников. В Барселоне она вместе с мексиканской вашингтонией — самая распространённая пальма. Этот экземпляр — один из самых высоких в городе и находится в уличной приствольной лунке на улице Олеса.","drh":"Финиковая пальма — высокая пальма с перистыми листьями. Культивируется в Средиземноморье тысячи лет ради съедобных плодов — фиников.","cn":"0038-09-93","cy":"1993","by":"1903","cd":"6 m","tp":"1,3 m","ow":"Públic"},{"n":"Xiprer quadrivalve dels jardins del Palau de Pedralbes","ne":"","sr":"Тетраклинис членистый","r":"Tetraclinis","nru":"Тетраклинис членистый","s":"Tetraclinis articulata","la":41.38696748025517,"ln":2.1182930640459015,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270856000047-04-93_1.optimized.43ee680b.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xiprer-quadrivalve-dels-jardins-del-palau-de-pedralbes-99400454990","d":"Les Corts","h":"Pedralbes","a":"Avinguda Diagonal 686","dr":"Se descubrieron unos cuantos ejemplares de ciprés de Cartagena cerca de Cartagena (Murcia), la única localidad donde esta especie vive en estado silvestre. De lo contrario, hay que ir a la isla de Malta o a algunos países norteafricanos. Sorprendentemente, en los jardines del palacio de Pedralbes aparece con un desarrollo inusual, plantado dentro del marco vegetal que alrededor de un surtidor dibujan cedros y cipreses adultos. ¿Fue plantado durante la época de construcción del jardín, hacia el año 1925, o existía antes que la finca? Es un ejemplar singular y único.","drl":"Несколько экземпляров картахенского кипариса были обнаружены близ Картахены (Мурсия) — единственной местности, где этот вид живёт в дикой природе. В остальных случаях его нужно искать на острове Мальта или в некоторых североафриканских странах. Удивительно, но в садах дворца Педральбес он предстаёт с необычным развитием, посаженный в рамке растительности, которую вокруг фонтана образуют взрослые кедры и кипарисы. Был ли он посажен в период создания сада, около 1925 года, или существовал ещё до имения? Это особенный и уникальный экземпляр.","drh":"Тетраклинис членистый — редкое хвойное дерево, растущее в Северной Африке и на Мальте. Один из немногих выживших представителей древней флоры.","cn":"0047-04-93","cy":"1993","by":"1923","cd":"10 m","tp":"1,2 m","ow":"Públic"},{"n":"Cedre del Parc del Laberint","ne":"","sr":"Кедр гималайский","r":"Cedrus","nru":"Кедр гималайский парка Laberint","s":"Cedrus deodara","la":41.439583610073285,"ln":2.147243224074932,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121136540143-07-03_1.optimized.9f800703.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cedre-del-parc-del-laberint-99400455028","d":"Horta-Guinardó","h":"Horta","a":"Carrer dels Germans Desvalls 42","dr":"El cedro del Himalaya es una especie de conífera originaria del oeste del Himalaya que puede llegar a los 50 m de altura. Situado en el jardín doméstico del parque del Laberinto, a este viejo cedro se le rompió la guía de crecimiento durante una tormenta de viento y lluvia. Sin embargo, su presencia imponente, combinada con los elementos evocadores y al mismo tiempo refinados del entorno, nos ofrece unas sensaciones estéticas magníficas.","drl":"Гималайский кедр — вид хвойных, родом с запада Гималаев, который может достигать 50 м в высоту. Расположенному в домашнем саду парка Лабиринт старому кедру во время бури с ветром и дождём сломало верхушку роста. Тем не менее его величественное присутствие в сочетании с вызывающими воспоминания и в то же время изысканными элементами окружения дарит нам великолепные эстетические ощущения.","drh":"Кедр гималайский — величественное хвойное дерево высотой до 50 м с поникающими ветвями. Происходит из западных Гималаев.","cn":"0143-07-03","cy":"2003","by":"1910","cd":"24 m","tp":"3,3 m","ow":"Públic"},{"n":"Pi pinyer del carrer Natzaret","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.4229794729798,"ln":2.139148022855575,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121018280121-07-96_1.optimized.203213d4.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-del-carrer-natzaret-99400454996","d":"Horta-Guinardó","h":"Sant Genís dels Agudells","a":"Carrer de Natzaret 16","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Situado en la puerta superior del patio del Patronato Ribas, este pino originariamente debió formar parte de la vegetación de la sierra de Collserola. Actualmente el pino ha quedado rodeado por el nuevo edificio de un geriátrico que se ha construido, pero se puede ver perfectamente desde la calle de Natzaret.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Расположенная у верхних ворот двора Патроната Рибас, эта сосна первоначально, вероятно, входила в растительность гор Кольсерола. В настоящее время сосна оказалась окружена новым зданием построенного дома престарелых, но её отлично видно с улицы Назарет.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0121-07-96","cy":"1996","by":"1886","cd":"17 m","tp":"2,5 m","ow":"Privat"},{"n":"Castanyer bord de la plaça Carles Buïgas","ne":"","sr":"Конский каштан","r":"Aesculus","nru":"Конский каштан","s":"Aesculus hippocastanum","la":41.37163050225573,"ln":2.1537120581704716,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270951280131-03-97_2.optimized.72e281ad.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/castanyer-bord-de-la-placa-carles-buigas-99400455030","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Plaça de Carles Buïgas 8","dr":"El castaño de indias es originario del este de Europa y, a pesar de ser un árbol ampliamente difundido en ámbitos urbanos, está adaptado a ambientes más fríos, propios de latitudes más septentrionales. Este ejemplar, solitario, está en la plaza de Carles Buïgas y destaca por sus dimensiones.","drl":"Конский каштан родом из востока Европы и, несмотря на то что это широко распространённое в городской среде дерево, приспособлен к более холодным условиям, свойственным более северным широтам. Этот одиночный экземпляр находится на площади Карлеса Буйгаса и выделяется своими размерами.","drh":"Конский каштан обыкновенный — крупное листопадное дерево с пальчатыми листьями и характерными плодами-каштанами.","cn":"0131-03-97","cy":"1997","by":"1937","cd":"14 m","tp":"1,9 m","ow":"Públic"},{"n":"Carpí del jardí Botànic Històric","ne":"","sr":"Граб обыкновенный","r":"Carpinus","nru":"Граб обыкновенный сада Botànic Històric","s":"Carpinus betulus","la":41.36701450208454,"ln":2.1519820602595434,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061051560054-03-94_1.optimized.0b9ce632.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/carpi-del-jardi-botanic-historic-99400455031","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda de l'Estadi 37","dr":"El carpe blanco es un árbol caducifolio originario de gran parte de Europa, excepto de la península Ibérica. Adaptado a condiciones climáticas más frías, es una especie difícil de encontrar en nuestra ciudad. En el Jardín Botánico Histórico, donde se ubica, encuentra un microclima muy adecuado para vivir.","drl":"Граб — листопадное дерево, родом из большей части Европы, кроме Пиренейского полуострова. Приспособленный к более холодным климатическим условиям, это вид, который трудно встретить в нашем городе. В Историческом ботаническом саду, где он находится, он обретает очень подходящий для жизни микроклимат.","drh":"Граб обыкновенный — листопадное дерево из Европы. Редкость в Барселоне из-за тёплого климата.","cn":"0054-03-94","cy":"1994","by":"1924","cd":"13 m","tp":"1,2 m","ow":"Privat"},{"n":"Araucaria del Teatre Grec","ne":"","sr":"Араукария Бидвилла","r":"араукария","nru":"Араукария Бидвилла театра Grec","s":"Araucaria bidwillii","la":41.37037850737781,"ln":2.1592000504356483,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270914360154-03-11_1.optimized.8c473c2f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-del-teatre-grec-99400455033","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passatge de Martras 20","dr":"El roble sedoso es un árbol perennifolio, de copa redondeada, originario del este de Australia. El ejemplar catalogado destaca como árbol de grandes dimensiones integrado en los jardines de los Drets Humans.","drl":"Шёлковый дуб — вечнозелёное дерево с округлой кроной, родом с востока Австралии. Внесённый в каталог экземпляр выделяется как дерево крупных размеров, вписанное в сады Прав человека.","drh":"Араукария Бидвилла — австралийское хвойное дерево с крупными шишками до 10 кг. Съедобные семена — важная пища аборигенов.","cn":"0153-03-11","cy":"2011","by":"1920","cd":"9 m","tp":"1,4 m","ow":"Públic"},{"n":"Arboç del parc del Laberint d'Horta","ne":"","sr":"Земляничник обыкновенный","r":"земляничное дерево","nru":"Земляничник обыкновенный парка Laberint d'Horta","s":"Arbutus unedo","la":41.44016194340173,"ln":2.1463648994132387,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610120942000017-07-93_1.optimized.0fb6c5f9.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arboc-del-parc-del-laberint-d-horta-99400455043","d":"Horta-Guinardó","h":"Horta","a":"Carrer dels Germans Desvalls 48","dr":"El madroño es un arbolito autóctono que forma parte de los bosques mediterráneos. Sin embargo, la mayoría de ejemplares tienen forma arbustiva. El ejemplar del Laberinto, a la sombra del monumental paseo de las encinas, da fe de su comportamiento natural y al mismo tiempo es testimonio de la belleza virtual de nuestras plantas silvestres.","drl":"Земляничное дерево — небольшое местное деревце, входящее в состав средиземноморских лесов. Однако большинство экземпляров имеют кустарниковую форму. Экземпляр в Лабиринте, в тени монументальной аллеи каменных дубов, свидетельствует о его естественном поведении и вместе с тем является доказательством виртуальной красоты наших диких растений.","drh":"Земляничник обыкновенный — вечнозелёное дерево с красной шероховатой корой и плодами, похожими на землянику. Растёт в Средиземноморье.","cn":"0017-07-93","cy":"1993","by":"1913","cd":"7 m","tp":"1,1 m","ow":"Públic"},{"n":"Alzina del carrer Baladre","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный улицы Baladre","s":"Quercus ilex","la":41.42675445144899,"ln":2.0930380372459965,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061028220137-05-98-10-11a.optimized.4ae78223.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzina-del-carrer-baladre-99400455044","d":"Sarrià-Sant Gervasi","h":"Vallvidrera, el Tibidabo i les Planes","a":"Carrer del Baladre 8","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Este ejemplar, de grandes dimensiones, está en el jardín de una propiedad privada.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсерольы. Этот экземпляр больших размеров находится в саду частной собственности.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0137-05-98","cy":"1993","by":"1938","cd":"8 m","tp":"2,2 m","ow":"Privat"},{"n":"Alzines de la plaça Catalunya","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный площади Catalunya","s":"Quercus ilex","la":41.38722350747458,"ln":2.1705320384791342,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201302260095-01-94_1.optimized.a3c0cdaa.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzines-de-la-placa-catalunya-99400455045","d":"Eixample","h":"la Dreta de l'Eixample","a":"Plaça de Catalunya 14","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Una cuarentena de ejemplares de encina enmarcan circularmente la plaza de Catalunya. Esta arboleda, de aproximadamente 90 años, está muy bien integrada en la imagen de la plaza y configura un contraste paisajístico de gran calidad gracias al desarrollo armónico de los árboles, de copa muy espesa y siempre verde.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсерольы. Около сорока экземпляров каменного дуба обрамляют по кругу площадь Каталунья. Эта роща возрастом примерно 90 лет очень хорошо вписана в облик площади и создаёт ландшафтный контраст высокого качества благодаря гармоничному развитию деревьев с очень густой и всегда зелёной кроной.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0095-01-94","cy":"1994","by":"1904","cd":"16 m","tp":"2,3 m","ow":"Públic"},{"n":"Datiler del carrer Lancaster","ne":"","sr":"Финик пальчатый","r":"финиковая пальма","nru":"Финик пальчатый улицы Lancaster","s":"Phoenix dactylifera","la":41.37845611760477,"ln":2.17428805091062,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610250952570101-01-96-19-1-10.optimized.92dd1986.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/datiler-del-carrer-lancaster-99400455051","d":"Ciutat Vella","h":"el Raval","a":"Carrer de Lancaster 8","dr":"La palmera datilera está muy extendida por toda la región mediterránea e históricamente se cultivaba por sus frutos, los dátiles. Este ejemplar tiene la particularidad de estar ubicado en un patio privado en pleno barrio del Raval de la ciudad, donde antiguamente había una lechería. Esta palmera, que presenta unas dimensiones considerables (15 m de altura), es testimonio de la historia del barrio y se erige solitaria en medio de un mar de casas.","drl":"Финиковая пальма широко распространена по всему Средиземноморскому региону и исторически возделывалась ради своих плодов — фиников. Особенность этого экземпляра в том, что он находится в частном дворе в самом сердце района Раваль в городе, где в прежние времена была молочная ферма. Эта пальма, имеющая значительные размеры (15 м высоты), — свидетель истории района и возвышается в одиночестве посреди моря домов.","drh":"Финиковая пальма — высокая пальма с перистыми листьями. Культивируется в Средиземноморье тысячи лет ради съедобных плодов — фиников.","cn":"0101-01-96","cy":"1996","by":"1896","cd":"7","tp":"1,2","ow":"Privat"},{"n":"Palmeres canàries de l'Hospital de Sant Pau","ne":"","sr":"Финик канарский","r":"финиковая пальма","nru":"Финик канарский","s":"Phoenix canariensis","la":41.41241606808175,"ln":2.1757527938497985,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111309230161-07-13_2.optimized.7ab1c611.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmeres-canaries-de-l-hospital-de-sant-pau-99400455053","d":"Horta-Guinardó","h":"el Guinardó","a":"Carrer de Sant Antoni Maria Claret 167","dr":"La palmera canaria es una especie de palmera autóctona de las islas Canarias, muy utilizada en jardinería por su belleza y facilidad de adaptación. Justo en la entrada del recinto modernista del Hospital de Sant Pau encontramos dos ejemplares magníficos, que destacan por lo bien integrados que están con la arquitectura. Actualmente, y a pesar de los esfuerzos realizados para salvarla, una de ellas está muy dañada debido a la plaga del gorgojo de las palmeras (plaga de escarabajos que afecta gravemente a las palmeras).","drl":"Канарская пальма — вид пальмы, местный для Канарских островов, широко используемый в садоводстве из-за красоты и лёгкости приспособления. Прямо у входа на территорию модернистского комплекса больницы Сант-Пау мы находим два великолепных экземпляра, которые выделяются тем, насколько хорошо они сочетаются с архитектурой. В настоящее время, несмотря на предпринятые усилия по её спасению, одна из них сильно повреждена из-за вредителя — пальмового долгоносика (вредителя-жука, наносящего серьёзный ущерб пальмам).","drh":"Финик канарский — мощная пальма родом с Канарских островов. Широко используется для озеленения улиц и парков.","cn":"0161-07-13","cy":"2013","by":"Per determinar","cd":"8 m","tp":"2,4 m","ow":"Públic"},{"n":"Palmera canària de la Rambla Guipúscoa","ne":"","sr":"Финик канарский","r":"финиковая пальма","nru":"Финик канарский","s":"Phoenix canariensis","la":41.41492450000249,"ln":2.1948112237018735,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111250520092-10-94_1.optimized.96a27d93.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmera-canaria-de-la-rambla-guipuscoa-99400455054","d":"Sant Martí","h":"Sant Martí de Provençals","a":"Rambla de Guipúscoa 29","dr":"La palmera canaria es una especie de palmera autóctona de las islas Canarias, muy utilizada en jardinería por su belleza y facilidad de adaptación. El ejemplar catalogado está en un alcorque viario, cerca de los edificios que lo rodean, recto y bien dibujado. Se tiene una buena perspectiva de esta palmera desde el puente de Bac de Roda.","drl":"Канарская пальма — вид пальмы, местный для Канарских островов, широко используемый в садоводстве из-за красоты и лёгкости приспособления. Внесённый в каталог экземпляр находится в уличной приствольной лунке, вблизи окружающих его зданий, прямой и чётко очерченный. Хорошая перспектива на эту пальму открывается с моста Бак-де-Рода.","drh":"Финик канарский — мощная пальма родом с Канарских островов. Широко используется для озеленения улиц и парков.","cn":"0092-10-94","cy":"1994","by":"1904","cd":"9 m","tp":"2,6 m","ow":"Públic"},{"n":"Magnòlia del Col·legi La Salle Bonanova","ne":"","sr":"Магнолия крупноцветковая","r":"магнолия","nru":"Магнолия крупноцветковая колледжа La Salle Bonanova","s":"Magnolia grandiflora","la":41.406678474018406,"ln":2.1311140407513527,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061049480116-05-96_1.optimized.b62e2999.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/magnolia-del-collegi-la-salle-bonanova-99400455058","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Plaça de la Bonanova 13","dr":"La magnolia es un árbol perennifolio de grandes dimensiones originario del sureste de los Estados Unidos. Este ejemplar majestuoso se ubica en el interior del Colegio la Salle Bonanova. Lo encontramos como elemento aislado en el aparcamiento que hay delante del edificio de la escuela.","drl":"Магнолия — вечнозелёное дерево больших размеров, родом с юго-востока Соединённых Штатов. Этот величественный экземпляр расположен внутри колледжа Ла-Саль Бонанова. Мы видим его как обособленный элемент на парковке перед зданием школы.","drh":"Магнолия крупноцветковая — вечнозелёное дерево с кожистыми листьями и огромными ароматными кремовыми цветами. Один из древнейших родов цветковых растений.","cn":"0116-05-96","cy":"1996","by":"Per determinar","cd":"16 m","tp":"3,5 m","ow":"Privat"},{"n":"Roures martinencs de l'Avinguda Diagonal","ne":"","sr":"Дуб пушистый","r":"дуб","nru":"Дуб пушистый","s":"Quercus pubescens","la":41.38452147974752,"ln":2.1105580669920783,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061319160112-04-96_1.optimized.7a6afb20.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roures-martinencs-de-l-avinguda-diagonal-99400454960","d":"Les Corts","h":"Pedralbes","a":"Av Diagonal 698","dr":"El roble pubescente es una especie propia de los bosques submediterráneos. En las partes más sombrías de Collserola encontramos alguna población. El ejemplar catalogado está en el patio de la Escuela Lexia y tiene una copa inmensa que ocupa la mayor parte del espacio de la escuela. El tamaño de la copa es impresionante.","drl":"Пушистый дуб — вид, свойственный субсредиземноморским лесам. В самых тенистых частях Кольсеролы мы встречаем некоторые его популяции. Внесённый в каталог экземпляр находится во дворе школы Лексия и имеет огромную крону, занимающую большую часть пространства школы. Размер кроны впечатляет.","drh":"Дуб пушистый — листопадное дерево из субсредиземноморских лесов. Молодые листья и побеги покрыты мягким пушком.","cn":"0112-04-96","cy":"1996","by":"1946","cd":"10 m","tp":"2,6 m","ow":"Públic"},{"n":"Washingtònies de la carretera de Miramar","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая шоссе Miramar","s":"Washingtonia robusta","la":41.36879538031188,"ln":2.171302191487664,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200839020108-03-96_1.optimized.a6a87a70.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-carretera-de-miramar-99400454981","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carretera de Miramar 2","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. El conjunto catalogado de palmeras se encuentra plantado en torno a la carretera de Miramar, en el lado oeste de la montaña de Montjuïc. Es una plantación única, realizada a finales de los años sesenta o principios de los setenta, proyectada para integrarse en el paisaje árido de la montaña y de los jardines de Mossèn Costa i Llobera.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Внесённая в каталог группа пальм высажена вокруг дороги Мирамар, на западной стороне горы Монжуик. Это уникальная посадка, выполненная в конце шестидесятых или начале семидесятых годов, спроектированная так, чтобы вписаться в засушливый пейзаж горы и садов Мосена Косты-и-Льоберы.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0108-03-96","cy":"1996","by":"1926","cd":"6 m","tp":"1,9 m","ow":"Públic"},{"n":"Pi blanc dels jardins de Torre Girona","ne":"","sr":"Сосна алеппская","r":"сосна","nru":"Сосна алеппская","s":"Pinus halepensis","la":41.38876148377937,"ln":2.1153380592108704,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251008530064-04-94_1.optimized.ef193ecc.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-blanc-dels-jardins-de-torre-girona-99400455002","d":"Les Corts","h":"Pedralbes","a":"Carrer de Jordi Girona 29","dr":"El pino carrasco es un árbol autóctono presente en toda el área mediterránea. Este ejemplar presenta dos grandes ramas que se abren a 2,50 metros del suelo, y una tercera rama está rota. Está en los jardines del Campus Norte de la Universidad Politécnica, que ha reconvertido el antiguo jardín de la Torre Girona.","drl":"Алеппская сосна — местное дерево, встречающееся по всей средиземноморской зоне. У этого экземпляра две большие ветви, расходящиеся на высоте 2,50 метра от земли, а третья ветвь сломана. Он находится в садах Северного кампуса Политехнического университета, который перестроил старый сад Торре-Герона.","drh":"Сосна алеппская — хвойное дерево, характерное для Средиземноморья. Устойчива к жаре и засухе.","cn":"0064-04-94","cy":"1994","by":"1904","cd":"25 m","tp":"2,9 m","ow":"Privat"},{"n":"Pi de Sant Genís dels Agudells","ne":"","sr":"Сосна алеппская","r":"сосна","nru":"Сосна алеппская","s":"Pinus halepensis","la":41.42768146606366,"ln":2.135867016763427,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121149200125-07-97_1.optimized.784d7104.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-de-sant-genis-dels-agudells-99400455004","d":"Horta-Guinardó","h":"Sant Genís dels Agudells","a":"Carrer de Natzaret 97","dr":"El pino carrasco es un árbol autóctono presente en toda el área mediterránea. El ejemplar forma parte del conjunto historicoartístico del templo de Sant Genís dels Agudells. Su enclave histórico hace que este ejemplar sea un protagonista excepcional de los acontecimientos de la historia de la ciudad en el transcurso de los tiempos.","drl":"Алеппская сосна — местное дерево, встречающееся по всей средиземноморской зоне. Экземпляр входит в историко-художественный ансамбль храма Сант-Женис-дельс-Агуделс. Его историческое расположение делает этот экземпляр исключительным участником событий истории города на протяжении времён.","drh":"Сосна алеппская — хвойное дерево, характерное для Средиземноморья. Устойчива к жаре и засухе.","cn":"0125-07-97","cy":"1997","by":"1877","cd":"17 m","tp":"2,6 m","ow":"Públic"},{"n":"Fotínies del parc de les Aigües del Guinardó","ne":"","sr":"Фотиния пильчатолистная","r":"Photinia","nru":"Фотиния пильчатолистная парка Aigües del Guinardó","s":"Photinia serratifolia","la":41.41319449230291,"ln":2.1655910221668844,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610070957480027-07-93_1.optimized.e00c0ecf.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/fotinies-del-parc-de-les-aigues-del-guinardo-99400455010","d":"Horta-Guinardó","h":"el Baix Guinardó","a":"Ronda del Guinardó 33","dr":"La fotinia es un árbol perenne originario de China. Fue introducida en Europa a principios del siglo XIX, y durante la segunda mitad de este siglo se plantaron muchas en nuestros jardines, pero hoy es difícil encontrar ejemplares adultos. El conjunto catalogado incluye seis ejemplares que están en el parque de las Aigües, en el Guinardó.","drl":"Фотиния — вечнозелёное дерево, родом из Китая. Она была завезена в Европу в начале XIX века, и во второй половине этого века многие были посажены в наших садах, но сегодня трудно найти взрослые экземпляры. Внесённая в каталог группа включает шесть экземпляров, находящихся в парке Айгуэс, в Гинардо.","drh":"Фотиния пильчатолистная — вечнозелёное дерево родом из Китая. Молодые листья красноватые, взрослые — тёмно-зелёные.","cn":"0027-07-93","cy":"1993","by":"1893","cd":"8 m","tp":"1,2 m","ow":"Públic"},{"n":"Lledoner del carrer Benet i Mateu","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный улицы Benet i Mateu","s":"Celtis australis","la":41.39207948151655,"ln":2.127201055240209,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031256230071-05-94_ROY_6-9856.optimized.30ba7a68.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-del-carrer-benet-i-mateu-99400455066","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Passeig de Manuel Girona 55","dr":"El almez es un árbol originario del este de la región mediterránea, totalmente naturalizado en nuestro país. Es una de las especies más utilizadas en las calles de la ciudad. Situado en una propiedad privada accesible desde la calle, presenta una ramificación desde la base que lo singulariza. Se observa un crecimiento armonioso y unas ramas muy desarrolladas.","drl":"Каркас — дерево родом с востока Средиземноморского региона, полностью натурализовавшееся в нашей стране. Это один из самых используемых видов на улицах города. Расположенный в частном владении, доступном с улицы, он имеет ветвление от самого основания, что делает его особенным. Наблюдается гармоничный рост и сильно развитые ветви.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0071-05-94","cy":"1994","by":"1909","cd":"12 m","tp":"2,1 m","ow":"Privat"},{"n":"Alvocater del Teatre Lliure","ne":"","sr":"Авокадо","r":"авокадо","nru":"Авокадо театра Lliure","s":"Persea americana","la":41.370438510370654,"ln":2.1571260482942742,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061110250109-03-96_1.optimized.009a56ca.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alvocater-del-teatre-lliure-99400455081","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passeig de Santa Madrona 40","dr":"Este árbol es uno de los pocos ejemplares de esta especie originaria de Centroamérica que existen en Barcelona. La orientación hacia el sur y la protección del viento que le ofrece el edificio del Palacio de Agricultura han hecho posible que este ejemplar se haya desarrollado hasta alcanzar dimensiones bastante destacables en latitudes tan septentrionales.","drl":"Это дерево — один из немногих экземпляров этого вида, родом из Центральной Америки, существующих в Барселоне. Южная ориентация и защита от ветра, которую обеспечивает здание Дворца сельского хозяйства, позволили этому экземпляру развиться до довольно заметных размеров в столь северных широтах.","drh":"Авокадо — вечнозелёное дерево из Центральной Америки. Плоды — питательные и богатые жирами.","cn":"0109-03-96","cy":"1996","by":"1946","cd":"15 m","tp":"1,6 m","ow":"Públic"},{"n":"Teix dels jardins de la Universitat","ne":"","sr":"Тис ягодный","r":"тис","nru":"Тис ягодный садов Universitat","s":"Taxus baccata","la":41.38709749938092,"ln":2.162880036938556,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610140956050060-02-94_1.optimized.673e304a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/teix-dels-jardins-de-la-universitat-99400454945","d":"Eixample","h":"l'Antiga Esquerra de l'Eixample","a":"Carrer de la Diputació 229","dr":"El tejo, originario de Europa y del oeste de Asia, es uno de los árboles con más simbolismo, posiblemente debido a su gran longevidad. Normalmente solo lo encontramos en los jardines más antiguos. Este ejemplar centenario está en el jardín histórico de la Universidad de Barcelona, espacio que atesora una colección botánica de especies muy interesante.","drl":"Тис, родом из Европы и запада Азии, — одно из самых символичных деревьев, возможно, из-за его большой долговечности. Обычно мы встречаем его только в самых старых садах. Этот столетний экземпляр находится в историческом саду Барселонского университета, пространстве, хранящем очень интересную ботаническую коллекцию видов.","drh":"Тис ягодный — медленнорастущее хвойное дерево с ядовитыми семенами в красной оболочке. Очень теневынослив, живёт до 2000 лет.","cn":"0060-02-94","cy":"1994","by":"1904","cd":"15 m","tp":"1,8 m","ow":"Privat"},{"n":"Roure martinenc del parc de la Tamarita","ne":"","sr":"Дуб пушистый","r":"дуб","nru":"Дуб пушистый","s":"Quercus pubescens","la":41.41069147863324,"ln":2.1351620346800804,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031218140133-05-98_1.optimized.f5be4446.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-martinenc-del-parc-de-la-tamarita-99400454957","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Jardins de La Tamarita 12","dr":"El roble pubescente es una especie propia de los bosques submediterráneos. En las partes más sombrías de Collserola encontramos alguna población. Este gran ejemplar está en los jardines de La Tamarita y se emplaza en la zona llamada la pradera. Está formado por dos grandes pies, uno de los cuales está totalmente tumbado. Esta forma peculiar, así como sus dimensiones, hacen que este ejemplar se considere un árbol de interés local.","drl":"Пушистый дуб — вид, свойственный субсредиземноморским лесам. В самых тенистых частях Кольсеролы мы встречаем некоторые его популяции. Этот крупный экземпляр находится в садах Ла-Тамарита и расположен в зоне, называемой лугом. Он состоит из двух больших стволов, один из которых полностью лежит на земле. Эта особая форма, а также размеры заставляют считать этот экземпляр деревом местного значения.","drh":"Дуб пушистый — листопадное дерево из субсредиземноморских лесов. Молодые листья и побеги покрыты мягким пушком.","cn":"0133-05-97","cy":"1997","by":"1907","cd":"20 m","tp":"2,6 m","ow":"Públic"},{"n":"Roure martinenc de l'Escola Lexia","ne":"","sr":"Дуб пушистый","r":"дуб","nru":"Дуб пушистый","s":"Quercus pubescens","la":41.414529270591046,"ln":2.1396242587744174,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031317080078-06-94_1.optimized.c647fa4c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-martinenc-de-l-escola-lexia-99400454958","d":"Gràcia","h":"Vallcarca i els Penitents","a":"Carrer d'Esteve Terradas 77","dr":"El roble pubescente es una especie propia de los bosques submediterráneos. En las partes más sombrías de Collserola encontramos alguna población. El ejemplar catalogado está en el patio de la Escuela Lexia y tiene una copa inmensa que ocupa la mayor parte del espacio de la escuela. El tamaño de la copa es impresionante.","drl":"Пушистый дуб — вид, свойственный субсредиземноморским лесам. В самых тенистых частях Кольсеролы мы встречаем некоторые его популяции. Внесённый в каталог экземпляр находится во дворе школы Лексия и имеет огромную крону, занимающую большую часть пространства школы. Размер кроны впечатляет.","drh":"Дуб пушистый — листопадное дерево из субсредиземноморских лесов. Молодые листья и побеги покрыты мягким пушком.","cn":"0078-06-94","cy":"1994","by":"1904","cd":"28 m","tp":"2,6 m","ow":"Privat"},{"n":"Pi pinyer del Palau de Pedralbes","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.38824447722184,"ln":2.1159920622717814,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251046340028-04-93_1.optimized.c9890535.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-del-palau-de-pedralbes-99400454972","d":"Les Corts","h":"Pedralbes","a":"Carrer de Jordi Girona 31","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Este es un bello ejemplar, centenario, que ya existía en la antigua finca Güell —la vieja masía Casa Feliu— cuando la casa y parte de la hacienda fueron cedidas a la ciudad, hacia 1921, y posteriormente se transformaron en el Palacio Real. El pino piñonero de Pedralbes es el corazón de una de las creaciones jardineras —obra de Nicolau M. Rubió i Tudurí— más sencillas con respecto al diseño, pero también una de las más bellas de nuestros jardines históricos.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Это прекрасный столетний экземпляр, который уже существовал в старом имении Гуэль — старой усадьбе Каса-Фелиу — когда дом и часть поместья были переданы городу около 1921 года и затем преобразованы в Королевский дворец. Пиния Педральбеса — сердце одного из садовых творений — работы Николау М. Рубио-и-Тудури, — одного из самых простых по замыслу, но также одного из самых красивых в наших исторических садах.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0028-04-93","cy":"1993","by":"1893","cd":"20 m","tp":"3,5 m","ow":"Públic"},{"n":"Washingtònies de la casa de la Misericòrdia","ne":"","sr":"Вашингтония нитеносная","r":"вошингтония","nru":"Вашингтония нитеносная дома Misericòrdia","s":"Washingtonia filifera","la":41.38353750409634,"ln":2.168652043598299,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201220450096-01-94_1.optimized.196c17c8.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-casa-de-la-misericordia-99400454978","d":"Ciutat Vella","h":"el Raval","a":"Carrer d'Elisabets 8","dr":"La washingtonia de California, más esbelta que la de México, es una de las palmeras más comunes en la ciudad. Existe un conjunto de cuatro washingtonias centenarias plantadas en un jardín particular junto a la calle de Elisabets. El pequeño palmeral es testimonio de cierta nobleza edificatoria en la parte alta del Raval. Estos ejemplares, que superan los 20 metros de altura, constituyen un contrapunto a la estructura cerrada de la calle.","drl":"Калифорнийская вашингтония, более стройная, чем мексиканская, — одна из самых распространённых пальм в городе. Здесь находится группа из четырёх столетних вашингтоний, посаженных в частном саду рядом с улицей Элисабетс. Небольшая пальмовая роща — свидетельство определённого благородства застройки в верхней части Раваля. Эти экземпляры, превышающие 20 метров в высоту, составляют контрапункт замкнутой структуре улицы.","drh":"Вашингтония нитеносная — пальма с веерными листьями и «юбкой» из сухих листьев на стволе. Из Калифорнии.","cn":"0096-01-94","cy":"1994","by":"1904","cd":"8 m","tp":"2 m","ow":"Privat"},{"n":"Washingtònies de la Masia Can Sert","ne":"","sr":"Вашингтония нитеносная","r":"вошингтония","nru":"Вашингтония нитеносная","s":"Washingtonia filifera","la":41.40804648655445,"ln":2.148514028097278,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610060941340147-06-06_1.optimized.acf712a3.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-masia-can-sert-99400454980","d":"Gràcia","h":"Vallcarca i els Penitents","a":"Carrer de Velázquez 2","dr":"La washingtonia de California, más esbelta que la de México, es una de las palmeras más comunes en la ciudad. El conjunto está formado por ocho washingtonias, que están en los jardines de la antigua masía Can Sert, en la parte alta del distrito de Gràcia. Es destacable tanto por el porte como por la disposición de los estípites, factor que aporta una monumentalidad extraordinaria al grupo vegetal que lo hace totalmente digno de nuestra atención.","drl":"Калифорнийская вашингтония, более стройная, чем мексиканская, — одна из самых распространённых пальм в городе. Группа состоит из восьми вашингтоний, находящихся в садах старой усадьбы Кан-Серт, в верхней части района Грасия. Она примечательна как статью, так и расположением стволов, что придаёт растительной группе необычайную монументальность, делающую её вполне достойной нашего внимания.","drh":"Вашингтония нитеносная — пальма с веерными листьями и «юбкой» из сухих листьев на стволе. Из Калифорнии.","cn":"0147-06-06","cy":"2006","by":"1881","cd":"6 m","tp":"2,6 m","ow":"Privat"},{"n":"Washingtònies de la Plaça de la Torre Llobeta","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая площади Torre Llobeta","s":"Washingtonia robusta","la":41.42660548667814,"ln":2.173882002228994,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121244010086-08-94_1.optimized.a343128a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-placa-de-la-torre-llobeta-99400454984","d":"Nou Barris","h":"Vilapicina i la Torre Llobeta","a":"Carrer de Santa Fe 2","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. El grupo de tres palmeras se sitúa de forma destacada delante de la Torre Llobeta, una casa solariega de finales del siglo XV con elementos góticos donde actualmente hay un centro cívico y una biblioteca. El edificio está protegido como bien cultural de interés local.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Группа из трёх пальм заметно расположена перед Торре-Льобета, родовым домом конца XV века с готическими элементами, где в настоящее время находятся гражданский центр и библиотека. Здание охраняется как культурное достояние местного значения.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0086-08-94","cy":"1994","by":"1904","cd":"6 m","tp":"1,4 m","ow":"Públic"},{"n":"Washingtònies del carrer Camil Fabra","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая улицы Camil Fabra","s":"Washingtonia robusta","la":41.42941549052173,"ln":2.1871239923274928,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061511250004-09-93_1.optimized.087fb5fb.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-del-carrer-camil-fabra-99400454985","d":"Sant Andreu","h":"Sant Andreu","a":"Carrer de Camil Fabra 16","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. Estos dos ejemplares, integrados en el mismo alcorque de una calle del barrio de Sant Andreu, están unidos mediante tensores para impedir una separación de los estípites que sea peligrosa. Las dos washingtonias son testimonios vivos de viejos jardines desaparecidos, de haciendas muy cercanas a la antigua rambla de Sant Andreu.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Эти два экземпляра, находящиеся в одной приствольной лунке на улице района Сант-Андреу, скреплены растяжками, чтобы предотвратить опасное расхождение стволов. Две вашингтонии — живые свидетели старых исчезнувших садов, поместий, расположенных очень близко к старой рамбле Сант-Андреу.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0004-09-93","cy":"1993","by":"1913","cd":"7 m","tp":"1,1 m","ow":"Públic"},{"n":"Eritrina del carrer Enamorats","ne":"","sr":"Эритрина петушиный гребень","r":"эритрина","nru":"Эритрина петушиный гребень улицы Enamorats","s":"Erythrina crista-galli","la":41.40487749779073,"ln":2.1819310140802606,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121334100150-02-10_1.optimized.d1e00d1c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eritrina-del-carrer-enamorats-99400455039","d":"Eixample","h":"la Sagrada Família","a":"Carrer dels Enamorats 76","dr":"Esta eritrina es originaria de América del Sur y su floración roja es muy característica. Este ejemplar se sitúa en un parterre en la confluencia de la calle de los Enamorats con la calle de Aragó. Esta, sin embargo, no ha sido siempre su ubicación: se trasplantó aquí a finales de los años noventa. Probablemente se trata del mayor ejemplar de esta especie de la ciudad.","drl":"Эта эритрина родом из Южной Америки, и её красное цветение очень характерно. Этот экземпляр расположен на клумбе на пересечении улицы Энаморатс с улицей Арагон. Однако это не всегда было его местом: он был пересажен сюда в конце девяностых годов. Вероятно, это самый крупный экземпляр этого вида в городе.","drh":"Эритрина петушиный гребень — небольшое дерево с яркими красными цветами. Национальный цветок Аргентины.","cn":"0150-02-10","cy":"2010","by":"","cd":"14 m","tp":"1,9 m","ow":"Públic"},{"n":"Alzines del Parc del Laberint","ne":"","sr":"Дуб каменный","r":"дуб","nru":"Дуб каменный парка Laberint","s":"Quercus ilex","la":41.44006280940106,"ln":2.1465266143340758,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610121249550043-07-93_1.optimized.1a7cad8e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alzines-del-parc-del-laberint-99400455047","d":"Horta-Guinardó","h":"Horta","a":"Carrer dels Germans Desvalls 48","dr":"La encina es uno de los árboles autóctonos más emblemáticos, integrante principal de los bosques mediterráneos. Es uno de los árboles más comunes en los bosques de Collserola. Rara vez es posible contemplar ejemplares de encinas alineados, todos ellos de un porte casi idéntico. En el Laberinto, además, modelan un paseo extremamente elegante, como cerrado en sí mismo por la alta cúpula que dibujan las ramas. Con el tronco vestido hasta media altura por la hiedra y con una valla vegetal recortada que delimita el conjunto, no hay ninguna otra arboleda tan rica en tonos oscuros y matices de luz filtrada.","drl":"Каменный дуб — одно из самых символичных местных деревьев, главная составляющая средиземноморских лесов. Это одно из самых обычных деревьев в лесах Кольсеролы. Редко удаётся увидеть выстроенные в ряд экземпляры каменного дуба, все почти одинаковой стати. В Лабиринте же они образуют чрезвычайно элегантную аллею, словно замкнутую в себе высоким куполом, который рисуют ветви. Со стволом, до половины высоты одетым плющом, и с подстриженной живой изгородью, ограничивающей группу, нет другой рощи, столь богатой тёмными тонами и оттенками рассеянного света.","drh":"Дуб каменный — вечнозелёное дерево, основа средиземноморских лесов. Живёт сотни лет, даёт жёлуди, устойчив к засухе.","cn":"0043-07-93","cy":"1993","by":"1903","cd":"20 m","tp":"2,2 m","ow":"Públic"},{"n":"Margalló de la pl. del Dr. Letamendi","ne":"","sr":"Хамеропс низкий","r":"хамеропс","nru":"Хамеропс низкий","s":"Chamaerops humilis","la":41.3887854978572,"ln":2.1607420382779625,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141050190058-02-94_1.optimized.567ebcd5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/margallo-de-la-pl-del-dr-letamendi-99400455057","d":"Eixample","h":"l'Antiga Esquerra de l'Eixample","a":"Plaça del Doctor Letamendi 7","dr":"Esta especie es originaria del macizo del Garraf y es la única palmera genuinamente europea. Situado en un parterre de la plaza del Doctor Letamendi, este ejemplar duplica la altura convencional de la especie, tiene dieciocho tallos y tres de ellos sobresalen por encima del conjunto.","drl":"Этот вид происходит из массива Гарраф и является единственной по-настоящему европейской пальмой. Расположенный на клумбе площади доктора Летаменди, этот экземпляр вдвое превышает обычную высоту вида, имеет восемнадцать стеблей, три из которых возвышаются над всей группой.","drh":"Хамеропс низкий — низкорослая веерная пальма. Единственная пальма, дико растущая в Европе (Испания, Италия).","cn":"0058-02-94","cy":"1994","by":"1904","cd":"9","tp":"0,9 m","ow":"Públic"},{"n":"Plàtan dels jardins de la Vil·la Amèlia","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный садов Vil·la Amèlia","s":"Platanus x acerifolia","la":41.3926544786175,"ln":2.122834056284349,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061003100142-05-03_1.optimized.fd40a23e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platan-dels-jardins-de-la-villa-amelia-99400454964","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer d'Ifni 16","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. El ejemplar catalogado se puede admirar en los jardines de la Vil·la Amèlia. De grandes dimensiones, ha podido desarrollarse sin sufrir ningún tipo de poda, lo que lo convierte en un caso privilegiado entre los árboles de Barcelona. Gracias a ello, su imagen majestuosa nos indica que bello que puede llegar a ser cuando crece con total libertad.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Внесённым в каталог экземпляром можно полюбоваться в садах Вилья-Амелия. Крупных размеров, он смог развиваться без какой-либо обрезки, что делает его привилегированным случаем среди деревьев Барселоны. Благодаря этому его величественный облик показывает нам, насколько красивым оно может быть, когда растёт в полной свободе.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0142-05-03","cy":"2003","by":"1920","cd":"26 m","tp":"3,5 m","ow":"Públic"},{"n":"Xicrandes de la plaça Sagrada Família","ne":"","sr":"Жакаранда мимозолистная","r":"жакаранда","nru":"Жакаранда мимозолистная площади Sagrada Família","s":"Jacaranda mimosifolia","la":41.40262250111484,"ln":2.173128018118485,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141104510127-02-97_11.optimized.5f131764.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xicrandes-de-la-placa-sagrada-familia-99400454975","d":"Eixample","h":"la Sagrada Família","a":"Plaça de la Sagrada Família 9999","dr":"La jacarandá, originaria de América del Sur, es uno de los árboles más utilizados en Barcelona y destaca por su espectacular floración violeta al final de la primavera. Este conjunto está formado por diez unidades, dispuestas en dos alineaciones que delimitan un paseo central en la plaza de la Sagrada Família.","drl":"Жакаранда, родом из Южной Америки, — одно из самых используемых деревьев в Барселоне и выделяется эффектным фиолетовым цветением в конце весны. Эта группа состоит из десяти деревье

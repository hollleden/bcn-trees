<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Árboles de interés local · Barcelona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{
  --bg-app:#F8F9FA;
  --bg-surface:#FFFFFF;
  --bg-hover:#F3F4F6;
  --border:#E5E7EB;
  --border-strong:#D1D5DB;
  --text:#111827;
  --text-muted:#6B7280;
  --text-soft:#9CA3AF;
  --accent:#2D5A27;
  --accent-hover:#234A1E;
  --accent-bg:#ECF3EA;
  --cta:#EA580C;
  --cta-hover:#C2410C;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,.10),0 4px 8px rgba(0,0,0,.04);
  --tb:env(safe-area-inset-top,0px);
  --bb:env(safe-area-inset-bottom,0px);
}
/* ======== ANIMATIONS OFF ======== */
*,*::before,*::after{
  transition:none !important;
  animation:none !important;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font-sans);color:var(--text);background:var(--bg-app);overscroll-behavior:none}
#app{position:relative;height:100vh;height:100dvh;width:100vw;overflow:hidden}
#map{position:absolute;inset:0;z-index:1;background:var(--bg-app)}
.leaflet-tile-pane{filter:saturate(.55) brightness(1.02)}
.leaflet-container{background:var(--bg-app)}

/* ======== HEADER ======== */
.header-pill{
  position:fixed;top:calc(12px + var(--tb));left:424px;right:76px;
  z-index:850;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:8px;
  display:flex;flex-direction:column;gap:8px;
}
.search-wrap{position:relative;display:flex;align-items:center;background:var(--bg-app);border-radius:var(--radius);padding:0 4px}
.s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-soft);font-size:14px}
#search{width:100%;height:40px;padding:0 40px;border:none;background:transparent;font-family:var(--font-sans);font-size:14px;color:var(--text);outline:none}
#search::placeholder{color:var(--text-soft)}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:none;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chips-row{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap;padding:2px 0}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--bg-hover)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.reset-pill{background:var(--cta);color:#fff;border-color:var(--cta);font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip.on .dot{display:none}

/* ======== UNIFIED CONTROL PANEL (right) ======== */
.control-panel{
  position:fixed;top:calc(12px + var(--tb));right:12px;
  z-index:840;
  display:flex;flex-direction:column;gap:1px;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:6px;
}
.ctrl-btn{
  width:40px;height:40px;
  border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--text);
  font-size:20px;font-weight:600;font-family:var(--font-sans);line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.ctrl-btn:hover{background:var(--bg-hover)}
.ctrl-btn.active{background:var(--accent);color:#fff}
.ctrl-btn svg{width:20px;height:20px}
.ctrl-sep{height:1px;background:var(--border);margin:4px 6px}
.lang-switch{display:flex;flex-direction:column;gap:1px;padding:4px 0}
.lang-switch button{
  width:40px;height:32px;
  background:transparent;border:none;border-radius:var(--radius-sm);
  font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.04em;
  color:var(--text-muted);cursor:pointer;
}
.lang-switch button:hover{background:var(--bg-hover)}
.lang-switch button.on{background:var(--accent);color:#fff}

/* ======== PANEL (list/detail) ======== */
#panel{
  transition:transform .32s cubic-bezier(.22,1,.36,1)!important;
  position:fixed;z-index:800;
  background:var(--bg-surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:769px){
  #panel{top:calc(12px + var(--tb));left:12px;width:400px;max-height:calc(100vh - 24px - var(--tb) - var(--bb));border-radius:var(--radius-lg);bottom:calc(12px + var(--bb));padding-top:4px}
  .drag-zone{display:none}
  .list-head{padding-top:14px}
}
@media (min-width:769px) and (max-width:1024px){
  #panel{width:340px}
  .header-pill{left:364px}
  .active-filters{left:364px}
}
@media (max-width:768px){
  #panel{left:8px;right:8px;bottom:calc(8px + var(--bb));border-radius:var(--radius-lg);height:90vh;transform:translateY(calc(90vh - 88px));touch-action:none}
  #panel[data-state="peek"]{transform:translateY(calc(90vh - 88px))}
  #panel[data-state="half"]{transform:translateY(46vh)}
  #panel[data-state="mid"]{transform:translateY(22vh)}
  #panel[data-state="full"]{transform:translateY(0)}
  .header-pill{left:8px;right:66px}
  .control-panel{padding:4px}
  .ctrl-btn{width:36px;height:36px;font-size:18px}
  .lang-switch button{width:36px;height:28px;font-size:10.5px}
}
.drag-zone{flex-shrink:0;padding:10px 0 6px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.drag-handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong)}
.panel-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--bb));overscroll-behavior:contain;touch-action:pan-y}
.panel-scroll::-webkit-scrollbar{width:6px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* ======== LIST ======== */
.list-head{padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.list-title{font-family:var(--font-sans);font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.015em;line-height:1.2}
.list-sub{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.12em;margin-top:6px;font-weight:600}
.list-count{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.10em;font-weight:600;padding:14px 20px 8px}
.list{padding:0 12px 12px;display:flex;flex-direction:column;gap:4px}
.card{display:flex;gap:14px;padding:12px;background:transparent;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;align-items:flex-start}
.card:hover{background:var(--bg-hover);border-color:var(--border)}
.card.visited{background:var(--accent-bg);border-color:rgba(45,90,39,.12)}
.card-img{width:72px;height:72px;border-radius:var(--radius-sm);flex-shrink:0;background:var(--bg-hover);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:26px;border:1px solid var(--border)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{flex:1;min-width:0;padding-top:2px}
.card-title{font-family:var(--font-sans);font-size:15px;font-weight:600;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.card-loc{font-family:var(--font-sans);font-size:12.5px;font-weight:400;color:var(--text-muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card-addr{font-family:var(--font-sans);font-size:11.5px;color:var(--text-soft);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card-addr .pin{color:var(--cta);flex-shrink:0;font-size:10px}
.card-dist{flex-shrink:0;font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;padding-top:2px}
.card-dist .u{font-size:10px;color:var(--text-soft);font-weight:500;display:block;text-align:right}
.badge-v{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-sans);font-size:9.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.empty{padding:60px 24px;text-align:center;color:var(--text-muted)}
.empty .i{font-size:44px;margin-bottom:12px;opacity:.4}
.empty p{font-family:var(--font-sans);font-size:14px}

/* ======== DETAIL ======== */
.hero{position:relative;width:100%;height:220px;background:var(--bg-hover);overflow:hidden;flex-shrink:0;cursor:pointer}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--text-soft)}
.hero.expanded{height:70vh}
.hero.expanded img{object-fit:contain;background:#000}
.hero-btn{position:absolute;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--text);border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.hero-close{top:12px;left:12px}
.hero-expand{top:12px;right:12px}
.detail-body{padding:20px 22px 8px}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-bg);color:var(--accent)}
.visited-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:#fff}
.detail-title{font-family:var(--font-sans);font-size:24px;font-weight:700;line-height:1.22;color:var(--text);letter-spacing:-.02em}
.detail-alt{font-family:var(--font-sans);font-size:13.5px;color:var(--text-muted);margin-top:6px}
.detail-sci{font-family:var(--font-sans);font-size:13.5px;font-style:italic;color:var(--text-muted);margin-top:6px}
.detail-sci a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.cta-row{margin-top:18px;display:flex;gap:8px}
.btn-primary{flex:1;height:48px;border:none;border-radius:var(--radius);background:var(--cta);color:#fff;font-family:var(--font-sans);font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary:hover{background:var(--cta-hover)}
.btn-secondary{height:48px;min-width:48px;padding:0 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text);font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-secondary:hover{background:var(--bg-hover)}
.species-hint{margin-top:16px;padding:12px 14px;background:var(--accent-bg);border-radius:var(--radius);font-family:var(--font-sans);font-size:13px;line-height:1.55;color:var(--accent)}
.species-hint b{font-family:var(--font-sans);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;display:block;margin-bottom:4px}
.detail-desc{font-family:var(--font-sans);font-size:14.5px;line-height:1.65;color:var(--text);margin-top:16px}
.specs{margin-top:20px;padding:16px;background:var(--bg-app);border-radius:var(--radius)}
.specs h3{font-family:var(--font-sans);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:14px}
.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.sp .k{font-family:var(--font-sans);font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.sp .val{font-family:var(--font-sans);font-size:15px;font-weight:600;color:var(--text)}
.addr-card{margin-top:14px;padding:14px;background:var(--bg-app);border-radius:var(--radius);display:flex;gap:10px;align-items:flex-start}
.addr-card .pin{color:var(--cta);font-size:14px;flex-shrink:0;margin-top:2px}
.addr-card b{font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--text);display:block;margin-bottom:3px}
.addr-card small{font-family:var(--font-sans);font-size:12px;color:var(--text-muted)}
.footer{margin-top:22px;padding:16px 0 8px;border-top:1px solid var(--border);font-family:var(--font-sans);font-size:11px;line-height:1.55;color:var(--text-muted);text-align:center}
.footer a{color:var(--accent);font-weight:600;text-decoration:none}

/* ======== MODAL ======== */
.modal-overlay{position:fixed;inset:0;z-index:900;background:rgba(17,24,39,.4);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:540px;max-height:85vh;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--font-sans);font-size:16px;font-weight:700;color:var(--text)}
.modal-head button{background:none;border:none;font-family:var(--font-sans);font-size:13px;font-weight:500;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm)}
.modal-head button:hover{background:var(--bg-hover)}
.modal-cancel{color:var(--text-muted)}
.modal-done{color:var(--accent);font-weight:700}
.modal-body{flex:1;min-height:0;overflow-y:auto;padding:4px 0 16px}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.f-sec{padding:16px 20px;border-bottom:1px solid var(--border)}
.f-sec:last-child{border-bottom:none}
.f-title{font-family:var(--font-sans);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:12px}
.f-chips{display:flex;flex-wrap:wrap;gap:8px}
.f-chip{padding:9px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);background:transparent;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
.f-chip:hover{background:var(--bg-hover)}
.f-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.f-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-family:var(--font-sans);font-size:14px;color:var(--text)}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:var(--border-strong);border-radius:14px;cursor:pointer}
.switch .slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::before{transform:translateX(20px)}

/* ======== ACTIVE FILTERS ======== */
.active-filters{position:fixed;z-index:830;left:424px;right:76px;top:calc(132px + var(--tb));display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-height:60px;overflow:hidden;opacity:0}
.active-filters.show{opacity:1}
.active-filters > *{pointer-events:auto}
.af-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 6px 6px 12px;background:var(--bg-surface);color:var(--text);border:1px solid var(--border);font-family:var(--font-sans);font-size:11.5px;font-weight:500;border-radius:var(--radius-pill);box-shadow:var(--shadow-sm)}
.af-chip button{background:none;border:none;color:var(--text-soft);font-size:12px;font-weight:700;cursor:pointer;padding:0 4px;line-height:1}
.af-chip button:hover{color:var(--cta)}
@media (max-width:768px){
  .active-filters{left:8px;right:66px;top:calc(160px + var(--tb))}
}

/* ======== TOAST ======== */
#toast{position:fixed;left:50%;bottom:calc(100px + var(--bb));transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:var(--radius);font-family:var(--font-sans);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;z-index:1000;max-width:90vw;text-align:center}
#toast.on{opacity:1}


/* ======== NEW DETAIL CARD (v26) ======== */
.detail-body{padding:22px 22px 12px}

/* Title block */
.title-block{margin-bottom:14px}
.detail-title{font-family:var(--font-sans);font-size:26px;font-weight:700;line-height:1.2;color:var(--text);letter-spacing:-.02em;margin-bottom:6px}
.detail-sub{font-family:var(--font-sans);font-size:14px;color:var(--text-muted);line-height:1.4}
.detail-sub .sci{font-style:italic}
.detail-orig{font-family:var(--font-sans);font-size:12.5px;font-style:italic;color:var(--text-soft);margin-top:4px;line-height:1.4}

/* Category chip */
.cat-line{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:11.5px;font-weight:600;background:var(--accent-bg);color:var(--accent);letter-spacing:.02em}
.visited-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:11.5px;font-weight:600;background:var(--accent);color:#fff;letter-spacing:.02em}

/* Metrics grid */
.metrics-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.metric{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-app);border-radius:var(--radius);font-family:var(--font-sans);font-size:13.5px;color:var(--text)}
.metric-icon{font-size:15px;line-height:1}
.metric-val{font-weight:600}
.metric-lbl{color:var(--text-muted);font-weight:400;margin-right:4px}

/* Unified text block */
.text-block{margin-bottom:20px}
.text-block-title{font-family:var(--font-sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:10px}
.text-block p{font-family:var(--font-sans);font-size:14.5px;line-height:1.68;color:var(--text);margin-bottom:10px}
.text-block p:last-child{margin-bottom:0}

/* Location block */
.location-block{padding:16px;background:var(--bg-app);border-radius:var(--radius);margin-bottom:16px}
.location-info{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.location-info .pin{color:var(--cta);font-size:15px;margin-top:2px;flex-shrink:0}
.location-info .txt{flex:1;min-width:0}
.location-info b{font-family:var(--font-sans);font-size:14.5px;font-weight:600;color:var(--text);display:block;margin-bottom:3px;line-height:1.35}
.location-info small{font-family:var(--font-sans);font-size:12.5px;color:var(--text-muted);line-height:1.4}
.btn-route{display:flex;align-items:center;justify-content:center;width:100%;height:50px;background:var(--cta);color:#fff;font-family:var(--font-sans);font-size:15px;font-weight:600;border:none;border-radius:var(--radius);text-decoration:none;cursor:pointer;gap:8px;letter-spacing:-.01em}
.btn-route:hover{background:var(--cta-hover)}

/* Registry details */

/* ============================================
   v34 fix close+overflow
   ============================================ */

/* 1. Панель не вылезает за вьюпорт */

  overflow-x: hidden !important;
}

}

/* 2. Заголовки переносятся, не обрезаются */

.card-title,
.modal-title, .f-title,
.specs-title, .species-plate b{

  max-width: 100% !important;
}

/* 3. Крестик закрытия — в ЛЕВОМ верхнем углу фото,
      тёмный, всегда виден, поверх всего внутри панели */
#panel .detail-close-x,
.detail-hero .detail-close-x,
.hero .detail-close-x,
#heroBox .detail-close-x,
.detail-close-x{
  position: absolute !important;
  top: 12px !important;
  left: 12px !important;
  right: auto !important;
  z-index: 40 !important;
  width: 42px !important;
  height: 42px !important;
  min-width: 42px !important;
  min-height: 42px !important;
  padding: 0 !important;
  margin: 0 !important;
  background: rgba(26,54,41,.92) !important;

#panel .detail-close-x:hover,
.detail-close-x:hover{
  background: #112318 !important;
}

/* 4. Hero — точка отсчёта для позиционирования крестика */
.detail-hero, .hero, #heroBox{
  position: relative !important;
}

/* 5. На узком экране подстрахуемся — панель управления чуть ниже,
      чтобы не пересекалась с крестиком детальной карточки */
@media (max-width: 768px){
  .control-panel{
    top: calc(12px + var(--tb)) !important;
    right: 8px !important;
  }
}

/* v43 sheet — 2 states: collapsed (72px) / expanded (90vh) */
@media (max-width: 767.98px){
  #panel{ transition: transform 300ms cubic-bezier(0.32,0.72,0,1) !important; will-change: transform; }
  #panel[data-state="collapsed"]{ transform: translateY(calc(100vh - 72px)) !important; }
  #panel[data-state="expanded"] { transform: translateY(0) !important; }
  #panel[data-dragging="1"]{ transition: none !important; }
  #dragZone,.drag-zone{ touch-action: none !important; cursor: grab; min-height: 28px; padding: 12px 0 10px; }
  #dragZone:active,.drag-zone:active{ cursor: grabbing; }
}
@media (min-width: 768px){
  #panel[data-state="collapsed"],
  #panel[data-state="expanded"]{ transform: none !important; }
}


/* ============================================
   v45 z-index fix + layout
   По ТЗ: слои, хэндл, отступы, контраст
   ============================================ */

/* ---- 1. Слои: шторка выше кнопок карты ---- */
@media (max-width: 767.98px){
  #panel{ z-index: 900 !important; }
  .control-panel{ z-index: 700 !important; }

  /* Кнопки карты исчезают, когда открыта детальная карточка */
  body:has(#panel[data-state="expanded"]) .control-panel{
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* ---- 2. Шторка не заезжает под поиск ---- */
  #panel{
    max-height: calc(100vh - 96px) !important;
  }
  #panel[data-state="expanded"]{
    transform: translateY(0) !important;
  }
  #panel[data-state="collapsed"]{
    transform: translateY(calc(100vh - 96px - 72px)) !important;
  }

  /* Хэндл — заметный, по ТЗ */
  .drag-zone, #dragZone{
    padding: 12px 0 10px !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    touch-action: none !important;
  }
  .drag-handle, .drag-zone::before, #dragZone::before{
    width: 36px !important;
    height: 4px !important;
    border-radius: 2px !important;
    background: #C5C8C6 !important;
    display: block !important;
    content: '' !important;
  }

  /* ---- 3. Отступы в карточке ---- */
  #panel .detail-inner,
  #panel .v-inner{
    padding-left: 20px !important;
    padding-right: 20px !important;
  }
  #panel .list-head{
    padding-left: 20px !important;
    padding-right: 20px !important;
  }
  #panel .list{
    padding-left: 12px !important;
    padding-right: 12px !important;
  }

  /* ---- 4. Контраст заголовков в «Характеристиках» ---- */
  .sp .k,
  .specs .sp .k,
  #panel .sp .k{
    color: #4A6054 !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    letter-spacing: .02em !important;
    opacity: 1 !important;
    text-transform: none !important;
  }
  .sp .val,
  .specs .sp .val{
    color: #1A3629 !important;
    font-size: 15px !important;
    font-weight: 700 !important;
  }

  /* Заголовок блока ХАРАКТЕРИСТИКИ — тоже читаемее */
  .specs-title,
  .specs h3{
    color: #4A6054 !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    opacity: 1 !important;
  }
}





/* ============================================
   v47 fix tap
   ============================================ */
@media (max-width: 767.98px){

  /* Убираем серую полоску хэндла — она не нравилась */
  .drag-zone::before,
  #dragZone::before,
  .drag-handle,
  .drag::before{
    display: none !important;
    content: none !important;
  }

  /* Но сама drag-zone должна быть достаточно высокой,
     чтобы по ней можно было тапнуть и тянуть пальцем */
  .drag-zone, #dragZone, .drag{
    padding: 0 !important;
    height: 28px !important;
    min-height: 28px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: grab !important;
    touch-action: none !important;
    background: transparent !important;
    position: relative;
  }

  /* Едва заметная точка-подсказка по центру (не раздражает, но намекает) */
  .drag-zone::after,
  #dragZone::after{
    content: '';
    display: block;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: rgba(26,54,41,.15);
    pointer-events: none;
  }
}

<script>
const TREES = [{"n":"Plàtans dels jardins del Claustre","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный садов Claustre","s":"Platanus x acerifolia","la":41.36890157649342,"ln":2.1586383228277817,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041312280176-03-17_2.optimized.beb26d52.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-dels-jardins-del-claustre-99400638000","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passeig de Santa Madrona 30","dr":"El plátano de sombra es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. El conjunto catalogado consta de tres plátanos de enormes dimensiones situados en los jardines del Claustre, entre los del Teatre Grec y los de Laribal. Este espacio ofrece unas condiciones umbrías y de humedad perfectas para esta especie.","drl":"Платан кленолистный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Внесённая в каталог группа состоит из трёх платанов огромных размеров, расположенных в садах Клаустре между садами Греческого театра и садами Ларибаль. В этом месте создаются тенистые и влажные условия, идеальные для данного вида.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0176-03-17","cy":"2017","by":"","cd":"","tp":"3,2 m","ow":""},{"n":"Arbre serp dels interiors de Via Favència","ne":"","sr":"Радермахера китайская","r":"Radermachera","nru":"Радермахера китайская","s":"Radermachera sinica","la":41.44519928902866,"ln":2.1746956487853364,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041236220179-08-17_1.optimized.501ac73f.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbre-serp-dels-interiors-de-via-favencia-99400638006","d":"Nou Barris","h":"les Roquetes","a":"Via Favència 179","dr":"Este árbol de dimensiones discretas es originario de China y Taiwán, y constituye una verdadera rareza en nuestra ciudad. El ejemplar crece en los interiores ajardinados de los bloques de pisos de la vía Favència, seguramente a raíz de la plantación de un particular.","drl":"Это дерево скромных размеров родом из Китая и Тайваня и является настоящей редкостью в нашем городе. Экземпляр растёт во внутренних озеленённых дворах многоквартирных домов на улице Виа Фавенсия, вероятно, в результате посадки частным лицом.","drh":"Радермахера китайская — вечнозелёное дерево родом из Китая и Тайваня. В Европе — редкость.","cn":"0179-08-17","cy":"2017","by":"","cd":"10 m","tp":"1,2 m","ow":""},{"n":"Lledoner de la Fundació Muñoz Ramonet","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный фонда Muñoz Ramonet","s":"Celtis australis","la":41.39627461437971,"ln":2.1468892962598556,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041225350181-05-17_1.optimized.02cab0cd.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-de-la-fundacio-munoz-ramonet-99400638013","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Carrer de Muntaner 282","dr":"El almez es un árbol originario del este de la región mediterránea, totalmente naturalizado en nuestro país. Es una de las especies más utilizadas en las calles de la ciudad. Se trata de un ejemplar monumental, como hay pocos en Barcelona. Rodeado de árboles y plantas perennes, el ejemplar se sitúa de forma armónica en los espléndidos jardines del edificio que hoy es sede de la Fundación Julio Muñoz Ramonet.","drl":"Каркас — дерево родом с востока Средиземноморского региона, полностью натурализовавшееся в нашей стране. Это один из самых используемых видов на улицах города. Перед нами монументальный экземпляр, каких в Барселоне мало. В окружении деревьев и вечнозелёных растений экземпляр гармонично вписан в великолепные сады здания, в котором сегодня размещается Фонд Хулио Муньоса Рамонета.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0181-05-17","cy":"2017","by":"Per determinar","cd":"23 m","tp":"2,9 m","ow":""},{"n":"Còculs dels jardins del Palau Robert","ne":"","sr":"Коккулюс лавролистный","r":"Cocculus","nru":"Коккулюс лавролистный садов Palau Robert","s":"Cocculus laurifolius","la":41.395637962674975,"ln":2.159106553084435,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910021428170184-02-18_1.optimized.6d4d3af9.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/coculs-dels-jardins-del-palau-robert-99400638025","d":"Eixample","h":"la Dreta de l'Eixample","a":"Carrer de Còrsega 302","dr":"Originario de Japón, China y el Himalaya, el cóculo era corriente en los jardines de principios del siglo XX. Los tres ejemplares de cóculos catalogados se encuentran en el jardín histórico que rodea la Casa Robert, construida a finales del siglo XIX.","drl":"Родом из Японии, Китая и Гималаев, кокулюс был обычным растением в садах начала XX века. Три внесённых в каталог экземпляра кокулюса находятся в историческом саду, окружающем Каса-Роберт, построенный в конце XIX века.","drh":"Коккулюс лавролистный — вечнозелёный кустарник или небольшое дерево. Родом из Азии, с ароматными листьями.","cn":"0184-02-18","cy":"2018","by":"1903","cd":"9 m","tp":"2,2 m","ow":""},{"n":"Datiler de la Casa de l'Ardiaca","ne":"","sr":"Финик пальчатый","r":"финиковая пальма","nru":"Финик пальчатый дома Ardiaca","s":"Phoenix dactylifera","la":41.384154511541134,"ln":2.1756980291862207,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610250957530002-01-93_1.optimized.3931b891.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/datiler-de-la-casa-de-l-ardiaca-99400455014","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Carrer de Santa Llúcia 1","dr":"La palmera datilera está muy extendida por toda la región mediterránea e históricamente se cultivaba por sus frutos, los dátiles. Este ejemplar es de los más viejos de la ciudad y se encuentra en el patio interior de la Casa de l’Ardiaca. Se eleva por encima de la galería superior, abierta y con balaustradas, hasta llegar a los ventanales superiores. Raramente un ejemplar de palmera adquiere tanta significación popular y se compenetra tan armoniosamente con la historia y la arquitectura.","drl":"Финиковая пальма широко распространена по всему Средиземноморскому региону и исторически возделывалась ради своих плодов — фиников. Этот экземпляр — один из старейших в городе, он находится во внутреннем дворе Каса-де-л’Ардиака. Он поднимается над верхней галереей — открытой, с балюстрадами — и достигает верхних окон. Редко когда экземпляр пальмы приобретает такое народное значение и так гармонично сочетается с историей и архитектурой.","drh":"Финиковая пальма — высокая пальма с перистыми листьями. Культивируется в Средиземноморье тысячи лет ради съедобных плодов — фиников.","cn":"0002-01-93","cy":"1993","by":"1873","cd":"6 m","tp":"1 m","ow":"Privat"},{"n":"Eucaliptus vermell de la plaça de les Caramelles","ne":"","sr":"Эвкалипт камальдульский","r":"эвкалипт","nru":"Эвкалипт камальдульский","s":"Eucalyptus camaldulensis","la":41.38240050571357,"ln":2.1677350360031857,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201022410052-01-94_1.optimized.aa9dac2d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-vermell-de-la-placa-de-les-caramelles-99400455018","d":"Ciutat Vella","h":"el Raval","a":"Plaça de les Caramelles 5","dr":"El eucalipto rojo es nativo de Australia y está ampliamente difundido por todo el mundo. El ejemplar se encuentra en el recinto de la Casa de la Caritat, visible desde la plaza de las Caramelles. Muy desarrollado, tal como es característico en la especie, conserva una gran elegancia a causa del porte esbelto y compacto.","drl":"Красный эвкалипт — уроженец Австралии и широко распространён по всему миру. Экземпляр находится на территории Каса-де-ла-Карита и виден с площади Карамельес. Очень развитый, как и свойственно этому виду, он сохраняет большое изящество благодаря стройной и компактной стати.","drh":"Эвкалипт камальдульский — вечнозелёное дерево из Австралии с ароматными ланцетными листьями и отслаивающейся корой. Быстро растёт.","cn":"0052-01-94","cy":"1994","by":"1904","cd":"13 m","tp":"3,1 m","ow":"Públic"},{"n":"Eucaliptus vermell de la Guineueta","ne":"","sr":"Эвкалипт камальдульский","r":"эвкалипт","nru":"Эвкалипт камальдульский","s":"Eucalyptus camaldulensis","la":41.43998762915963,"ln":2.1682440676294426,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061446470018-08-93_1.optimized.c92f24f1.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-vermell-de-la-guineueta-99400455019","d":"Nou Barris","h":"la Guineueta","a":"Carrer de la Gasela 23","dr":"El eucalipto rojo es nativo de Australia y está ampliamente difundido por todo el mundo. Este pie, de porte majestuoso, se sitúa en un parterre en la calle de la Gasela, en el barrio de la Guineueta.","drl":"Красный эвкалипт — уроженец Австралии и широко распространён по всему миру. Эта особь величественной стати расположена на клумбе на улице Газела, в районе Гинеуэта.","drh":"Эвкалипт камальдульский — вечнозелёное дерево из Австралии с ароматными ланцетными листьями и отслаивающейся корой. Быстро растёт.","cn":"0018-08-93","cy":"1995","by":"1913","cd":"20 m","tp":"2,8 m","ow":"Públic"},{"n":"Còcul de l'Arxiu Joan Maragall","ne":"","sr":"Коккулюс лавролистный","r":"Cocculus","nru":"Коккулюс лавролистный","s":"Cocculus laurifolius","la":41.400485487597436,"ln":2.1469020304922766,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610031055440077-05-94_1.optimized.7996d2d2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cocul-de-l-arxiu-joan-maragall-99400455024","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Carrer d'Alfons XII 79","dr":"Originario de Japón, China y el Himalaya, el cóculo era corriente en los jardines de principios de siglo. Este ejemplar está en el jardín interior de la antigua residencia del poeta Joan Maragall, donde actualmente se ubica el Archivo Joan Maragall.","drl":"Родом из Японии, Китая и Гималаев, кокулюс был обычным растением в садах начала века. Этот экземпляр находится во внутреннем саду бывшей резиденции поэта Жоана Мараля, где сейчас располагается Архив Жоана Мараля.","drh":"Коккулюс лавролистный — вечнозелёный кустарник или небольшое дерево. Родом из Азии, с ароматными листьями.","cn":"0077-05-94","cy":"1994","by":"1904","cd":"12 m","tp":"1,5 m","ow":"Privat"},{"n":"Cedres dels jardins del Palau Reial de Pedralbes","ne":"","sr":"Кедр гималайский","r":"Cedrus","nru":"Кедр гималайский садов Palau Reial de Pedralbes","s":"Cedrus deodara","la":41.38807040491239,"ln":2.117851080597635,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610251042180045-04-93_1.optimized.f778bad8.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cedres-dels-jardins-del-palau-reial-de-pedralbes-99400455027","d":"Les Corts","h":"Pedralbes","a":"Avinguda Diagonal 686","dr":"El cedro del Himalaya es una especie de conífera originaria del oeste del Himalaya que puede llegar a los 50 m de altura. El conjunto está formado por una veintena de ejemplares distribuidos por los jardines del Palacio Real de Pedralbes. Se trata de la arboleda más importante de la ciudad y data de antes de la construcción de este jardín histórico, el año 1925.","drl":"Гималайский кедр — вид хвойных, родом с запада Гималаев, который может достигать 50 м в высоту. Группа состоит примерно из двадцати экземпляров, распределённых по садам Королевского дворца Педральбес. Это самая важная роща в городе, она существовала ещё до создания этого исторического сада в 1925 году.","drh":"Кедр гималайский — величественное хвойное дерево высотой до 50 м с поникающими ветвями. Происходит из западных Гималаев.","cn":"0045-04-93","cy":"1993","by":"1903","cd":"22 m","tp":"3,4 m","ow":"Públic"},{"n":"Lledoner del carrer Casp","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный улицы Casp","s":"Celtis australis","la":41.392557395053174,"ln":2.1747527881124005,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200921590140-02-98_1.optimized.70c3e862.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-del-carrer-casp-99400455065","d":"Eixample","h":"la Dreta de l'Eixample","a":"Carrer de Casp 49","dr":"El almez es un árbol originario del este de la región mediterránea, totalmente naturalizado en nuestro país. Es una de las especies más utilizadas en las calles de la ciudad. Este almez, plantado como árbol de alineación, está acompañado por otros árboles viarios, en concreto plátanos (Platanus × hispanica). Este factor, unido a la formación compacta y al desarrollo tanto en altura como de la copa de este ejemplar, lo convierten en un pie de almez singular.","drl":"Каркас — дерево родом с востока Средиземноморского региона, полностью натурализовавшееся в нашей стране. Это один из самых используемых видов на улицах города. Этот каркас, посаженный как придорожное дерево, соседствует с другими уличными деревьями, в частности с платанами (Platanus × hispanica). Этот фактор, а также компактная форма и развитие этого экземпляра как в высоту, так и в кроне делают его особенным среди каркасов.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0140-02-98","cy":"1998","by":"1958","cd":"13 m","tp":"1,8 m","ow":"Públic"},{"n":"Lagunària dels jardins del Teatre Grec","ne":"","sr":"Лагунария Патерсона","r":"лагунария","nru":"Лагунария Патерсона садов Teatre Grec","s":"Lagunaria patersonia","la":41.36980250857722,"ln":2.159438049562137,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061502000010-03-93_1.optimized.e11861b7.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lagunaria-dels-jardins-del-teatre-grec-99400455071","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passatge de Martras 26","dr":"La lagunaria es un árbol perennifolio de bellas flores originario de Australia y sus islas próximas. El ejemplar catalogado, de grandes dimensiones y bien formado, destaca en medio de los jardines del Teatre Grec.","drl":"Лагунария — вечнозелёное дерево с красивыми цветами, родом из Австралии и близлежащих островов. Внесённый в каталог экземпляр, крупных размеров и хорошо сформированный, выделяется среди садов Греческого театра.","drh":"Лагунария Патерсона — вечнозелёное дерево с розовыми цветами, похожими на гибискус. Из Австралии.","cn":"0010-03-93","cy":"1993","by":"1923","cd":"20 m","tp":"2,4 m","ow":"Públic"},{"n":"Grevillea de la Via Augusta","ne":"","sr":"Гревиллея мощная","r":"гревиллея","nru":"Гревиллея мощная","s":"Grevillea robusta","la":41.397866480223136,"ln":2.134928043340844,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/99400455072-arbrespalmeresgrevillearobustasarriag01.optimized.7141.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/grevillea-de-la-via-augusta-99400455072","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Via Augusta 241","dr":"El roble sedoso es un árbol perennifolio, de copa redondeada, originario del este de Australia. El ejemplar catalogado destaca como árbol de grandes dimensiones integrado en los jardines de los Drets Humans.","drl":"Шёлковый дуб — вечнозелёное дерево с округлой кроной, родом с востока Австралии. Внесённый в каталог экземпляр выделяется как дерево крупных размеров, вписанное в сады Прав человека.","drh":"Гревиллея мощная — вечнозелёное дерево из Австралии с рассечёнными листьями и яркими оранжевыми цветами в кистях.","cn":"0076-05-94","cy":"1994","by":"1914","cd":"8 m","tp":"1,6 m","ow":"Públic"},{"n":"Ginkgo dels jardins de la Universitat","ne":"","sr":"Гинкго двулопастный","r":"Гинкго билоба","nru":"Гинкго двулопастный садов Universitat","s":"Ginkgo biloba","la":41.38645750055248,"ln":2.162601033159792,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610200911030059-02-94_1.optimized.333d2948.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ginkgo-dels-jardins-de-la-universitat-99400455073","d":"Eixample","h":"l'Antiga Esquerra de l'Eixample","a":"Carrer d'Aribau 16","dr":"El ginkgo, procedente de China, se puede considerar un fósil viviente, ya que evolutivamente es la especie más antigua de las que hay actualmente. Este ejemplar está en los jardines de la Universidad de Barcelona. Además de su dimensión, presenta la particularidad de tener un tronco múltiple, con dos troncos principales y cuatro más pequeños.","drl":"Гинкго, происходящее из Китая, можно считать живым ископаемым, поскольку в эволюционном плане это самый древний из ныне существующих видов. Этот экземпляр находится в садах Барселонского университета. Помимо размеров, он отличается особенностью — многоствольностью: два главных ствола и ещё четыре поменьше.","drh":"Гинкго двулопастный — реликтовое дерево, сохранившееся со времён динозавров. Единственный живой представитель отдела гинкговых. Листья веерные, осенью ярко-жёлтые.","cn":"0059-02-94","cy":"1994","by":"1904","cd":"16 m","tp":"1,6 m","ow":"Privat"},{"n":"Garrofer de la Plaça de la Natura del Park Güell","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево площади Natura del Park Güell","s":"Ceratonia siliqua","la":41.4141774827722,"ln":2.1528940230370632,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/ROY_2020-9290030.760x428.cfa2bc4e.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-de-la-placa-de-la-natura-del-park-guell-99400455078","d":"Gràcia","h":"la Salut","a":"Carrer d'Olot 15","dr":"Los algarrobos del Park Güell son, por sí mismos, árboles de interés general, pero el ejemplar que se presenta en esta ficha es un fenómeno de la naturaleza interesante. El actual algarrobo, con un tronco de 90 cm de perímetro, es un retoño de un árbol que alcanzó los cuatro metros de perímetro de tronco y que rodea el retoño con unas formas caprichosas bastante parecidas a las líneas de Gaudí del parque.","drl":"Рожковые деревья парка Гуэль сами по себе являются деревьями общего интереса, но экземпляр, о котором идёт речь в этой карточке, — интересное природное явление. Нынешнее рожковое дерево с окружностью ствола 90 см — это отпрыск дерева, ствол которого достигал в обхвате четырёх метров и которое обвивает отпрыск причудливыми формами, весьма напоминающими линии Гауди в парке.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0132-06-97","cy":"1997","by":"1907","cd":"10 m","tp":"4,1 m","ow":"Públic"},{"n":"Alvocater de la plaça de Can Bruixa","ne":"","sr":"Авокадо","r":"авокадо","nru":"Авокадо площади Can Bruixa","s":"Persea americana","la":41.38357146509378,"ln":2.130810511881504,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270849410146-04-03_1.optimized.5f7c5355.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/alvocater-de-la-placa-de-can-bruixa-99400455082","d":"Les Corts","h":"les Corts","a":"Travessera de les Corts 202","dr":"Este aguacatero de porte magnífico, con dos brazos y de edad avanzada, anteriormente estaba en el jardín de una finca privada. Ha pasado a ser patrimonio público al quedar integrado en un espacio abierto, en una nueva plaza, donde es visible desde cualquier punto. Es una especie originaria de la América tropical, poco frecuente en Barcelona, de fructificación no regular, ya que es propia de climas más cálidos.","drl":"Этот авокадо великолепной стати, с двумя ветвями и преклонного возраста, прежде находился в саду частного владения. Он стал общественным достоянием, оказавшись включённым в открытое пространство, в новую площадь, где виден из любой точки. Это вид, родом из тропической Америки, редкий в Барселоне, с нерегулярным плодоношением, так как он свойствен более тёплым климатам.","drh":"Авокадо — вечнозелёное дерево из Центральной Америки. Плоды — питательные и богатые жирами.","cn":"0146-04-03","cy":"2003","by":"1945","cd":"9 m","tp":"0,8 m","ow":"Públic"},{"n":"Sòfora de la plaça Santa Engràcia","ne":"","sr":"Софора японская","r":"софора","nru":"Софора японская площади Santa Engràcia","s":"Styphnolobium japonicum","la":41.442958484381286,"ln":2.180568986352565,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610071253380089-08-94_1.optimized.11d360b0.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/sofora-de-la-placa-santa-engracia-99400455083","d":"Nou Barris","h":"la Prosperitat","a":"Plaça de Santa Engràcia 3","dr":"La acacia del Japón, originaria de China y Corea, es un árbol muy común en nuestras calles. Este ejemplar, situado en la plaza de Santa Engràcia, en una zona con muy poco verde, destaca por su gran copa.","drl":"Японская акация, родом из Китая и Кореи, — очень распространённое дерево на наших улицах. Этот экземпляр, расположенный на площади Санта-Энграсия, в зоне с очень малым количеством зелени, выделяется своей большой кроной.","drh":"Софора японская — декоративное листопадное дерево с перистыми листьями и кремовыми цветами в метёлках. Устойчива в городе.","cn":"0089-08-94","cy":"1994","by":"1899","cd":"17 m","tp":"2,8 m","ow":"Públic"},{"n":"Tarongers de la Casa de la Misericòrdia","ne":"","sr":"Померанец (горький апельсин)","r":"цитрусовое дерево","nru":"Померанец (горький апельсин) дома Misericòrdia","s":"Citrus aurantium","la":41.383771524515495,"ln":2.168150760840355,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041316350175-01-16_1.optimized.4c4dc5c2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tarongers-de-la-casa-de-la-misericordia-99400637948","d":"Ciutat Vella","h":"el Raval","a":"Jardí dels Tarongers 17","dr":"El naranjo amargo es un cítrico híbrido que introdujeron los árabes en Occidente durante el siglo X. El conjunto catalogado está formado por una treintena de ejemplares distribuidos en dos filas paralelas en el jardín de la Casa de la Misericòrdia.","drl":"Померанец (горький апельсин) — гибридный цитрус, который арабы ввели на Западе в X веке. Внесённая в каталог группа состоит примерно из тридцати экземпляров, расположенных двумя параллельными рядами в саду Каса-де-ла-Мизерикордия.","drh":"Померанец (горький апельсин) — вечнозелёное цитрусовое дерево с ароматными цветами и горькими плодами. Из них делают мармелад и ликёры.","cn":"","cy":"2016","by":"","cd":"10 m","tp":"0,8 m","ow":""},{"n":"Pitòspor de la Ciutadella","ne":"","sr":"Питтоспорум табара","r":"питтоспорум","nru":"Питтоспорум табара","s":"Pittosporum tobira","la":41.38762546028392,"ln":2.186242859719225,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041241280178-01-17_1.optimized.bbf014c1.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pitospor-de-la-ciutadella-99400638005","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 22","dr":"El pitósporo, procedente de la costa que rodea el mar de la China Oriental, es un arbusto muy utilizado por su versatilidad en la poda y porque es muy resistente a la contaminación. El ejemplar catalogado es excepcional por sus dimensiones, totalmente asimilables a las de un árbol con una copa muy bien formada. Está en pleno centro del parque de la Ciutadella.","drl":"Питоспорум, родом с побережья, окружающего Восточно-Китайское море, — кустарник, который широко используется из-за своей податливости при обрезке и устойчивости к загрязнению. Внесённый в каталог экземпляр исключителен по своим размерам, полностью приближающимся к размерам дерева, с очень хорошо сформированной кроной. Он находится прямо посреди парка Сьютаделья.","drh":"Питтоспорум табара — вечнозелёный кустарник с кожистыми листьями и ароматными кремовыми цветами. Устойчив к соли и ветру.","cn":"0178-01-17","cy":"2017","by":"","cd":"6 m","tp":"1,55 m","ow":""},{"n":"Còculs","ne":"","sr":"Коккулюс лавролистный","r":"Cocculus","nru":"Коккулюс лавролистный","s":"Cocculus laurifolius","la":41.38115361365599,"ln":2.174443017054593,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Coculs_del_jardi_de_la_Casa_Ignacio_de_Puig.optimized.8cacf795.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/coculs-99400638024","d":"Ciutat Vella","h":"el Barri Gòtic","a":"Carrer d'en Quintana 4","dr":"El jardín de la casa Ignacio de Puig está catalogado por el Ayuntamiento de Barcelona como patrimonio arquitectónico, con el número 192. El jardín, de carácter romántico, fue creado en 1861 como parte de un palacete del siglo XIX, que tiene dos fachadas que dan a la calle Aroles y a la de la Boqueria. El jardín posterior está terraplenado, y contiene elementos típicos de este tipo de jardines, como una lonja, una gruta y varias piezas que habían sido pequeños estanques. Es un jardín de titularidad privada y en la actualidad el edificio está ocupado por el hotel Petit Palace. Es de uso público a partir de las 10 de la mañana y hasta el atardecer. El Hotel ha instalado mobiliario y luces, convirtiéndolo en uno de los rincones más tranquilos a pocos metros de La Rambla. El jardín está totalmente arbolado, siendo el grupo de 9 cóculos los árboles que dominan. También encontramos otros árboles notables, como por ejemplo dos magnolias (Magnolia grandiflora) y un tilo (Tilia sp). El cóculo es una especie, hoy en día olvidada en las nuevas plantaciones, que fue muy utilizada en los jardines de finales del siglo XIX. Si bien los ejemplares no son de los más gruesos, el interés viene dado por la composición del conjunto integrado de forma armoniosa en un entorno tan singular como un jardín romántico catalogado.","drl":"Сад дома Игнасио де Пуига внесён Муниципалитетом Барселоны в каталог архитектурного наследия под номером 192. Сад романтического характера был создан в 1861 году как часть небольшого дворца XIX века, имеющего два фасада, выходящих на улицы Ароле и Бокерия. Задний сад устроен террасами и содержит типичные для такого рода садов элементы: лоджию, грот и несколько элементов, которые прежде были небольшими прудами. Это сад в частной собственности, и в настоящее время здание занимает отель Petit Palace. Он открыт для публики с 10 часов утра и до вечера. Отель установил там мебель и светильники, превратив его в один из самых тихих уголков в нескольких метрах от Рамблы. Сад полностью засажен деревьями, среди которых доминирует группа из 9 кокулюсов. Здесь также встречаются другие примечательные деревья, например две магнолии (Magnolia grandiflora) и липа (Tilia sp). Кокулюс — вид, сегодня забытый в новых посадках, который широко использовался в садах конца XIX века. Хотя экземпляры не из самых толстых, интерес определяется композицией группы, гармонично вписанной в такое особенное окружение, как внесённый в каталог романтический сад.","drh":"Коккулюс лавролистный — вечнозелёный кустарник или небольшое дерево. Родом из Азии, с ароматными листьями.","cn":"0205-01-20","cy":"2021","by":"Per determinar","cd":"20 m","tp":"1,4 m","ow":""},{"n":"Pi pinyer del carrer August Font","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.4194274936237,"ln":2.1342448654942756,"im":"","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-del-carrer-august-font-99400637927","d":"Gràcia","h":"Vallcarca i els Penitents","a":"Carrer d'August Font 2","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Este árbol está situado en plena calzada, sin alcorque y prácticamente pavimentado. Aunque hay otros ejemplares catalogados de Pinus pinea en el catálogo de la ciudad de Barcelona, la singularidad de este ejemplar reside en el porte y en una morfología muy equilibrada. El hecho de que un ejemplar de estas características, en medio de la calzada, haya sido capaz de sobrevivir al paso de los años a pesar de todo, es un valor del patrimonio arbóreo de la ciudad que habría que preservar.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Это дерево расположено прямо на проезжей части, без приствольной лунки и практически закатано в асфальт. Хотя в каталоге города Барселоны есть и другие внесённые экземпляры Pinus pinea, особенность этого экземпляра заключается в стати и очень уравновешенной морфологии. То, что экземпляр с такими характеристиками посреди проезжей части сумел, несмотря ни на что, пережить годы, — это ценность древесного наследия города, которую следовало бы сохранить.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0167-06-15","cy":"2015","by":"","cd":"17 m","tp":"2,2 m","ow":""},{"n":"Washingtònies de la plaça Lesseps","ne":"","sr":"Вашингтония крепкая","r":"вошингтония","nru":"Вашингтония крепкая площади Lesseps","s":"Washingtonia robusta","la":41.407406485987956,"ln":2.150593031968716,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610051232360022-06-93_1.optimized.f34ec045.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/washingtonies-de-la-placa-lesseps-99400454986","d":"Gràcia","h":"la Vila de Gràcia","a":"Carrer del Torrent de l'Olla 223","dr":"La washingtonia de México, originaria de la península de Baja California, es una de las palmeras más comunes en la ciudad. El conjunto catalogado lo forman tres ejemplares de porte estilizado y altura extraordinaria que se encuentran en el centro de la plaza de Lesseps. La singularidad de las palmeras se ve reforzada por la configuración topográfica tanto del barrio —en fuerte pendiente— como de los jardines modernos de la plaza, diseñados a modo de colina allanada sobre una red viaria semisubterránea.","drl":"Мексиканская вашингтония, родом с полуострова Нижняя Калифорния, — одна из самых распространённых пальм в городе. Внесённая в каталог группа состоит из трёх экземпляров стройной стати и исключительной высоты, расположенных в центре площади Лессепс. Своеобразие пальм усиливается топографической конфигурацией как района — с сильным уклоном, — так и современных садов площади, спроектированных в виде срезанного холма над полуподземной дорожной сетью.","drh":"Вашингтония крепкая — высокая пальма с веерными листьями. Родом из Мексики, часто встречается в средиземноморских городах.","cn":"0022-06-93","cy":"1993","by":"1913","cd":"6 m","tp":"1,8 m","ow":"Públic"},{"n":"Pins pinyers dels jardins de la Torre Girona","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.38908947796806,"ln":2.1162720615826323,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061044560068-04-94_1.optimized.2b5a9b73.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pins-pinyers-dels-jardins-de-la-torre-girona-99400454995","d":"Les Corts","h":"Pedralbes","a":"Carrer de Jordi Girona 31","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Estos dos ejemplares, de dimensiones notables, están en el viejo jardín de la Torre Girona, hoy Campus Norte de la Universidad Politécnica, rodeados de vegetación forestal.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Эти два экземпляра значительных размеров находятся в старом саду Торре-Герона, ныне Северного кампуса Политехнического университета, в окружении лесной растительности.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0068-04-94","cy":"1994","by":"1904","cd":"23 m","tp":"3,6 m","ow":"Privat"},{"n":"Pi pinyer de l'Orlandai","ne":"","sr":"Сосна пиния","r":"сосна","nru":"Сосна пиния","s":"Pinus pinea","la":41.39860248140557,"ln":2.1248810518516645,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061436250149-05-10_1.optimized.38cd10e9.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pi-pinyer-de-l-orlandai-99400454998","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Via Augusta 313","dr":"El pino piñonero se extiende por toda la región costera mediterránea y se caracteriza porque tiene semillas comestibles: los piñones. Este pino es uno de los pocos ejemplares que queda de lo que era el antiguo pueblo de Sarrià, después de la gran transformación que ha experimentado la zona. Actualmente está junto a la vía Augusta y la estación de ferrocarril de Sarrià.","drl":"Пиния распространена по всему средиземноморскому побережью и отличается съедобными семенами — кедровыми орешками. Эта сосна — один из немногих сохранившихся экземпляров от того, чем была старая деревня Сарриа, после великой трансформации, которую претерпела эта территория. В настоящее время она находится рядом с улицей Виа Аугуста и железнодорожной станцией Сарриа.","drh":"Сосна пиния — хвойное дерево с зонтиковидной кроной. Даёт съедобные семена — пинии (кедровые орешки). Классика итальянских и испанских пейзажей.","cn":"0149-05-10","cy":"2010","by":"1893","cd":"15 m","tp":"2,4 m","ow":"Públic"},{"n":"Palmera del Senegal de la plaça d'Urquinaona","ne":"","sr":"Финик отклонённый","r":"финиковая пальма","nru":"Финик отклонённый","s":"Phoenix reclinata","la":41.389485507127226,"ln":2.1733860306193233,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610141216530012-02-93_1.optimized.909e708d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmera-del-senegal-de-la-placa-d-urquinaona-99400455006","d":"Eixample","h":"la Dreta de l'Eixample","a":"Plaça d'Urquinaona 6","dr":"La palmera del Senegal es una especie tropical poco común que se caracteriza por la formación de muchos pies. Este ejemplar está en la céntrica plaza de Urquinaona y destaca su gran desarrollo, con once pies que superan los dos metros.","drl":"Сенегальская пальма — малораспространённый тропический вид, характеризующийся образованием множества стволов. Этот экземпляр находится на центральной площади Уркинаона, и выделяется его большое развитие: одиннадцать стволов, превышающих два метра.","drh":"Финик отклонённый — тропическая пальма с несколькими стволами, образует густые группы. Редкий гость в городских садах.","cn":"0012-02-93","cy":"1993","by":"1923","cd":"12 m","tp":"0,6 m","ow":"Públic"},{"n":"Freixe de fulla estreta del Jardí Botànic Històric","ne":"","sr":"Ясень узколистный","r":"ясень","nru":"Ясень узколистный","s":"Fraxinus angustifolia","la":41.366867511241765,"ln":2.1520840109714965,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041336470171-03-15_1.optimized.055071e8.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/freixe-de-fulla-estreta-del-jardi-botanic-historic-99400637941","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda dels Montanyans 30","dr":"El fresno de hoja pequeña es un árbol autóctono que crece de forma natural en los bosques de ribera. Este ejemplar, de notables dimensiones, crece en la parte más honda del Jardín Botánico Histórico, en la montaña de Montjuïc.","drl":"Мелколистный ясень — местное дерево, которое естественным образом растёт в приречных лесах. Этот экземпляр значительных размеров растёт в самой глубокой части Исторического ботанического сада на горе Монжуик.","drh":"Ясень узколистный — листопадное дерево с перистыми листьями. Растёт по берегам рек, ценится за упругую древесину.","cn":"0171-03-15","cy":"2015","by":"","cd":"15 m","tp":"2,5 m","ow":""},{"n":"Garrofer de Can Miralletes","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево","s":"Ceratonia siliqua","la":41.41426519749023,"ln":2.1785970770178253,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201910041332170172-10-16_1.optimized.b8722835.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-de-can-miralletes-99400637944","d":"Sant Martí","h":"el Camp de l'Arpa del Clot","a":"Carrer de Sant Antoni Maria Claret 310","dr":"El algarrobo es un árbol perennifolio propio de las zonas más templadas de la región Mediterránea. Situado en uno de los extremos de los jardines de Can Miralletes, el árbol está formado por un tronco bajo y grueso y una copa poco desarrollada, a causa de antiguas podas o roturas de ramas.","drl":"Рожковое дерево — вечнозелёное дерево, свойственное самым тёплым зонам Средиземноморского региона. Расположенное на одной из окраин садов Кан-Мираллетес, дерево состоит из низкого толстого ствола и слабо развитой кроны вследствие давней обрезки или обламывания ветвей.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0172-10-16","cy":"2016","by":"Per determinar","cd":"17 m","tp":"2,5","ow":""},{"n":"Eucaliptus blanc del parc del Castell de l'Oreneta","ne":"","sr":"Эвкалипт шаровидный","r":"эвкалипт","nru":"Эвкалипт шаровидный","s":"Eucalyptus globulus","la":41.39775547021642,"ln":2.111293053420787,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061101500124-05-97_1.optimized.e8d655a4.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-blanc-del-parc-del-castell-de-l-oreneta-99400455015","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer de Joan Orpí 16","dr":"El eucalipto azul es un árbol originario de Australia de crecimiento rápido que puede alcanzar los 35 m de altura. Situado en la esquina de uno de los miradores, este ejemplar ha crecido de forma espontánea en el parque del Castell de l’Oreneta y ha alcanzado unas dimensiones bastante espectaculares no exentas de un aspecto fantasmagórico.","drl":"Голубой эвкалипт — быстрорастущее дерево родом из Австралии, которое может достигать 35 м в высоту. Расположенный в углу одной из смотровых площадок, этот экземпляр вырос самосевом в парке замка Ореньета и достиг весьма впечатляющих размеров, не лишённых призрачного вида.","drh":"Эвкалипт шаровидный — высокое быстрорастущее дерево с корой, свисающей длинными полосами. Одно из самых высоких деревьев мира.","cn":"0124-05-97","cy":"1997","by":"1847","cd":"24 m","tp":"6 m","ow":"Públic"},{"n":"Eucaliptus blanc de la Vil·la Amèlia","ne":"","sr":"Эвкалипт шаровидный","r":"эвкалипт","nru":"Эвкалипт шаровидный","s":"Eucalyptus globulus","la":41.39293648465626,"ln":2.122676058418038,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061019420094-05-94_1.optimized.15d417d5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-blanc-de-la-villa-amelia-99400455016","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer de Santa Amèlia 2","dr":"El eucalipto azul es un árbol originario de Australia de crecimiento rápido que puede alcanzar los 35 m de altura. Este ejemplar ocupa la parte central de los jardines de la Vil·la Amèlia y tiene un tronco muy grueso. La copa presenta un estado muy alterado, debido a las roturas de ramas reiteradas que ha sufrido a lo largo de su vida.","drl":"Голубой эвкалипт — быстрорастущее дерево родом из Австралии, которое может достигать 35 м в высоту. Этот экземпляр занимает центральную часть садов Вилья-Амелия и имеет очень толстый ствол. Крона находится в сильно изменённом состоянии из-за неоднократных поломок ветвей, которые дерево претерпело в течение жизни.","drh":"Эвкалипт шаровидный — высокое быстрорастущее дерево с корой, свисающей длинными полосами. Одно из самых высоких деревьев мира.","cn":"0094-05-94","cy":"1994","by":"1904","cd":"19 m","tp":"5,2 m","ow":"Públic"},{"n":"Eucaliptus vermells del carrer Germans Serra","ne":"","sr":"Эвкалипт камальдульский","r":"эвкалипт","nru":"Эвкалипт камальдульский","s":"Eucalyptus camaldulensis","la":41.4177705067274,"ln":2.213430988524592,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111024140020-10-93_1.optimized.b8bbf93c.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-vermells-del-carrer-germans-serra-99400455017","d":"Sant Martí","h":"el Besòs i el Maresme","a":"Carrer dels Germans Serra 1","dr":"El eucalipto rojo es nativo de Australia y está ampliamente difundido por todo el mundo. Se encuentra, como otros ejemplares de características similares, en los jardines que hay entre la calle de los Germans Serra y la calle de Alfons el Magnànim.","drl":"Красный эвкалипт — уроженец Австралии и широко распространён по всему миру. Он находится, как и другие экземпляры со схожими характеристиками, в садах между улицей Жерманс-Серра и улицей Альфонса Великодушного.","drh":"Эвкалипт камальдульский — вечнозелёное дерево из Австралии с ароматными ланцетными листьями и отслаивающейся корой. Быстро растёт.","cn":"0020-10-93","cy":"1993","by":"1913","cd":"16 m","tp":"2,5 m","ow":"Públic"},{"n":"Eritrina dels jardins del Teatre Grec","ne":"","sr":"Эритрина серповидная","r":"эритрина","nru":"Эритрина серповидная садов Teatre Grec","s":"Erythrina falcata","la":41.36927950648894,"ln":2.1586020577425273,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061435140023-03-93_1.optimized.78cdcb9a.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eritrina-dels-jardins-del-teatre-grec-99400455020","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Passeig de Santa Madrona 30","dr":"El ceibo de monte es un árbol nativo de la cuenca del río Paraná, en América del Sur, que se caracteriza por su floración roja muy espectacular. Es uno de los pocos ejemplares que hay en los jardines de la ciudad y se encuentra en los emblemáticos jardines del Teatre Grec. Tiene un porte majestuoso, que se vuelve fastuoso en el momento de la floración. Es un ejemplar de interés tanto estético como botánico.","drl":"Горная сейба (эритрина) — дерево, произрастающее в бассейне реки Парана в Южной Америке, отличающееся очень эффектным красным цветением. Это один из немногих экземпляров в садах города, и находится он в символичных садах Греческого театра. Он имеет величественную стать, которая во время цветения становится роскошной. Это экземпляр, представляющий как эстетический, так и ботанический интерес.","drh":"Эритрина серповидная — тропическое дерево с красными цветами. Относится к бобовым.","cn":"0023-03-93","cy":"1993","by":"1923","cd":"20 m","tp":"2,7 m","ow":"Públic"},{"n":"Palmera blava de la plaça Pius XII","ne":"","sr":"Брагея вооружённая","r":"Brahea","nru":"Брагея вооружённая","s":"Brahea armata","la":41.38741448072492,"ln":2.1222170571254404,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061305300067-04-94_1.optimized.fe934517.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/palmera-blava-de-la-placa-pius-xii-99400455034","d":"Les Corts","h":"Pedralbes","a":"Plaça de Pius XII 6","dr":"La palmera azul es endémica de Baja California y México y se considera la palmera con las hojas más azuladas. Situada en un parterre de la plaza de Pius XII, en plena Diagonal, se considera una especie de crecimiento lento.","drl":"Голубая пальма — эндемик Нижней Калифорнии и Мексики и считается пальмой с наиболее голубоватыми листьями. Расположенная на клумбе площади Пия XII, прямо на Диагонали, она считается медленнорастущим видом.","drh":"Брагея вооружённая — пальма с сизоватыми веерными листьями из Мексики. Медленно растёт.","cn":"0067-04-94","cy":"1994","by":"1944","cd":"4 m","tp":"1,8 m","ow":"Públic"},{"n":"Arbre ampolla dels jardins de Torre Girona","ne":"","sr":"Брахихитон тополелистный","r":"брахихитон","nru":"Брахихитон тополелистный","s":"Brachychiton populneus","la":41.38889848394483,"ln":2.116035063949573,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610161511340065-04-94_11.optimized.7587abc5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/arbre-ampolla-dels-jardins-de-torre-girona-99400455035","d":"Les Corts","h":"Pedralbes","a":"Carrer de Jordi Girona 31","dr":"El pino carrasco es un árbol autóctono presente en toda el área mediterránea. Este ejemplar presenta dos grandes ramas que se abren a 2,50 metros del suelo, y una tercera rama está rota. Está en los jardines del Campus Norte de la Universidad Politécnica, que ha reconvertido el antiguo jardín de la Torre Girona.","drl":"Алеппская сосна — местное дерево, встречающееся по всей средиземноморской зоне. У этого экземпляра две большие ветви, расходящиеся на высоте 2,50 метра от земли, а третья ветвь сломана. Он находится в садах Северного кампуса Политехнического университета, который перестроил старый сад Торре-Герона.","drh":"Брахихитон тополелистный — австралийское дерево с бутылковидным стволом. Запасает воду в стволе.","cn":"0065-04-94","cy":"1994","by":"1904","cd":"20 m","tp":"2,5 m","ow":"Privat"},{"n":"Bellaombres dels jardins de Miramar","ne":"","sr":"Фитолакка (омбу)","r":"фитолакка (омбу)","nru":"Фитолакка (омбу) садов Miramar","s":"Phytolacca dioica","la":41.37071054444319,"ln":2.1719928440679417,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610061116320030-03-93_1.optimized.99ac4498.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/bellaombres-dels-jardins-de-miramar-99400455036","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carretera de Miramar 33","dr":"Este árbol, originario de las pampas de América del Sur, se caracteriza por un gran desarrollo en anchura, tanto de las raíces como de la copa. El conjunto está formado por una treintena de ejemplares dispuestos en dos filas paralelas en los jardines de Miramar.","drl":"Это дерево, родом из пампы Южной Америки, отличается большим развитием вширь, как корней, так и кроны. Группа состоит примерно из тридцати экземпляров, расположенных в два параллельных ряда в садах Мирамар.","drh":"Омбу — южноамериканское вечнозелёное дерево с мощным стволом и мочковатой корневой системой; «благородное тень дающее дерево».","cn":"0030-03-93","cy":"1993","by":"1923","cd":"14 m","tp":"2.8 m","ow":"Públic"},{"n":"Plàtans dels jardins de Can Farrero","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный садов Can Farrero","s":"Platanus x acerifolia","la":41.358442503963296,"ln":2.1418860658119905,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610270906110100-03-94_1_Platanus-hispanica.optimized.eb2ea686.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-dels-jardins-de-can-farrero-99400454965","d":"Sants-Montjuïc","h":"la Marina de Port","a":"Carrer dels Alts Forns 74","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. El conjunto catalogado está integrado por dos pies de washingtonias de más de veinte metros que contrastan con una doble hilera de plátanos centenarios, con una bóveda de cañón de 1,75 m. El conjunto se enmarca en el entorno de la Casa del Rellotge y forma parte de los jardines de Can Farrero.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Внесённая в каталог группа включает два ствола вашингтоний высотой более двадцати метров, которые контрастируют с двойным рядом столетних платанов со сводом цилиндрической формы в 1,75 м. Группа вписана в окружение Каса-дель-Рельотж и является частью садов Кан-Фаррер.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0100-03-94","cy":"1994","by":"1894","cd":"15 m","tp":"1,8 m","ow":"Públic"},{"n":"Plàtans del carrer Pere IV","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный улицы Pere IV","s":"Platanus x acerifolia","la":41.41819704269932,"ln":2.2094868055186665,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610111036350008-10-93_1.optimized.95413a6d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-del-carrer-pere-iv-99400454966","d":"Sant Martí","h":"Provençals del Poblenou","a":"Carrer de Pere IV 511","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. En este caso, se trata de un conjunto de cuatro árboles con un gran diámetro, supervivientes de una vieja alineación que había a ambos lados de la antigua carretera de Mataró, hoy día calle de Pere IV.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. В данном случае это группа из четырёх деревьев большого диаметра — уцелевших остатков старой аллеи, которая тянулась по обе стороны старой дороги на Матаро, ныне улицы Пере IV.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0008-10-93","cy":"1993","by":"1903","cd":"16 m","tp":"3,5 m","ow":"Públic"},{"n":"Plàtans de la plaça Nadal","ne":"","sr":"Платан клёнолистный","r":"платан","nru":"Платан клёнолистный площади Nadal","s":"Platanus x acerifolia","la":41.42889249151966,"ln":2.188582993639656,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610110943380034-09-93_1.optimized.d7d78fea.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/platans-de-la-placa-nadal-99400454969","d":"Sant Andreu","h":"Sant Andreu","a":"Plaça de Nadal 7","dr":"El plátano oriental es uno de los árboles más utilizados en el medio urbano en el sur de Europa. Destaca su carácter de adaptación a las condiciones adversas de la ciudad: contaminación, podas, sustratos deficientes, etc. Este conjunto de ejemplares está en la plaza de Nadal. Este espacio se enmarca en un barrio de calles estrechas, todavía hoy flanqueadas mayoritariamente por casitas bajas, muy sencillas, con un cariz de intimidad y acogimiento, como hechas a la medida del hombre. Son la imagen de una época pasada. En la plaza de Nadal encontramos los ejemplares más bellos.","drl":"Платан восточный — одно из самых используемых деревьев в городской среде на юге Европы. Его отличает способность приспосабливаться к неблагоприятным условиям города: загрязнению воздуха, обрезке, бедным почвам и т. д. Эта группа экземпляров находится на площади Надаль. Это пространство расположено в районе узких улиц, по-прежнему по большей части окаймлённых невысокими, очень простыми домиками с оттенком интимности и радушия, словно сделанными по мерке человека. Они — образ ушедшей эпохи. На площади Надаль мы находим самые красивые экземпляры.","drh":"Род платановых — крупные листопадные деревья с характерной пятнистой корой. Ценятся в городе за широкую крону, устойчивость к загрязнению воздуха и обрезке.","cn":"0034-09-93","cy":"1993","by":"1903","cd":"20 m","tp":"2,7 m","ow":"Públic"},{"n":"Xiprers calbs del Parc de la Ciutadella","ne":"","sr":"Таксодиум двурядный","r":"болотный кипарис","nru":"Таксодиум двурядный","s":"Taxodium distichum","la":41.38799584040063,"ln":2.1870327286041795,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/201610201015190046-01-93_1.optimized.16284277.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xiprers-calbs-del-parc-de-la-ciutadella-99400454974","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Passeig de Pujades 16","dr":"El ciprés de los pantanos es una especie de conífera originaria de las zonas lacustres del sureste de los Estados Unidos. De este árbol destacan dos peculiaridades: es caducifolio, cosa poco común entre coníferas, y está plenamente adaptado a los medios acuáticos (sus raíces sobresalen del agua para obtener oxígeno). El conjunto está formado por siete ejemplares de diferentes tamaños, situados dentro del estanque del parque de la Ciutadella.","drl":"Болотный кипарис — вид хвойных, родом из озёрных районов юго-востока Соединённых Штатов. У этого дерева выделяются две особенности: оно листопадное, что нечасто встречается среди хвойных, и полностью приспособлено к водной среде (его корни выступают из воды, чтобы получать кислород). Группа состо

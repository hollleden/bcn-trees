"0220-03-21","cy":"2021","by":"1946","cd":"3 m","tp":"1 m","ow":""},{"n":"Garrofer del parc del Castell de l'Oreneta","ne":"","sr":"Рожковое дерево","r":"рожковое дерево","nru":"Рожковое дерево парка Castell de l'Oreneta","s":"Ceratonia siliqua","la":41.39911173121255,"ln":2.110637495324842,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0221-05-21.optimized.5eaeb780.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/garrofer-del-parc-del-castell-de-l-oreneta-99400728983","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Parc del Castell de l'Oreneta 44572","dr":"La singularidad de este ejemplar radica en los tres pies que presenta, con una copa de 20 m que supera las de los ejemplares de la calle Maignon y de los Jardines de Can Miralletes, ambas de 17 m.","drl":"Особенность этого экземпляра заключается в трёх стволах, которые он имеет, с кроной в 20 м, превосходящей кроны экземпляров на улице Майньон и в садах Кан-Мираллетес, по 17 м у обоих.","drh":"Рожковое дерево (кароб) — вечнозелёное средиземноморское дерево. Плоды-рожки используют как сладость и корм для скота.","cn":"0221-05-21","cy":"2021","by":"Per determinar","cd":"20 m","tp":"122 m","ow":""},{"n":"Xicrandes dels Jardins de Miramar","ne":"","sr":"Жакаранда мимозолистная","r":"жакаранда","nru":"Жакаранда мимозолистная садов Miramar","s":"Jacaranda mimosifolia","la":41.370890646196486,"ln":2.171913209736561,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0216-03-21.optimized.50231f45.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/xicrandes-dels-jardins-de-miramar-99400728977","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carretera de Miramar 33","dr":"Estas dos jacarandás forman parte del primer grupo de ejemplares que se plantaron en Barcelona, introducidas por Jean Claude Nicolas Forestier y Nicolau Maria Rubió i Tudurí. En estos momentos son las dos de mayor calibre de Barcelona.","drl":"Эти две жакаранды входят в первую группу экземпляров, посаженных в Барселоне, введённых Жаном-Клодом Николя Форестье и Николау Мария Рубио-и-Тудури. В настоящее время они — две жакаранды с наибольшим калибром в Барселоне.","drh":"Жакаранда мимозолистная — декоративное дерево из Южной Америки с перистыми листьями и густыми синими цветами. Цветёт в конце весны.","cn":"0216-03-21","cy":"2021","by":"1904","cd":"9 m","tp":"2,3 m","ow":""},{"n":"Figuera de l'Antiga Colònia Castells","ne":"","sr":"Инжир","r":"фикус","nru":"Инжир","s":"Ficus carica","la":41.386893977272635,"ln":2.139932136323441,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0214-04-21.optimized.1df5e860.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/figuera-de-l-antiga-colonia-castells-99400728974","d":"Les Corts","h":"les Corts","a":"Carrer d'Entença 239","dr":"El solar donde se ubica la higuera es donde antiguamente estaba la Colonia Castells. Esta empezó a construirse en 1923 a las afueras del barrio de Les Corts. Acogía a las familias obreras, mayoritariamente procedentes del sur de España, que trabajaban en la fábrica de barnices y charoles Castells.","drl":"Участок, на котором находится инжир, — это место, где в прошлом была Колония Кастельс. Её начали строить в 1923 году на окраине района Кортс. Она принимала рабочие семьи, в основном выходцев с юга Испании, которые работали на фабрике лаков и лакированной кожи «Кастельс».","drh":"Инжир — листопадное дерево с пальчатыми листьями и сладкими плодами. Одно из древнейших культурных растений Средиземноморья.","cn":"0214-04-21","cy":"2021","by":"Per determinar","cd":"9 m","tp":"2.5 m","ow":""},{"n":"Lledoner dels jardins dels Drets Humans","ne":"","sr":"Каркас южный","r":"каркас","nru":"Каркас южный садов Drets Humans","s":"Celtis australis","la":41.36006941270823,"ln":2.1372499686798063,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0224-03-22.optimized.120810f5.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/lledoner-dels-jardins-dels-drets-humans-99400728989","d":"Sants-Montjuïc","h":"la Marina de Port","a":"Carrer de la Foneria 19","dr":"El jardín se encuentra en el interior de una manzana de forma rectangular, donde antiguamente había una fábrica de lámparas de la marca Philips. Este espacio estaba destinado a zona de esparcimiento para los trabajadores de la fábrica, y como tal fue diseñado en 1960 por la paisajista holandesa Van der Harst, esposa del director de la fábrica. En 2007 fue abierto al público tras una rehabilitación efectuada por el arquitecto municipal Jaume Graells, con ayuda del paisajista Nuno Almeida y del ingeniero Marc de Jaime, en la que cabe destacar el trabajo en torno a la rehabilitación del lago existente y la utilización de técnicas de drenaje sostenible. El almez catalogado se encuentra en uno de los parterres del jardín, y destaca por su gran copa homogénea.","drl":"Сад находится внутри квартала прямоугольной формы, где в прошлом была фабрика ламп марки «Филипс». Это пространство предназначалось для отдыха рабочих фабрики, и как таковое оно было спроектировано в 1960 году голландским ландшафтным архитектором Ван дер Харст, женой директора фабрики. В 2007 году оно было открыто для публики после реставрации, проведённой муниципальным архитектором Жауме Грайельсом при содействии ландшафтного архитектора Нуну Алмейды и инженера Марка де Хайме, в которой следует отметить работу по восстановлению существующего озера и использование методов устойчивого дренажа. Внесённый в каталог каркас находится на одной из клумб сада и выделяется своей большой однородной кроной.","drh":"Каркас (вязолистник) — листопадное дерево с асимметричными листьями и мелкими тёмными плодами. Засухоустойчив, хорошо переносит городские условия.","cn":"0224-03-22","cy":"2022","by":"Per determinar","cd":"20 m","tp":"2.9 m","ow":"Públic"},{"n":"Eritrina dels jardins Mossèn Costa i Llobera","ne":"","sr":"Эритрина каффрская","r":"эритрина","nru":"Эритрина каффрская садов Mossèn Costa i Llobera","s":"Erythrina caffra","la":41.36957592862495,"ln":2.1723144875077516,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0226-03-22.optimized.b5d52b02.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eritrina-dels-jardins-mossen-costa-i-llobera-99400728992","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carretera de Miramar 38","dr":"Los jardines de Mossèn Costa i Llobera son uno de los más importantes de Europa por lo que respecta a su colección de cactus y plantas suculentas. Los jardines, orientados al mar y al abrigo de la montaña de Montjuïc, surgen como proyecto conjunto del arquitecto Joaquim Maria Casamor y del maestro de la escuela de jardinería, técnico y especialista en plantas crasas, Joan Pañella. En una superficie de poco más de 3 hectáreas, los jardines nos ofrecen una colección única en el mundo de especies crasas y exóticas del planeta, propias de zonas subdesérticas, desérticas y tropicales, pero también de zonas de alta montaña. El árbol del coral de Sudáfrica es probablemente uno de los ejemplares más grandes de Barcelona.","drl":"Сады Мосена Косты-и-Льоберы — одни из самых важных в Европе по своей коллекции кактусов и суккулентов. Сады, обращённые к морю и укрытые горой Монжуик, возникли как совместный проект архитектора Жоакима Марии Касамора и преподавателя школы садоводства, техника и специалиста по суккулентам Жоана Паньельи. На площади чуть более 3 гектаров сады предлагают нам уникальную в мире коллекцию суккулентных и экзотических видов планеты, свойственных полупустынным, пустынным и тропическим зонам, но также и высокогорным. Коралловое дерево из Южной Африки — вероятно, один из самых крупных экземпляров в Барселоне.","drh":"Эритрина каффрская — южноафриканский вид с оранжево-красными цветами. Символ города Лос-Анджелес.","cn":"0226-03-22","cy":"2022","by":"","cd":"20 m","tp":"3 m","ow":"Públic"},{"n":"Figuera dels Jardins Blanca Selva i Henry","ne":"","sr":"Инжир","r":"фикус","nru":"Инжир садов Blanca Selva i Henry","s":"Ficus carica","la":41.39175793002039,"ln":2.1314940380438077,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0229-05-23.optimized.f3f070e2.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/figuera-dels-jardins-blanca-selva-i-henry-99400729000","d":"Les Corts","h":"les Corts","a":"Jardins de Blanca Selva i Henry 0","dr":"La higuera catalogada se ubica en el sector sur de los jardines Blanca Selva i Henry. Los jardines Blanca Selva i Henry son unos jardines de forma rectangular, limitados por tres bloques de edificios en tres de sus lados y por la calle Numància en el lado oeste. El ejemplar es un testimonio del arbolado propio de las zonas semirrurales situadas antes de la actual urbanización.","drl":"Внесённый в каталог инжир расположен в южном секторе садов Бланка-Сельва-и-Анри. Сады Бланка-Сельва-и-Анри — сады прямоугольной формы, ограниченные тремя блоками зданий с трёх сторон и улицей Нумансия с западной стороны. Экземпляр является свидетелем древесной растительности, свойственной полусельским зонам, существовавшим до нынешней застройки.","drh":"Инжир — листопадное дерево с пальчатыми листьями и сладкими плодами. Одно из древнейших культурных растений Средиземноморья.","cn":"0229-04-23","cy":"2023","by":"Per determinar","cd":"12 m","tp":"14 m","ow":""},{"n":"Taronger de Louisiana de la Ciutadella","ne":"","sr":"Маклюра оранжевая","r":"Maclura","nru":"Маклюра оранжевая","s":"Maclura pomifera","la":41.38856945260174,"ln":2.1876221146807056,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Taronger_de_Louisiana_de_la_Ciutadella.optimized.fe1ef9af.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/taronger-de-louisiana-de-la-ciutadella-99400679805","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 1210","dr":"Árbol caducifolio originario del sureste de los Estados Unidos. Destacan sus ramas espinosas y los grandes frutos esféricos del tamaño de una naranja. El árbol, de copa bien equilibrada, se sitúa junto al estanque del parque de la Ciutadella.","drl":"Листопадное дерево родом с юго-востока Соединённых Штатов. Выделяются его колючие ветви и крупные сферические плоды размером с апельсин. Дерево с хорошо уравновешенной кроной расположено рядом с прудом парка Сьютаделья.","drh":"Маклюра оранжевая — североамериканское дерево с колючими ветками и крупными плодами, похожими на апельсины. Несъедобны, но отпугивают насекомых.","cn":"0039-01-93","cy":"1993","by":"1913","cd":"19 m","tp":"2,6 m","ow":""},{"n":"Roure martinenc del parc Zoològic","ne":"","sr":"Дуб пушистый","r":"дуб","nru":"Дуб пушистый","s":"Quercus pubescens","la":41.385213737930975,"ln":2.187187909449018,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Roure_martinenc_del_parc_Zoologic.optimized.69f3b11d.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/roure-martinenc-del-parc-zoologic-99400679813","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Parc de la Ciutadella 1210","dr":"El roble pubescente es una especie propia de los bosques submediterráneos. En las partes más sombrías de Collserola encontramos alguna población. El ejemplar se encuentra dentro del histórico zoo de Barcelona, testimonio de la época de construcción del Parque de la Ciutadella. Tiene una copa grandiosa y se encuentra en muy buenas condiciones, aunque el tronco está inclinado.","drl":"Пушистый дуб — вид, свойственный субсредиземноморским лесам. В самых тенистых частях Кольсеролы мы встречаем некоторые его популяции. Экземпляр расположен внутри исторического зоопарка Барселоны, свидетеля эпохи строительства парка Сьютаделья. У него величественная крона, и он находится в очень хорошем состоянии, хотя ствол наклонён.","drh":"Дуб пушистый — листопадное дерево из субсредиземноморских лесов. Молодые листья и побеги покрыты мягким пушком.","cn":"0183-01-18","cy":"2018","by":"1881","cd":"10 m","tp":"2,7 m","ow":"Privat"},{"n":"Ficus de Port Jackson de l'Edifici IBM","ne":"","sr":"Фикус ржавый","r":"фикус","nru":"Фикус ржавый","s":"Ficus rubiginosa","la":41.398010131750816,"ln":2.1396419941485063,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Ficus_de_Port_Jackson_de_la_Via_Augusta.optimized.be27bcde.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/ficus-de-port-jackson-de-l-edifici-ibm-99400680087","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - Galvany","a":"Via Augusta 202","dr":"Forma parte de un jardín que bordea todo el edificio de la Via Augusta, salvando un desnivel mediante un talud de césped. Tenemos gran cantidad de árboles, de los que destacan un ejemplar de eritrina (Erythrina crista-galli), una jacarandá (Jacaranda mimosifolia) y varios pies de pinos canarios (Pinus canariensis). El interés del ejemplar radica en la presencia de un ficus poco común en las calles de Barcelona, así como en la peculiaridad de su estructura.","drl":"Является частью сада, окаймляющего всё здание на Виа Аугуста и преодолевающего перепад высот посредством газонного откоса. Здесь большое количество деревьев, среди которых выделяются экземпляр эритрины (Erythrina crista-galli), жакаранда (Jacaranda mimosifolia) и несколько канарских сосен (Pinus canariensis). Интерес экземпляра заключается в присутствии фикуса, малораспространённого на улицах Барселоны, а также в своеобразии его структуры.","drh":"Фикус ржавый — крупное дерево из Австралии с мощной кроной и опушёнными снизу листьями. Используется как тенистое дерево в парках.","cn":"0207-05-20","cy":"2021","by":"Per determinar","cd":"19 m","tp":"15 m","ow":""},{"n":"Fotínia del jardins de Sentmenat","ne":"","sr":"Фотиния пильчатолистная","r":"Photinia","nru":"Фотиния пильчатолистная садов Sentmenat","s":"Photinia serratifolia","la":41.40247191765548,"ln":2.1146952986652736,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Fotinia_del_jardins_de_Sentmenat.optimized.6f658eba.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/fotinia-del-jardins-de-sentmenat-99400680088","d":"Sarrià-Sant Gervasi","h":"Sarrià","a":"Carrer del Desert 6","dr":"Los jardines de Can Sentmenat se encuentran en el distrito de Sarrià-Sant Gervasi de Barcelona. Su origen lo encontramos en la construcción, en 1779, del Palacio de los Marqueses de Sentmenat. Actualmente acoge el centro universitario EINA. Los jardines se restauraron y abrieron al público en 1995. La fotinia se ubica en el paseo de las Estatuas. El ejemplar de esta especie es posiblemente uno de los más grandes y viejos de Barcelona. El interés también se incrementa por su situación en un jardín histórico tan bello como el de Can Sentmenat. Cabe recalcar que Photinia serratifolia es una especie muy ligada a la creación de los jardines históricos.","drl":"Сады Кан-Сентменат находятся в районе Сарриа-Сант-Жерваси в Барселоне. Их происхождение восходит к строительству в 1779 году дворца маркизов Сентменат. В настоящее время в нём размещается университетский центр EINA. Сады были отреставрированы и открыты для публики в 1995 году. Фотиния расположена на аллее Статуй. Экземпляр этого вида, возможно, один из самых крупных и старых в Барселоне. Интерес также возрастает из-за его расположения в столь красивом историческом саду, как Кан-Сентменат. Следует подчеркнуть, что Photinia serratifolia — вид, тесно связанный с созданием исторических садов.","drh":"Фотиния пильчатолистная — вечнозелёное дерево родом из Китая. Молодые листья красноватые, взрослые — тёмно-зелёные.","cn":"0202-05-20","cy":"2020","by":"1930","cd":"8 m","tp":"2,7 m","ow":""},{"n":"Araucària Columnar de la Clínica Sagrada Família","ne":"","sr":"Араукария колонновидная","r":"араукария","nru":"Араукария колонновидная","s":"Araucaria columnaris","la":41.40070135158107,"ln":2.1348000441882036,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/99400661152-araucariafamilia.JPG","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-columnar-de-la-clinica-sagrada-familia-99400661152","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Carrer de Torras i Pujalt 1","dr":"La araucaria columnar es una especie endémica de Nueva Caledonia (este de Australia). Vive en zonas costeras y puede adaptarse a climas de templados a cálidos. Es un tipo de araucaria parecido a la de pisos (A. heterophylla), pero mucho menos común. En Barcelona no encontramos ningún ejemplar en zona pública. De hecho, este es el único ejemplar detectado en zona privada.","drl":"Колоннообразная араукария — эндемичный вид Новой Каледонии (восток Австралии). Она живёт в прибрежных зонах и может приспосабливаться к климатам от умеренных до тёплых. Это тип араукарии, схожий с разнолистной (A. heterophylla), но гораздо менее распространённый. В Барселоне мы не находим ни одного экземпляра в общественной зоне. Более того, это единственный обнаруженный экземпляр в частной зоне.","drh":"Араукария колонновидная — узкое колонновидное дерево из Новой Каледонии. Похожа на араукарию разнолистную, но встречается реже.","cn":"0186-05-19","cy":"2019","by":"1948","cd":"6 m","tp":"1,5 m","ow":"privada"},{"n":"Figuera de l'Antic Teatre","ne":"","sr":"Инжир","r":"фикус","nru":"Инжир","s":"Ficus carica","la":41.38714390844984,"ln":2.1759024242208618,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0215-01-21.optimized.289a1858.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/figuera-de-l-antic-teatre-99400728976","d":"Ciutat Vella","h":"Sant Pere, Santa Caterina i la Ribera","a":"Carrer de Verdaguer i Callís 12","dr":"La higuera está situada en la parte central del patio al que se accede bajando unas escaleras. El Antic Teatre se encuentra en un edificio privilegiado del barrio de Sant Pere, Santa Caterina y la Ribera, muy cerca del Palau de la Música, y cuenta con diferentes salas y un magnífico jardín convertido en terraza que es punto de reunión para vecinos, estudiantes y artistas. La higuera del Antic Teatre destaca por su situación en un patio histórico en el barrio de Sant Pere, el árbol se configura de forma armoniosa en el entorno y el edificio donde se ubica tiene un carácter de uso social destacado.","drl":"Инжир расположен в центральной части двора, куда попадают, спустившись по нескольким ступеням. Антик-Театре находится в привилегированном здании района Сант-Пере, Санта-Катерина и Рибера, совсем рядом с Дворцом каталонской музыки, и имеет различные залы и великолепный сад, превращённый в террасу, которая является местом встречи для соседей, студентов и художников. Инжир Антик-Театре выделяется своим расположением в историческом дворе в районе Сант-Пере; дерево гармонично вписано в окружение, а здание, в котором оно находится, имеет выдающийся характер социального использования.","drh":"Инжир — листопадное дерево с пальчатыми листьями и сладкими плодами. Одно из древнейших культурных растений Средиземноморья.","cn":"0215-01-21","cy":"2021","by":"Per determinar","cd":"6 m","tp":"1.8 m","ow":""},{"n":"Araucària de l'avinguda Francesc Ferrer i Guàrdia","ne":"","sr":"Араукария разнолистная","r":"араукария","nru":"Араукария разнолистная","s":"Araucaria heterophylla","la":41.36966043273172,"ln":2.1487269980118926,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/0223-03-22.optimized.5d2edb42.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-de-l-avinguda-francesc-ferrer-i-guardia-99400728987","d":"Sants-Montjuïc","h":"la Font de la Guatlla","a":"Avinguda de Francesc Ferrer i Guàrdia 12","dr":"Esta araucaria de Norfolk presenta unas dimensiones notables, siendo el ejemplar de Barcelona con el mayor perímetro de tronco. Históricamente está ligada a la escuela de jardinería Rubió i Tudurí, que estuvo ubicada durante muchos años en el edificio que tiene delante. Su plantación data de principios de la década de los años cincuenta, y su presencia ha marcado a una serie de generaciones de jardineros y jardineras. Actualmente, el edificio alberga el instituto del deporte de Barcelona, centro público de Formación Profesional.","drl":"Эта норфолкская араукария имеет заметные размеры, будучи экземпляром Барселоны с наибольшим обхватом ствола. Исторически она связана со школой садоводства Рубио-и-Тудури, которая много лет находилась в здании напротив. Её посадка относится к началу пятидесятых годов, её присутствие отметило целый ряд поколений садовников. В настоящее время в здании размещается Институт спорта Барселоны, государственный центр профессионального образования.","drh":"Араукария разнолистная — хвойное дерево с симметричной пирамидальной кроной. Символ острова Норфолк.","cn":"0223-03-22","cy":"2022","by":"1920","cd":"14 m","tp":"2 m","ow":""},{"n":"Mèlia del carrer Formiga","ne":"","sr":"Мелия азедарах","r":"мелия","nru":"Мелия азедарах улицы Formiga","s":"Melia azedarach","la":41.43459559479799,"ln":2.2019932584049,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Melia_del_carrer_Formiga.optimized.64555864.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/melia-del-carrer-formiga-99400680103","d":"Sant Andreu","h":"el Bon Pastor","a":"Carrer de la Formiga 17","dr":"La melia está ubicada en un alcorque circular de un metro de diámetro, en una acera muy amplia de la calle Formiga. Se trata, pues, de una especie muy abundante en las calles, parques y jardines de Barcelona. A pesar de esta abundancia, este es el único ejemplar incluido en el Catálogo. En este caso, sería el ejemplar con el perímetro más grande de la ciudad de Barcelona.","drl":"Мелия расположена в круглой приствольной лунке диаметром один метр, на очень широком тротуаре улицы Формига. Это вид, очень распространённый на улицах, в парках и садах Барселоны. Несмотря на эту распространённость, это единственный экземпляр, внесённый в Каталог. В данном случае это был бы экземпляр с наибольшим обхватом в городе Барселоне.","drh":"Мелия азедарах (персидская сирень) — дерево с перистыми листьями и сиреневатыми цветами. Быстро растёт, но недолговечна.","cn":"0203-09-20","cy":"2020","by":"","cd":"13 m","tp":"2,2 m","ow":""},{"n":"Eucaliptus tuart del jardí d'Aclimatació","ne":"","sr":"Эвкалипт туарт","r":"эвкалипт","nru":"Эвкалипт туарт","s":"Eucalyptus gomphocephala","la":41.36587532679686,"ln":2.153570433914124,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Eucaliptus_tuart_del_jardi_dAclimatacio.optimized.2b384414.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/eucaliptus-tuart-del-jardi-d-aclimatacio-99400680095","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Avinguda de l'Estadi 42","dr":"El jardín de Aclimatación fue creado en 1930 por Rubió i Tudurí, al año siguiente de la Exposición Internacional de Barcelona de 1929, en el terreno donde se habían situado los pabellones de Italia y Suecia. Su objetivo era el de crear una zona de especial protección para la aclimatación de especies foráneas. El núcleo principal fueron especies de los cinco continentes que se llevaron para la exposición, y que más tarde se fueron ampliando hasta 1937, fecha en que la Guerra Civil interrumpió los trabajos. Posteriormente, en 1945, el arquitecto Lluís Riudor y el botánico Joan Pañella retomaron los trabajos de plantación, que se prolongaron hasta los años 1980. Este jardín alberga alrededor de 230 especies de plantas, algunas de ellas únicas o de escasa presencia en la ciudad. El eucalipto tuart es una especie originaria del suroeste de Australia y se caracteriza por su corteza rugosa. Es una especie de eucalipto muy poco utilizada en jardinería en nuestro país. El ejemplar del jardín de Aclimatación goza de un buen estado de conservación y destaca por sus dimensiones: un gran perímetro y altura. Aunque no tenemos datos, podría ser de los ejemplares más grandes de Cataluña. El ejemplar también es uno de los árboles más grandes del jardín de Aclimatación y es visible desde gran parte de los alrededores.","drl":"Сад Аклиматасьо был создан в 1930 году Рубио-и-Тудури, на следующий год после Международной выставки в Барселоне 1929 года, на земле, где располагались павильоны Италии и Швеции. Его целью было создание зоны особой защиты для акклиматизации чужеродных видов. Основное ядро составляли виды с пяти континентов, привезённые для выставки, и позднее оно расширялось до 1937 года, когда Гражданская война прервала работы. Затем, в 1945 году, архитектор Лльюис Риудор и ботаник Жоан Паньелья возобновили посадочные работы, которые продолжались до 1980-х годов. В этом саду насчитывается около 230 видов растений, некоторые из них уникальны или малочисленны в городе. Эвкалипт туарт — вид родом с юго-запада Австралии, отличающийся шероховатой корой. Это вид эвкалипта, очень мало используемый в садоводстве в нашей стране. Экземпляр в саду Аклиматасьо находится в хорошем состоянии сохранности и выделяется своими размерами: большим обхватом и высотой. Хотя у нас нет данных, он мог бы быть одним из самых крупных экземпляров в Каталонии. Экземпляр также является одним из самых больших деревьев сада Аклиматасьо и виден из большей части окрестностей.","drh":"Эвкалипт туарт — крупный эвкалипт из Западной Австралии с шероховатой корой. Редко встречается в европейских городах.","cn":"0201-03-20","cy":"2020","by":"Per determinar","cd":"28 m","tp":"3,8 m","ow":""},{"n":"Pebrer bord del carrer Maignon","ne":"","sr":"Шинус мягкий","r":"шинус","nru":"Шинус мягкий","s":"Schinus molle","la":41.41023316885091,"ln":2.152881283257778,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Pebrer_bord_del_carrer_Maignon.optimized.e9b2ee61.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/pebrer-bord-del-carrer-maignon-99400680097","d":"Gràcia","h":"la Salut","a":"Carrer de Maignon 27","dr":"El falso pimentero se sitúa en una finca particular de unos 8.600 m2, 650 m2 de los cuales están ocupados por un edificio central con diferentes viviendas. Actualmente la finca tiene un uso de alquiler temporal. La mayor parte de la finca está constituida por un jardín con gran diversidad arbórea. Se trata de un jardín funcional, que no destaca por las características históricas o estéticas, pero sí por los ejemplares arbóreos: algarrobos (Ceratonia siliqua), aligustres (Ligustrum lucidum) y pitósporos (Pittosporum tobira), entre otros. De este conjunto, destaca un falso pimentero situado entre el edificio principal y el aparcamiento. En la finca existen varios falsos pimenteros, pero este se caracteriza por tener un perímetro fuera de lo común.","drl":"Ложное перечное дерево расположено в частном владении площадью около 8 600 м², из которых 650 м² заняты центральным зданием с различными квартирами. В настоящее время участок используется для краткосрочной аренды. Большую часть участка составляет сад с большим разнообразием деревьев. Это функциональный сад, не выделяющийся историческими или эстетическими характеристиками, но выделяющийся древесными экземплярами: рожковые деревья (Ceratonia siliqua), бирючина блестящая (Ligustrum lucidum) и питоспорумы (Pittosporum tobira), среди прочих. Из этой совокупности выделяется ложное перечное дерево, расположенное между главным зданием и парковкой. На участке есть несколько ложных перечных деревьев, но это отличается необычным обхватом.","drh":"Шинус мягкий (перуанский перец) — вечнозелёное дерево с плакучей кроной и розовыми ягодами. Родом из Южной Америки.","cn":"0211-06-20","cy":"2021","by":"Per determinar","cd":"12 m","tp":"4,34 m","ow":""},{"n":"Melaleuca dels jardins de Petra Kelly","ne":"","sr":"Мелалеука браслетчатая","r":"Melaleuca","nru":"Мелалеука браслетчатая садов Petra Kelly","s":"Melaleuca armillaris","la":41.36522950939997,"ln":2.1617564417606308,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Melaleuca_dels_jardins_de_Petra_Kelly.optimized.edbb7ebf.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/melaleuca-dels-jardins-de-petra-kelly-99400680104","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Carrer del Doctor Font i Quer 10","dr":"El Vivero Tres Pins recibe este nombre por tres pinos piñoneros muy viejos que había en la zona de la montaña de Montjuïc donde ahora está el actual vivero municipal. Alrededor de los años 20 se creó allí un espacio destinado a proveer a Barcelona de plantas para la Exposición Universal de 1929. Posteriormente se convirtió en el primer vivero municipal dedicado a la producción de planta destinada a las zonas verdes de la ciudad, y actualmente es el único que queda en Barcelona. Dentro de este recinto está el Jardín de Petra Kelly (ecologista alemana fundadora del Partido Verde alemán), inaugurado en 1993. Como recuerdo, hay una pequeña bola de terracota con una figura femenina abrazándola. Justo delante hay un pequeño monolito de piedra dedicado al escultor Joseph Beuys, alemán que incorporó los principios de la ecología a su obra. Se trata de un recinto modesto con unos cuantos ejemplares arbóreos, de los cuales destaca la melaleuca. El ejemplar se sitúa en una jardinera, junto a las escaleras de acceso al jardín.","drl":"Питомник Трес-Пинс получил это название по трём очень старым пиниям, которые были в зоне горы Монжуик, где сейчас находится нынешний муниципальный питомник. Примерно в 20-х годах там было создано пространство, предназначенное для снабжения Барселоны растениями для Всемирной выставки 1929 года. Позднее он стал первым муниципальным питомником, занимавшимся производством растений для зелёных зон города, и в настоящее время является единственным оставшимся в Барселоне. Внутри этой территории находится Сад Петры Келли (немецкой экологистки, основательницы Партии зелёных Германии), открытый в 1993 году. В память о ней там находится небольшой терракотовый шар с женской фигурой, обнимающей его. Прямо напротив находится небольшой каменный монолит, посвящённый скульптору Йозефу Бойсу, немцу, внёсшему принципы экологии в своё творчество. Это скромная территория с несколькими древесными экземплярами, среди которых выделяется мелалеука. Экземпляр расположен в кашпо рядом с лестницей, ведущей в сад.","drh":"Мелалеука браслетчатая — вечнозелёное дерево из Австралии с ароматными листьями и пушистыми белыми цветами.","cn":"0196-03-19","cy":"2019","by":"","cd":"8 m","tp":"1,88 m","ow":""},{"n":"Tarongers de Louisiana dels jardins de la Torre Girona","ne":"","sr":"Маклюра оранжевая","r":"Maclura","nru":"Маклюра оранжевая","s":"Maclura pomifera","la":41.388940406668134,"ln":2.1165329711269645,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/Tarongers_de_Louisiana_dels_jardins_de_la_Torre_Girona.optimized.56ee2b3b.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tarongers-de-louisiana-dels-jardins-de-la-torre-girona-99400680106","d":"Les Corts","h":"Pedralbes","a":"Carrer de Jordi Girona 31","dr":"El recinto de la Torre Girona data de 1860 y era la finca privada de veraneo del banquero y alcalde Manuel Girona. El conjunto consta de una casa de estilo neoclásico y unos jardines románticos. Posteriormente, en los años cuarenta del siglo XX se construyó la capilla —que se anexó al edificio—, de un estilo mucho más imponente. Con los años el recinto fue cambiando de usos, y hoy en día es la sede del rectorado de la Universidad Politécnica de Cataluña (UPC). En la capilla está el Barcelona Supercomputing Centre (BSC). La zona ajardinada que rodea los edificios son los vestigios de lo que fue un jardín histórico típico de finales del siglo XIX. Todavía se mantiene el estanque artificial original. Actualmente, la vegetación existente tiene la peculiaridad de ser una mezcla de vegetación autóctona mediterránea de carácter forestal o agrícola (encinas, lentiscos, durillos, pinos, olivos, etc.) mezclada con plantas propias de los jardines clásicos (fotinias, aligustres, tilos, pitósporos, etc.). En este último grupo de especies, destaca una antigua doble alineación de naranjos de Luisiana, los cuales están totalmente mezclados con la vegetación forestal. Se trata de una especie que casi no se utiliza actualmente y de la que tenemos muy pocos ejemplares en Barcelona. Hay que destacar que en estos momentos, dentro del jardín tenemos 3 árboles o conjuntos de árboles de Interés Local: un pino carrasco, un braquiquito y un conjunto de 2 pinos piñoneros.","drl":"Территория Торре-Герона относится к 1860 году и была частным летним имением банкира и мэра Мануэля Герона. Комплекс состоит из дома в неоклассическом стиле и романтических садов. Позднее, в сороковых годах XX века, там была построена часовня — присоединённая к зданию — в гораздо более внушительном стиле. С годами территория меняла назначение, и сегодня здесь находится резиденция ректората Политехнического университета Каталонии (UPC). В часовне размещается Барселонский суперкомпьютерный центр (BSC). Озеленённая зона, окружающая здания, — это остатки того, что было типичным историческим садом конца XIX века. Сохранился и первоначальный искусственный пруд. В настоящее время существующая растительность имеет особенность — это смесь местной средиземноморской растительности лесного или сельскохозяйственного характера (каменные дубы, мастиковые деревья, калина лавролистная, сосны, оливы и т. д.), перемешанной с растениями, свойственными классическим садам (фотинии, бирючина блестящая, липы, питоспорумы и т. д.). Среди видов последней группы выделяется старая двойная аллея деревьев-апельсинов Луизианы, которые полностью смешаны с лесной растительностью. Это вид, который в настоящее время почти не используется и от которого у нас в Барселоне очень мало экземпляров. Следует подчеркнуть, что в настоящее время в саду у нас есть 3 дерева или группы деревьев местного значения: алеппская сосна, брахихитон и группа из 2 пиний.","drh":"Маклюра оранжевая — североамериканское дерево с колючими ветками и крупными плодами, похожими на апельсины. Несъедобны, но отпугивают насекомых.","cn":"0194-04-19","cy":"2021","by":"","cd":"6 m","tp":"1,9 m","ow":""},{"n":"Cedres de les Antigues Casernes de Sant Andreu","ne":"","sr":"Кедр ливанский","r":"Cedrus","nru":"Кедр ливанский","s":"Cedrus libani","la":41.44452452200405,"ln":2.1927419675356608,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/99400661108-cedrus_liban.optimized.ff21bf88.jpg","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/cedres-de-les-antigues-casernes-de-sant-andreu-99400661108","d":"Sant Andreu","h":"Sant Andreu","a":"Carrer de Fernando Pessoa 59","dr":"El cedro del Líbano es un árbol originario de las montañas del Líbano, el oeste de Siria y el centro-sur de Turquía. El conjunto está formado por 4 cedros alineados en hilera, separados cada uno de ellos por unos 10 m. Integrado en medio de las ramas horizontales de los dos cedros centrales, se sitúa un quinto árbol, en este caso, un ciprés (Cupressus sempervirens). Este espacio forma parte de una superficie mucho más grande que antiguamente formaba parte de los Cuarteles Militares de Sant Andreu.","drl":"Ливанский кедр — дерево родом из гор Ливана, запада Сирии и центрального юга Турции. Группа состоит из 4 кедров, выстроенных в ряд, отстоящих друг от друга примерно на 10 м. Среди горизонтальных ветвей двух центральных кедров расположено пятое дерево, в данном случае кипарис (Cupressus sempervirens). Это пространство входит в состав гораздо более крупной территории, которая прежде была частью Военных казарм Сант-Андреу.","drh":"Кедр ливанский — хвойное дерево, символ Ливана. Отличается широкой плоской кроной и тёмно-зелёной хвоей.","cn":"0188-09-19","cy":"2019","by":"1958","cd":"20 m","tp":"2,5 m","ow":"Municipal"},{"n":"Tipuana de la plaça Carles Buïgas","ne":"","sr":"Типуана","r":"типуана","nru":"Типуана площади Carles Buïgas","s":"Tipuana tipu","la":41.3720831114975,"ln":2.153335227486626,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/99400661117-tipuana.JPG","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/tipuana-de-la-placa-carles-buigas-99400661117","d":"Sants-Montjuïc","h":"el Poble-sec","a":"Plaça de Carles Buïgas 8","dr":"La tipuana es un árbol originario de América del Sur, que fue introducido en la ciudad a principios del siglo XX. Actualmente es una de las especies más comunes en nuestra ciudad. En este caso, podría ser el ejemplar más grande (en perímetro) del que se tiene constancia en la ciudad de Barcelona. Proviene sin duda de las primeras plantaciones que se realizaron en los años 20 del siglo XX en la ciudad de Barcelona. En este caso, la plantación se habría realizado en 1925.","drl":"Типуана — дерево родом из Южной Америки, которое было завезено в город в начале XX века. В настоящее время это один из самых распространённых видов в нашем городе. В данном случае это мог бы быть самый крупный (по обхвату) экземпляр, о котором имеются сведения в городе Барселоне. Он, несомненно, происходит из первых посадок, проведённых в 20-е годы XX века в городе Барселоне. В данном случае посадка была бы произведена в 1925 году.","drh":"Типуана — южноамериканское дерево с перистыми листьями и жёлтыми цветами. Хорошо переносит городские условия.","cn":"0191-03-19","cy":"","by":"1925","cd":"23 m","tp":"3,3 m","ow":"Municipal"},{"n":"Araucaria de la Tamarita","ne":"","sr":"Араукария Каннингема","r":"араукария","nru":"Араукария Каннингема","s":"Araucaria cunninghamii","la":41.41017796184795,"ln":2.135974291617134,"im":"https://estatics-nasia.dtibcn.cat/nasia-pro/media/99400661141-araucaria.JPG","u":"https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local/araucaria-de-la-tamarita-99400661141","d":"Sarrià-Sant Gervasi","h":"Sant Gervasi - la Bonanova","a":"Passeig de Sant Gervasi 45","dr":"La araucaria de Australia es endémica de los bosques lluviosos del este de Australia y Nueva Guinea. Es una especie rara en los jardines de nuestro país. De hecho, es la única especie conocida en Barcelona. Además, supera en tamaño (al menos en perímetro) a todas las demás especies de araucarias de las que se tiene constancia en la ciudad. La excepcionalidad de este ejemplar se ve incrementada por estar situado en uno de los jardines históricos más bellos de la ciudad: los jardines de la Tamarita.","drl":"Австралийская араукария — эндемик дождевых лесов востока Австралии и Новой Гвинеи. Это редкий вид в садах нашей страны. Более того, это единственный известный вид в Барселоне. Кроме того, по размеру (по крайней мере по обхвату) она превосходит все другие виды араукарий, о которых имеются сведения в городе. Исключительность этого экземпляра усиливается тем, что он находится в одном из самых красивых исторических садов города: садах Ла-Тамарита.","drh":"Араукария Каннингема — хвойное дерево из тропических лесов Австралии и Новой Гвинеи.","cn":"0187-05-19","cy":"","by":"1918","cd":"4 m","tp":"2 m","ow":"Municipal"}];

function splitRussian(raw){
  if(!raw) return {species:'', location:''};
  const dash = raw.indexOf(' — ');
  if(dash > 0){
    return {species: raw.slice(0, dash).trim(), location: raw.slice(dash+3).trim()};
  }
  return {species: raw.trim(), location:''};
}

function calculateAge(birthYear){
  const y = parseInt(String(birthYear||'').replace(/[^\d]/g, ''), 10);
  if(!y || y < 1000 || y > 2030) return '';
  const now = new Date().getFullYear();
  const age = now - y;
  if(age < 1) return '';
  return '~' + age;
}

function normalizeUnit(val, unit){
  if(!val) return '';
  let s = String(val).trim();
  // Убираем любую единицу в конце (m, м, M)
  s = s.replace(/\s*[mMмМ]\s*$/, '').trim();
  // Если в середине остались буквы — оставляем как есть
  if(/[a-zA-Zа-яА-Я]/.test(s)) return s;
  return s + '\u00A0' + unit;
}

function dedupeText(longDesc, shortDesc){
  if(!longDesc) return shortDesc ? [shortDesc] : [];
  if(!shortDesc) return [longDesc];
  const a = longDesc.toLowerCase();
  const b = shortDesc.toLowerCase().slice(0, 80);
  if(b && a.includes(b.slice(0, 50))) return [longDesc];
  return [shortDesc, longDesc];
}

function pluralYears(n){
  if(LANG === 'es') return 'años';
  const nn = n % 100;
  if(nn >= 11 && nn <= 19) return 'лет';
  const last = n % 10;
  if(last === 1) return 'год';
  if(last >= 2 && last <= 4) return 'года';
  return 'лет';
}


/* ============ ОЧИСТКА ОПИСАНИЯ ОТ ОБЩЕГО ТЕКСТА О ВИДЕ ============ */
function cleanInstanceDescription(longText, speciesHint){
  if(!longText) return '';
  const hint = (speciesHint||'').toLowerCase().trim();
  const hintSnippet = hint ? hint.slice(0, 50) : '';

  // Разбиваем на абзацы (двойной перенос строки) или на предложения
  const paragraphs = longText.split(/\n\s*\n|(?<=[.!?])\s{2,}/);

  // Общие паттерны энциклопедического вступления
  const genericPatterns = [
    /^род\s+/i,
    /^семейство\s+/i,
    /^вид\s+/i,
    /^[А-Яа-яёЁ][\w\s]{2,40} — (?:крупн|низкоросл|вечнозел|листопадн|декоративн|хвойн|лиственн|тропическ|средиземноморск|быстрораст|медленнораст|одно из самых)/i,
    /^[А-Яа-яёЁ][\w\s]{2,40} — [а-яё]+ (?:дерево|кустарник|пальма|растение|вид)/i,
    /^[A-Z][a-z]+ — /, // латинское имя в начале
    /(?:происходит|родом|родина|привезен|привезён|завезен|завезён) (?:из|с)/i,
    /^это (?:дерево|кустарник|пальма|растение)/i,
  ];

  const isGeneric = (p) => {
    const pl = p.toLowerCase().trim();
    if(pl.length < 20) return false;
    if(hintSnippet && pl.includes(hintSnippet)) return true;
    return genericPatterns.some(re => re.test(p.trim()));
  };

  // Фильтруем: оставляем абзацы, которые описывают конкретный экземпляр
  const clean = paragraphs.filter(p => !isGeneric(p));

  // Если после фильтра ничего не осталось — возвращаем оригинал целиком
  const result = clean.join('\n\n').trim();
  return result.length > 40 ? result : longText;
}

function onP(p){

function onE(e){$('#gps').classList.remove('active');watchId=null;toast('GPS: '+(e.message||'ошибка'))}
function hav(a,b){const R=6371000,r=d=>d*Math.PI/180,dLa=r(b[0]-a[0]),dLo=r(b[1]-a[1]),x=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function disc(){
  if(!userLL) return;
  TREES.forEach(t=>{
    const d = hav(userLL,[t.la,t.ln]), k = t.n+t.la;
    if(d<=30 && !opened.has(k)){
      opened.add(k);
      const nw = !visited.has(k);
      if(nw){
        visited.add(k); saveV();
        if(mks[k]) mks[k].setIcon(mkIcon(t,false));
        renderPanel(); renderChips();
        toast('🌳 '+(t.r||t.n));
      }
    }
    if(d>45) opened.delete(k);
  });
}

/* ============ SHEET DRAG ============ */
const panel = $('#panel');
const dragZone = $('#dragZone');
let drag = {active:false, y0:0, s0:null, moved:false, pid:null, lastY:0, lastT:0, v:0};

function sheetY(state){
  const vh = window.innerHeight;
  if(state==='collapsed') return vh - 96 - 72;
  if(state==='expanded')  return 0;
  return 0;
}
function setSheet(state){
  panel.dataset.state = state;
  panel.removeAttribute('data-dragging');
}
const __restoreBtn = document.getElementById('sheetRestore');
if(__restoreBtn) __restoreBtn.onclick = () => setSheet('collapsed');

dragZone.addEventListener('pointerdown', e=>{
  if(window.innerWidth > 768) return;
  drag.active=true; drag.y0=e.clientY; drag.lastY=e.clientY;
  drag.lastT=performance.now(); drag.v=0;
  drag.s0=panel.dataset.state||'collapsed';
  drag.moved=false; drag.pid=e.pointerId;
  panel.setAttribute('data-dragging','1');
  try{ panel.setPointerCapture(e.pointerId); }catch(_){}
});
dragZone.addEventListener('pointermove', e=>{
  if(!drag.active) return;
  const dy = e.clientY - drag.y0;
  if(Math.abs(dy) > 4) drag.moved = true;
  const vh = window.innerHeight;
  const start = sheetY(drag.s0);
  let y = Math.max(0, Math.min(vh - 96 - 72, start + dy));
  panel.style.transform = `translateY(${y}px)`;
  const now = performance.now();
  const dt = now - drag.lastT;
  if(dt > 0){ drag.v = (e.clientY - drag.lastY) / dt; drag.lastY = e.clientY; drag.lastT = now; }
});
dragZone.addEventListener('pointerup', e=>{
  if(!drag.active) return;
  drag.active=false;
  try{ panel.releasePointerCapture(drag.pid); }catch(_){}
  const dy = e.clientY - drag.y0;
  const vh = window.innerHeight;
  const threshold = Math.min(vh * 0.15, 90);
  const VEL = 0.5;
  let target;
  if(!drag.moved)             target = (drag.s0 === 'collapsed') ? 'expanded' : 'collapsed';
  else if(drag.v >  VEL)      target = 'collapsed';
  else if(drag.v < -VEL)      target = 'expanded';
  else if(dy >  threshold)    target = 'collapsed';
  else if(dy < -threshold)    target = 'expanded';
  else                        target = drag.s0 || 'collapsed';
  panel.style.transform = '';
  setSheet(target);
});

// Нормализованное название: русский вид + каталанская локация отдельно
function formatTree(t){
  if(!t) t = {};
  var catObj = cat(t.s || '');
  var n = String(t.n || '').trim();
  var ne = String(t.ne || '').trim();
  var sr = String(t.sr || '').trim();
  var r  = String(t.r  || '').trim();
  var nru= String(t.nru || '').trim();
  var sci= String(t.s || '').trim();

  var species;
  if(LANG === 'ru'){
    // H1 = русское название (вид + локация)
    species = nru || sr || (r ? r.charAt(0).toUpperCase() + r.slice(1) : '') || sci.split(' ')[0] || 'Дерево';
  } else {
    species = ne || n || sci.split(' ')[0] || 'Дерево';
  }
  // Защита от мусора
  if(!species || species === 'undefined') species = 'Дерево';

  var subtitle = (n && n.toLowerCase() !== species.toLowerCase()) ? n : '';
  return {species: species, subtitle: subtitle, sci: sci, catObj: catObj};
}


function renderList(){
  if(!filters) filters = {};
  ['cat','dist','ownership','age','size','trunk'].forEach(function(k){
    if(!(filters[k] instanceof Set)) filters[k] = new Set();
  });

  var items = TREES.map(function(t,i){ return {t:t, i:i}; });
  if(filters.cat.size) items = items.filter(function(x){ return filters.cat.has(cat(x.t.s||'').key); });
  if(filters.dist.size) items = items.filter(function(x){ return filters.dist.has(x.t.d); });
  if(filters.ownership.size) items = items.filter(function(x){ return filters.ownership.has(x.t.ow); });
  if(filters.photo) items = items.filter(function(x){ return !!x.t.im; });
  if(filters.age.size) items = items.filter(function(x){
    var yr = parseInt(x.t.by); if(!yr) return false;
    return (filters.age.has('old')&&yr<1950)||(filters.age.has('mid')&&yr>=1950&&yr<=1990)||(filters.age.has('young')&&yr>1990);
  });
  if(filters.size.size) items = items.filter(function(x){
    var v = parseFloat(x.t.cd); if(isNaN(v)) return false;
    return (filters.size.has('big')&&v>15)||(filters.size.has('mid')&&v>=8&&v<=15)||(filters.size.has('small')&&v<8);
  });
  if(filters.trunk.size) items = items.filter(function(x){
    var v = parseFloat(x.t.tp); if(isNaN(v)) return false;
    return (filters.trunk.has('thick')&&v>3)||(filters.trunk.has('mid')&&v>=1&&v<=3)||(filters.trunk.has('thin')&&v<1);
  });
  if(q){
    var terms = _norm(q).split(/\s+/).filter(Boolean);
    items = items.filter(function(x){
      var t = x.t;
      var hay = _norm([t.n,t.ne,t.sr,t.r,t.s,t.d,t.h,t.a,t.dr,t.drl,t.drh,t.cn,t.cy,t.by,t.cd,t.tp,t.ow].filter(Boolean).join(' '));
      return terms.every(function(term){ return hay.indexOf(term) !== -1; });
    });
  }

  var lbl = T('all');
  if(userLL){
    items.forEach(function(x){ x.d = hav(userLL,[x.t.la,x.t.ln]); });
    items.sort(function(a,b){ return a.d - b.d; });
    lbl = T('nearby');
  } else {
    items.sort(function(a,b){
      var va = visited.has(a.t.n+a.t.la) ? 1 : 0;
      var vb = visited.has(b.t.n+b.t.la) ? 1 : 0;
      return va - vb;
    });
  }

  // Обновляем карту
  var visible = new Set(items.map(function(x){ return x.t.n + x.t.la; }));
  cluster.clearLayers();
  Object.keys(mks).forEach(function(k){ if(visible.has(k)) cluster.addLayer(mks[k]); });

  var panelScroll = document.getElementById('panelScroll');
  if(!panelScroll) return;

  if(items.length === 0){
    panelScroll.innerHTML = '<div class="empty"><div class="i">🌿</div><p>' + T('noRes') + '</p></div>';
    return;
  }

  var cardsHtml = items.slice(0, 80).map(function(x){
    var t = x.t;
    var ft = formatTree(t);
    var v = visited.has(t.n + t.la);
    var d = x.d;
    var dist = (d != null)
      ? (d < 1000 ? Math.round(d) + ' м' : (d/1000).toFixed(1) + ' км')
      : '';
    var thumb = t.im
      ? '<img src="' + t.im + '" loading="lazy">'
      : ft.catObj.emoji;
    var addrLine = String(t.a || '').trim();
    var locLine = [t.d, t.h].filter(Boolean).join(' · ');
    var addrFull = addrLine + (locLine ? (addrLine ? ' · ' : '') + locLine : '');

    return '<div class="card' + (v ? ' visited' : '') + '" data-i="' + x.i + '">' +
      '<div class="card-img">' + thumb + '</div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + esc(ft.species) + '</div>' +
        (addrFull ? '<div class="card-addr">' + esc(addrFull) + '</div>' : '') +
        (v ? '<div class="badge-v">✓ ' + T('visited') + '</div>' : '') +
      '</div>' +
      (dist ? '<div class="card-dist">' + dist + '</div>' : '') +
    '</div>';
  }).join('');

  panelScroll.innerHTML =
    '<div class="list-head">' +
      '<h2 class="list-title">Árboles de interés local de Barcelona</h2>' +
      '<button class="info-btn-header" id="infoBtnHeader" aria-label="Info">i</button>' +
    '</div>' +
    '<div class="list-count">' + esc(lbl) + ' · ' + items.length + '</div>' +
    '<div class="list">' + cardsHtml + '</div>';

  // Клики
  var cards = panelScroll.querySelectorAll('.card');
  for(var c = 0; c < cards.length; c++){
    (function(el){
      el.addEventListener('click', function(ev){
        ev.preventDefault();
        var idx = parseInt(el.getAttribute('data-i'), 10);
        if(!isNaN(idx)) openDetail(idx, true);
      });
    })(cards[c]);
  }
}

function renderDetail(i){

  const route = `https://www.google.com/maps/dir/?api=1&destination=${t.la},${t.ln}`;

    ? `<img src="${t.im}" alt="" onerror="this.parentNode.classList.add('no-img');this.remove()">`
    : `<div class="hero-fb">${catObj.emoji}</div>`;
  const heroClass = t.im ? 'detail-hero' : 'detail-hero no-img';

  // Категория
  const catLine = catName(catObj.key);

  // Характеристики 2×2
  const specs = [];
  if(t.cn) specs.push([T('catNum'), t.cn]);
  if(t.cy) specs.push([T('catYear'), t.cy + (LANG==='ru'?' г.':'')]);
  if(t.by){
    const age = calculateAge(t.by);

    } else {
      specs.push([T('birthYear'), t.by]);

  if(t.ow) specs.push([T('ownership'), t.ow==='Públic'?T('ownPub'):t.ow==='Privat'?T('ownPriv'):t.ow]);

  // Описание
  const longDesc = LANG==='ru' ? (t.drl || t.dr || '') : (t.dr || t.drl || '');

  const cats = CATS.map(c=>{
    const on = (curCat === c.key);
    return `<button class="chip${on?' on':''}" data-k="${c.key}"><span class="dot" style="background:${c.color}"></span>${c.emoji} ${catName(c.key)}</button>`;
  }).join('');
  el.innerHTML = firstChip + cats;
  el.querySelector('[data-reset="all"]').onclick = ()=>{
    if(activeFilterCount() === 0) return;
    resetAll();
  };
  el.querySelectorAll('.chip[data-k]').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k;
      filters.cat.clear();
      filters.cat.add(k);
      renderChips();
      renderPanel();
      renderActiveFilters();
    };
  });
}

function resetAll(){
  Object.keys(filters).forEach(k=>{
    if(filters[k] instanceof Set) filters[k].clear();
    else filters[k] = false;
  });
  q = '';
  $('#search').value = '';
  $('#searchClear').hidden = true;
  renderChips();
  renderPanel();
  renderActiveFilters();
}

function renderActiveFilters(){
  const el = $('#activeFilters');
  const chips = [];
  const labels = {
    dist:(v)=>v,
    ownership:(v)=>v==='Públic'?T('ownPub'):v==='Privat'?T('ownPriv'):v,
    age:(v)=>({old:T('ageOld'),mid:T('ageMid'),young:T('ageYoung')})[v],
    size:(v)=>({big:T('sizeBig'),mid:T('sizeMid'),small:T('sizeSmall')})[v],
    trunk:(v)=>({thick:T('trunkThick'),mid:T('trunkMid'),thin:T('trunkThin')})[v],
    visited:(v)=>v==='yes'?T('visYes'):T('visNo'),
    cat:(v)=>catName(v)
  };
  for(const [key,set] of Object.entries(filters)){
    if(key==='photo'){ if(filters.photo) chips.push({key:'photo', value:true, label:T('onlyPhoto')}); continue; }
    for(const v of set){
      const label = labels[key] ? labels[key](v) : v;
      chips.push({key, value:v, label});
    }
  }
  if(!chips.length){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.classList.add('show');
  el.innerHTML = chips.map(c=>`<span class="af-chip">${esc(c.label)}<button data-k="${c.key}" data-v="${c.value}">✕</button></span>`).join('');
  el.querySelectorAll('.af-chip button').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k, v = b.dataset.v;
      if(k==='photo') filters.photo = false;
      else filters[k].delete(v);
      renderActiveFilters();
      renderChips();
      renderPanel();
    };
  });
}

/* ============ FILTER MODAL ============ */
function renderFilterModal(){
  const dists = [...new Set(TREES.map(t=>t.d).filter(Boolean))].sort();
  const sec = (title,html)=>`<div class="f-sec"><div class="f-title">${title}</div>${html}</div>`;
  const chipsRow = (items,key)=>`<div class="f-chips">${items.map(it=>{
    const s = filters[key];
    const on = (s instanceof Set) && s.has(it.v);
    return `<button class="f-chip${on?' on':''}" data-k="${key}" data-v="${it.v}">${it.l}</button>`;
  }).join('')}</div>`;
  $('#fBody').innerHTML =
    sec(T('catTitle'), chipsRow(CATS.map(c=>({l:c.emoji+' '+catName(c.key), v:c.key})), 'cat')) +
    sec(T('distTitle'), chipsRow(dists.map(d=>({l:d,v:d})), 'dist')) +
    sec(T('ownTitle'), chipsRow([{l:T('ownPub'),v:'Públic'},{l:T('ownPriv'),v:'Privat'}], 'ownership')) +
    sec(T('ageTitle'), chipsRow([{l:T('ageOld'),v:'old'},{l:T('ageMid'),v:'mid'},{l:T('ageYoung'),v:'young'}], 'age')) +
    sec(T('sizeTitle'), chipsRow([{l:T('sizeBig'),v:'big'},{l:T('sizeMid'),v:'mid'},{l:T('sizeSmall'),v:'small'}], 'size')) +
    sec(T('trunkTitle'), chipsRow([{l:T('trunkThick'),v:'thick'},{l:T('trunkMid'),v:'mid'},{l:T('trunkThin'),v:'thin'}], 'trunk')) +
    sec(T('visTitle'), chipsRow([{l:T('visYes'),v:'yes'},{l:T('visNo'),v:'no'}], 'visited')) +
    sec(T('mediaTitle'), `<div class="f-row"><span>${T('onlyPhoto')}</span><label class="switch"><input type="checkbox" id="fPhoto" ${filters.photo?'checked':''}><span class="slider"></span></label></div>`);
  $('#fBody').querySelectorAll('.f-chip').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k, v = b.dataset.v;
      const s = filters[k];
      if(s.has(v)) s.delete(v); else s.add(v);
      renderFilterModal();
      renderChips();
      renderPanel();
      renderActiveFilters();
    };
  });
  const ph = $('#fPhoto');
  if(ph) ph.onchange = ()=>{
    filters.photo = ph.checked;
    renderChips();
    renderPanel();
    renderActiveFilters();
  };
}

$('#openFilters').onclick = ()=>{
  renderFilterModal();
  $('#filterModal').classList.add('open');
};
$('#filterModal').onclick = (e)=>{
  if(e.target === $('#filterModal')) $('#filterModal').classList.remove('open');
};
$('#fCancel').onclick = ()=> $('#filterModal').classList.remove('open');
$('#fDone').onclick = ()=> $('#filterModal').classList.remove('open');

/* ============ SEARCH ============ */
const searchInput = $('#search');
const searchClear = $('#searchClear');
searchInput.addEventListener('input', e=>{
  q = e.target.value;
  searchClear.hidden = !q;
  renderPanel();
  renderChips();
  if(window.innerWidth<=768 && q && panel.dataset.state==='peek') setSheet('half');
});
searchClear.onclick = ()=>{
  q = ''; searchInput.value = ''; searchClear.hidden = true;
  renderPanel(); renderChips();
};

/* ============ KEYBOARD ============ */
window.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    const modal = $('#filterModal');
    if(modal && modal.classList.contains('open')){ modal.classList.remove('open'); return; }
    if(view === 'detail'){ closeDetail(); return; }
    if(activeFilterCount() > 0 || q){ resetAll(); return; }
  }
});

/* ============ LANG ============ */
function setLang(nl){
  if(nl === LANG) return;
  LANG = nl;
  localStorage.setItem('bcn_lang_v26', nl);
  document.documentElement.lang = nl;
  updateStatic();
  renderChips();
  renderPanel();
  renderActiveFilters();
}
function updateStatic(){
  searchInput.placeholder = T('search');
  $('#fTitle').textContent = T('filters');
  $('#fCancel').textContent = T('cancel');
  $('#fDone').textContent = T('done');
  $$('#langSwitch button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
}
$$('#langSwitch button').forEach(b=>{b.onclick = ()=>setLang(b.dataset.lang)});

/* ============ TOAST ============ */
function toast(m){
  const el = $('#toast');
  el.textContent = m;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 2200);
}

/* ============ URL PARAM ============ */
function checkUrlTree(){
  const m = new URLSearchParams(location.search).get('tree');
  if(!m) return;
  const idx = TREES.findIndex(t=>t.n===m);
  if(idx>=0) setTimeout(()=>openDetail(idx, true), 300);
}

/* ============ INIT ============ */
updateStatic();
renderChips();
renderPanel();
renderActiveFilters();
checkUrlTree();

if(window.innerWidth<=768) setSheet('peek');

setTimeout(()=>{ map.invalidateSize(); }, 100);



/* v44: force collapsed on mobile load */
document.addEventListener('DOMContentLoaded', function(){
  if(window.innerWidth <= 768){
    var p = document.getElementById('panel');
    if(p && p.dataset.state !== 'collapsed' && p.dataset.state !== 'expanded'){
      p.dataset.state = 'collapsed';
    }
  }
});
</script>
<script>
/* v48 info modal */
(function(){
  var I18N_INFO = {
    ru: {
      title: "Деревья местного значения в Барселоне",
      body: [
        "Реестр деревьев местного значения включает самые ценные экземпляры деревьев, пальм и кустарников, произрастающих на улицах и в частных садах Барселоны. Включение в этот реестр гарантирует их охрану, надлежащий уход и строго запрещает их вырубку или удаление.",
        "Процедура каталогизации утверждена Экологическим ордонансом городского совета Барселоны в 2011 году. Отбор экземпляров осуществляет Комиссия по каталогизации по запросам специалистов службы «Парки и сады», горожан и общественных организаций.",
        "<b>Критерии включения:</b> редкость, эстетические качества, историческая ценность, возраст и размер."
      ],
      ok: "Понятно",
      source: 'Данные предоставлены <a href="https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local" target="_blank" rel="noopener">мэрией Барселоны ↗</a>' 
    },
    es: {
      title: "Árboles de interés local de Barcelona",
      body: [
        "El Catálogo de árboles de interés local contiene los ejemplares de árboles, palmeras y arbustos más valiosos que hay en las calles y en los jardines particulares de Barcelona. La inclusión en este catálogo asegura su conservación y condiciones de desarrollo y en ningún caso permite su eliminación.",
        "El procedimiento de catalogación se recoge en la Ordenanza del medio ambiente del Ayuntamiento de Barcelona, aprobada en el 2011. La selección de los ejemplares es responsabilidad de la Comisión de Catalogación a petición de técnicos de Parques y Jardines, ciudadanía o entidades.",
        "<b>Criterios de inclusión:</b> rareza, cualidades estéticas, valor histórico, edad y tamaño."
      ],
      ok: "Entendido",
      source: 'Datos oficiales del <a href="https://www.barcelona.cat/es/que-hacer-en-bcn/parques-y-jardines/arboles-de-interes-local" target="_blank" rel="noopener">Ayuntamiento de Barcelona ↗</a>' 
    }
  };

  function currentLang(){
    try{ return (typeof LANG !== 'undefined' && I18N_INFO[LANG]) ? LANG : 'ru'; }
    catch(e){ return 'ru'; }
  }

  function fillModal(){
    var d = I18N_INFO[currentLang()];
    var t = document.getElementById('infoTitle');
    var b = document.getElementById('infoBody');
    var ok = document.getElementById('infoOk');
    if(t) t.textContent = d.title;
    if(b) b.innerHTML = d.body.map(function(p){ return '<p>' + p + '</p>'; }).join('');
    if(ok) ok.textContent = d.ok;
    var srcEl = document.getElementById('infoSource');
    if(srcEl) srcEl.innerHTML = d.source || '';
  }

  function openInfo(){
    fillModal();
    var m = document.getElementById('infoModal');
    if(m) m.classList.add('open');
    try{ sessionStorage.setItem('info_modal_shown','true'); }catch(e){}
  }
  function closeInfo(){
    var m = document.getElementById('infoModal');
    if(m) m.classList.remove('open');
  }

  function bind(){
    var c  = document.getElementById('infoClose');
    var ok = document.getElementById('infoOk');
    var m  = document.getElementById('infoModal');
    var hb = document.getElementById('infoBtnHeader');
    var mb = document.getElementById('infoBtnMap');
    if(c && !c._v48){ c._v48 = true; c.onclick = closeInfo; }
    if(ok && !ok._v48){ ok._v48 = true; ok.onclick = closeInfo; }
    if(m && !m._v48){ m._v48 = true; m.onclick = function(e){ if(e.target === m) closeInfo(); }; }
    if(hb && !hb._v48){ hb._v48 = true; hb.onclick = openInfo; }
    if(mb && !mb._v48){ mb._v48 = true; mb.onclick = openInfo; }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
  setTimeout(bind, 300);

  // Auto-show on first visit in this session
  try{
    if(!sessionStorage.getItem('info_modal_shown')){
      setTimeout(openInfo, 500);
    }
  }catch(e){}

  // Update modal text on language switch
  try{
    if(typeof setLang === 'function' && !setLang._v48){
      var _orig = setLang;
      window.setLang = function(l){
        var r = _orig.apply(this, arguments);
        try{ fillModal(); }catch(e){}
        return r;
      };
      window.setLang._v48 = true;
    }
  }catch(e){}

  // Ребёнд при перерисовке list-head
  try{
    var obs = new MutationObserver(function(){
      var hb = document.getElementById('infoBtnHeader');
      if(hb && !hb._v48){
        hb._v48 = true;
        hb.onclick = openInfo;
      }
    });
    obs.observe(document.body, {childList:true, subtree:true});
  }catch(e){}

  console.log('[v48] info modal ready');
})();
</script>

<script>
/* v49 lightbox */
(function(){
  var lb = null, lbImg = null, lbCaption = null;

  function buildLightbox(){
    if(lb) return;
    lb = document.createElement('div');
    lb.className = 'lightbox-overlay';
    lb.id = 'lightboxOverlay';
    lb.innerHTML = ''
      + '<button class="lightbox-close" id="lbClose" aria-label="Close">×</button>'
      + '<div class="lightbox-stage" id="lbStage">'
      +   '<img class="lightbox-img" id="lbImg" alt="">'
      + '</div>'
      + '<div class="lightbox-caption" id="lbCaption"></div>';
    document.body.appendChild(lb);
    lbImg = document.getElementById('lbImg');
    lbCaption = document.getElementById('lbCaption');

    // --- Закрытие: клик по фону, кнопка × ---
    lb.addEventListener('click', function(e){
      if(e.target === lb || e.target.id === 'lbStage'){
        closeLightbox();
      }
    });
    document.getElementById('lbClose').addEventListener('click', closeLightbox);

    // --- ESC ---
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
    });

    // --- DOUBLE TAP → zoom 100% / сброс ---
    var lastTap = 0, zoomed = false;
    lbImg.addEventListener('touchend', function(e){
      var t = Date.now();
      if(t - lastTap < 300){
        e.preventDefault();
        zoomed = !zoomed;
        lbImg.style.transform = zoomed ? 'scale(2)' : 'scale(1)';
      }
      lastTap = t;
    }, {passive:false});

    // --- PINCH-TO-ZOOM + SWIPE-DOWN ---
    var pinchDist0 = 0, pinchScale0 = 1, curScale = 1;
    var dragY0 = 0, dragging = false, moved = false;

    lb.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){
        // pinch начался
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchDist0 = Math.hypot(dx, dy);
        pinchScale0 = curScale;
      } else if(e.touches.length === 1 && curScale === 1){
        dragY0 = e.touches[0].clientY;
        dragging = true;
        moved = false;
      }
    }, {passive:true});

    lb.addEventListener('touchmove', function(e){
      if(e.touches.length === 2 && pinchDist0 > 0){
        e.preventDefault();
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var d = Math.hypot(dx, dy);
        curScale = Math.max(1, Math.min(4, pinchScale0 * (d / pinchDist0)));
        lbImg.style.transform = 'scale(' + curScale + ')';
        zoomed = curScale > 1.05;
      } else if(dragging && e.touches.length === 1 && curScale === 1){
        var dy2 = e.touches[0].clientY - dragY0;
        if(Math.abs(dy2) > 6){ moved = true; }
        if(dy2 > 0){
          lb.classList.add('dragging');
          lbImg.style.transform = 'translateY(' + dy2 + 'px)';
          lbImg.style.opacity = String(Math.max(.3, 1 - dy2/500));
        }
      }
    }, {passive:false});

    lb.addEventListener('touchend', function(e){
      if(dragging && moved && curScale === 1){
        var dy = (e.changedTouches[0] ? e.changedTouches[0].clientY : dragY0) - dragY0;
        lb.classList.remove('dragging');
        if(dy > 100){
          closeLightbox();
        } else {
          lbImg.style.transform = '';
          lbImg.style.opacity = '';
        }
      }
      dragging = false;
      moved = false;
      if(e.touches.length < 2){ pinchDist0 = 0; }
    }, {passive:true});
  }

  function openLightbox(imgSrc, title, addr){
    buildLightbox();
    lbImg.src = imgSrc;
    lbImg.style.transform = '';
    lbImg.style.opacity = '';
    var cap = '';
    if(title){ cap += '<b>' + title + '</b>'; }
    if(addr){ cap += addr; }
    lbCaption.innerHTML = cap;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    if(!lb) return;
    lb.classList.remove('open');
    lb.classList.remove('dragging');
    if(lbImg){ lbImg.style.transform = ''; lbImg.style.opacity = ''; }
    document.body.style.overflow = '';
  }

  // --- Клик по фото в карточке дерева → открыть lightbox ---
  document.addEventListener('click', function(e){
    var t = e.target;
    if(!t || !t.closest) return;
    // клик по кнопке закрытия детальной карточки или другим кнопкам — пропускаем
    if(t.closest('button, a, input, select, textarea')) return;
    var hero = t.closest('.detail-hero, .hero');
    if(!hero) return;
    var img = hero.querySelector('img');
    if(!img || !img.src) return;
    e.preventDefault();
    e.stopPropagation();
    // название и адрес из карточки
    var titleEl = document.querySelector('.detail-title, .v-title');
    var addrEl  = document.querySelector('.addr-card b, .location-info b');
    var title = titleEl ? titleEl.textContent.trim() : '';
    var addr  = addrEl  ? addrEl.textContent.trim() : '';
    openLightbox(img.src, title, addr);
  }, true);

  // --- Добавляем бейдж-⤢ на каждое hero после рендера ---
  function decorateHeroes(){
    document.querySelectorAll('.detail-hero, .hero').forEach(function(hero){
      if(hero.querySelector('.expand-badge')) return;
      if(!hero.querySelector('img')) return;
      var b = document.createElement('div');
      b.className = 'expand-badge';
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">'
        + '<path d="M15 3h6v6"/>'
        + '<path d="M9 21H3v-6"/>'
        + '<path d="M21 3l-7 7"/>'
        + '<path d="M3 21l7-7"/>'
        + '</svg>';
      hero.appendChild(b);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', decorateHeroes);
  } else {
    decorateHeroes();
  }

  // Ребейнд при перерисовке
  try{
    var obs = new MutationObserver(function(){
      window.requestAnimationFrame(decorateHeroes);
    });
    obs.observe(document.body, {childList:true, subtree:true});
  }catch(e){}

  console.log('[v49] lightbox ready');
})();
</script>
